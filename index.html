    const f=e.target.files&&e.target.files[0]; if(!f) return;
    setFileName(f.name); setRows([]); setSheets([]); setWbRef(null);
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
        setWbRef(wb); setSheets(wb.SheetNames);
        if(wb.SheetNames.length===1) parseSheet(wb, wb.SheetNames[0]);
      }catch(err){ console.error(err); toast('Errore nella lettura del file','error'); }
    };
    reader.readAsArrayBuffer(f);
    e.target.value='';
  }

  const setRow=(i,k,v)=>setRows(rs=>rs.map((r,j)=>{
    if(j!==i) return r;
    const nr={...r,[k]:v};
    // se cambiando verso o contropartita la categoria non appartiene più a una sezione ammessa, la azzero
    if((k==='tipo'||k==='contro') && nr.cat){
      const sez=(categorie||[]).find(c=>nk(c.nome)===nk(nr.cat));
      const ok = LIQ_CODES.includes(nr.contro) ? ['interno'] : (nr.tipo==='E' ? ['entrata'] : ['uscita','investimento']);
      if(sez && !ok.includes(sez.sezione)) nr.cat='';
    }
    return nr;
  }));
  const delRow=i=>setRows(rs=>rs.filter((_,j)=>j!==i));

  const validi = rows.filter(r=>r.data&&r.cod&&r.contro&&r.importo>0&&r.tipo);
  const incompleti = rows.length - validi.length;
  const senzaCat = rows.filter(r=>!r.cat && !LIQ_CODES.includes(r.contro)).length;

  function importa(){
    if(busyRef.current) return;                    // doppio click: il secondo viene ignorato
    if(validi.length===0){ toast('Nessuna riga completa da importare','error'); return; }
    busyRef.current=true; setImporting(true);

    const isGiro=r=>LIQ_CODES.includes(r.contro);
    const mk=r=>({
      id:uid(), data:r.data, descr:r.descr||(isGiro(r)?'Giroconto':(r.tipo==='E'?'Entrata':'Uscita')),
      righe: r.tipo==='E' ? [{c:r.cod,d:r.importo,a:0},{c:r.contro,d:0,a:r.importo}]
                          : [{c:r.contro,d:r.importo,a:0},{c:r.cod,d:0,a:r.importo}],
      origine:'manuale', tipo: isGiro(r)?'giroconto':'liquidita', cat:(r.cat||'').trim()
    });
    // scarta le righe già presenti in contabilità (stessa data, descrizione, conti e importo)
    const esistenti=new Set((scritture||[]).map(scrKey));
    const scrit=[]; let gia=0;
    validi.forEach(r=>{
      const s=mk(r); const k=scrKey(s);
      if(esistenti.has(k)){ gia++; return; }
      esistenti.add(k); scrit.push(s);
    });

    // memorizza mappatura categoria -> conto (sia il nome del file sia quello scelto)
    const nuovaMappa={...(mappa||{})};
    validi.forEach(r=>{
      if(r.catFile) nuovaMappa[normKey(r.catFile)]=r.contro;
      if(r.cat) nuovaMappa[normKey(r.cat)]=r.contro;
    });

    // svuota subito la tabella: le righe importate spariscono e non si possono reimportare
    setRows([]); setFileName(''); setSheets([]); setWbRef(null);
    if(fileRef.current) fileRef.current.value='';
    // prima salva le scritture, poi la mappatura (un errore sulla mappatura non deve far perdere l'import)
    if(scrit.length) onAddMany(scrit);
    try{ setMappa(nuovaMappa); }catch(e){ console.error('Mappatura non salvata',e); }

    if(scrit.length && gia) toast(`${scrit.length} scritture importate · ${gia} già presenti, saltate`,'success');
    else if(scrit.length) toast(`${scrit.length} scritture importate`,'success');
    else toast(`Nessuna nuova scrittura: ${gia} movimenti erano già in contabilità`,'error');

    setTimeout(()=>{ busyRef.current=false; setImporting(false); },1200);
  }

  function scaricaModello(){
    if(!window.XLSX){ toast('Libreria non caricata','error'); return; }
    const aoa=[
      ['Data','Conto','Tipo','Categoria','Descrizione','Importo'],
      ['2026-01-15','BPER C/C','Uscita','ALIMENTARE','Spesa supermercato',42.50],
      ['2026-01-27','BPER C/C','Entrata','LAVORO','Stipendio',1450.00],
      ['2026-01-28','CASSA','Uscita','RISTORANTE','Pranzo',18.00],
    ];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),'Movimenti');
    XLSX.writeFile(wb,'Modello_import_movimenti.xlsx');
  }

  return (
    <div>
      <PageHead title="Import movimenti" sub="Carica un Excel dell'estratto conto e assegna i conti contabili">
        <button className="btn ghost" onClick={scaricaModello}>↓ Scarica modello</button>
        <button className="btn accent" onClick={()=>fileRef.current&&fileRef.current.click()}>↑ Carica Excel</button>
        <input type="file" ref={fileRef} accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={onFile}/>
      </PageHead>

      {sheets.length>1 &&
        <div className="card" style={{marginBottom:14,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <span style={{fontSize:13,color:'var(--ink-2)'}}><b>{fileName}</b> · {sheets.length} fogli. Scegli quale importare:</span>
          <select onChange={e=>{ if(e.target.value!=='') parseSheet(wbRef, e.target.value); else setRows([]); }} defaultValue="">
            <option value="">— seleziona foglio —</option>
            {sheets.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
        </div>}

      {rows.length===0 && sheets.length<=1 &&
        <div className="card">
          <div className="card-title">Formato del foglio</div>
          <p style={{color:'var(--ink-2)',fontSize:13,marginTop:0}}>Il foglio deve avere una riga di intestazione con queste colonne (l'ordine è libero, i nomi sono riconosciuti anche con piccole varianti):</p>
          <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10}}>
            {['Data','Conto','Tipo','Categoria','Descrizione','Importo'].map(c=><span key={c} className="pill">{c}</span>)}
          </div>
          <ul style={{color:'var(--ink-2)',fontSize:13,lineHeight:1.7,marginBottom:0}}>
            <li><b>Conto</b>: il conto di liquidità (BPER C/C, Prepagata, Cassa).</li>
            <li><b>Tipo</b>: Entrata o Uscita. Se manca, viene dedotto dal segno dell'importo.</li>
            <li><b>Categoria</b>: se coincide con una categoria di rendiconto già esistente viene proposta in automatico, altrimenti la riga arriva senza categoria (trattino) e la scegli tu dalla tendina. Serve anche a proporre il conto contabile, e la mappatura viene ricordata per gli import successivi.</li>
            <li><b>Importo</b>: numero positivo (il verso lo dà il Tipo).</li>
          </ul>
        </div>}

      {rows.length>0 && <>
        <div className="card" style={{marginBottom:14,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
          <div style={{fontSize:13,color:'var(--ink-2)'}}>
            <b>{fileName}</b> · {rows.length} movimenti · <span style={{color:'var(--success)'}}>{validi.length} pronti</span>{incompleti>0&&<span style={{color:'var(--warn)'}}> · {incompleti} da completare (assegna la contropartita)</span>}{senzaCat>0&&<span style={{color:'var(--ink-3)'}}> · {senzaCat} senza categoria RF</span>}
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn ghost" onClick={()=>{setRows([]);setFileName('');setSheets([]);setWbRef(null);}}>Annulla</button>
            <button className="btn accent" onClick={importa} disabled={validi.length===0||importing}>{importing?'Importazione…':`Importa ${validi.length} scritture`}</button>
          </div>
        </div>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr><th>Data</th><th>Conto liquidità</th><th>Tipo</th><th>Categoria</th><th>Descrizione</th><th className="num">Importo</th><th>Conto contabile (contropartita)</th><th></th></tr></thead>
            <tbody>
              {rows.map((r,i)=>(
                <tr key={i} style={r.contro?{}:{background:'#fbf6e8'}}>
                  <td><input type="date" value={r.data} onChange={e=>setRow(i,'data',e.target.value)} style={{minWidth:130}}/></td>
                  <td><select value={r.cod} onChange={e=>setRow(i,'cod',parseInt(e.target.value))}>{CONTI.filter(c=>c.categoria==='DISP. LIQUIDE').map(c=><option key={c.codice} value={c.codice}>{c.nome}</option>)}</select></td>
                  <td><select value={r.tipo} onChange={e=>setRow(i,'tipo',e.target.value)}><option value="E">Entrata</option><option value="U">Uscita</option></select></td>
                  <td>
                    <CatSelect value={r.cat||''} onChange={v=>setRow(i,'cat',v)} categorie={categorie}
                      sezioni={sezioniDi(r)} style={{minWidth:170,fontSize:12}}
                      onCreate={()=>setNuovaCat({rowIndex:i, nome:r.catFile||'', sezione:sezDefaultDi(r)})}/>
                    {!r.cat && r.catFile && <div style={{fontSize:11,color:'var(--ink-3)',marginTop:3}} title={`Nel file: ${r.catFile}`}>— non in anagrafica: {r.catFile}</div>}
                  </td>
                  <td><input type="text" value={r.descr} onChange={e=>setRow(i,'descr',e.target.value)} style={{minWidth:160}}/></td>
                  <td className="num">{num2(r.importo)}</td>
                  <td>
                    <ContoSelect value={r.contro} onChange={v=>setRow(i,'contro',v)} filter={c=>c.codice!==r.cod}/>
                    {LIQ_CODES.includes(r.contro) && <span className="pill giroconto" style={{marginLeft:6}}>giroconto</span>}
                  </td>
                  <td><button className="btn ghost sm" onClick={()=>delRow(i)}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{fontSize:12,color:'var(--ink-3)',marginTop:10,fontStyle:'italic'}}>Le righe evidenziate non hanno ancora un conto contabile assegnato e non verranno importate finché non lo scegli. La scelta viene ricordata per categoria. La <b>categoria rendiconto</b> propone solo le categorie già esistenti e compatibili con il verso della riga (entrate per le attive, uscite e investimenti per le passive, interne per i giroconti); le categorie presenti nel file ma non in anagrafica vengono scartate e mostrate con un trattino, e da tendina puoi crearne una nuova al volo. Se come contropartita scegli un altro conto di liquidità (es. Prepagata), la riga viene registrata come <b>giroconto</b> tra i due conti ed esclusa dal rendiconto finanziario.</div>
      </>}

      <PulisciDuplicati scritture={scritture} onDeleteMany={onDeleteMany} toast={toast}/>

      {nuovaCat && <NuovaCategoriaModal
        nomeDefault={nuovaCat.nome} sezioneDefault={nuovaCat.sezione} categorie={categorie} toast={toast}
        onClose={()=>setNuovaCat(null)}
        onSave={c=>{
          setCategorie([...(categorie||[]),c]);
          const i=nuovaCat.rowIndex;
          setRows(rs=>rs.map((r,j)=>j===i?{...r,cat:c.nome}:r));
          setNuovaCat(null);
          toast&&toast(`Categoria “${c.nome}” creata`,'success');
        }}/>}
    </div>
  );
}


/* ============================================================
   PAGINA: CONTROLLER (contabilità analitica)
   ============================================================ */
/* ============ BUDGET (scenari, voci agganciate ai conti, consuntivo da partita doppia) ============ */
const NATURE = [
  {v:'ricavo', l:'Ricavo'},
  {v:'costo', l:'Costo'},
  {v:'patrimoniale', l:'Patrimoniale / Finanziario'},
];
function contiPerNatura(nat){
  return CONTI.filter(c=>{
    if(nat==='ricavo') return c.categoria==='RICAVI'||c.categoria==='RICAVI/COSTI';
    if(nat==='costo') return c.categoria==='COSTI'||c.categoria==='RICAVI/COSTI';
    return c.prospetto!=='CE';   // patrimoniale: conti di stato patrimoniale
  }).sort((a,b)=>a.nome.localeCompare(b.nome,'it'));
}
const isApertura = s => /apertur/i.test(s.descr||'');

/* saldo di un conto: economiche nel periodo, patrimoniali sempre a saldo pieno */
function movConto(scritture, cod, natura, da, a){
  let dare=0, avere=0;
  (scritture||[]).forEach(s=>{
    const eco = natura!=='patrimoniale';
    if(eco){
      if(isApertura(s)) return;
      const d=s.data||'';
      if(da && d<da) return;
      if(a && d>a) return;
    }
    (s.righe||[]).forEach(r=>{ if(r.c===cod){ dare+=(r.d||0); avere+=(r.a||0); } });
  });
  return natura==='ricavo' ? r2(avere-dare) : r2(dare-avere);
}

function BudgetVoceModal({voce, onSave, onClose}){
  const [d,setD]=useState(()=>({...voce}));
  const disponibili=contiPerNatura(d.natura);
  const toggleConto=cod=>setD(v=>({...v, conti:(v.conti||[]).includes(cod)?v.conti.filter(x=>x!==cod):[...(v.conti||[]),cod]}));
  return (
    <div className="modal-bg" onClick={e=>{if(e.target.className==='modal-bg')onClose();}}>
      <div className="modal" style={{maxWidth:640}}>
        <div className="modal-head"><h3>{voce.nuova?'Nuova voce di budget':'Modifica voce'}</h3><button className="btn ghost sm" onClick={onClose}>✕</button></div>
        <div className="modal-body">
          <div className="form-row"><label>Descrizione <span className="req">*</span></label>
            <input type="text" value={d.descr} onChange={e=>setD(v=>({...v,descr:e.target.value}))} placeholder="es. Stipendi PwC"/></div>
          <div className="form-row"><label>Natura</label>
            <select value={d.natura} onChange={e=>setD(v=>({...v,natura:e.target.value,conti:[]}))}>{NATURE.map(n=><option key={n.v} value={n.v}>{n.l}</option>)}</select></div>
          <div className="form-row"><label>Importo di budget €</label>
            <input type="number" min="0" step="0.01" value={d.importo} onChange={e=>setD(v=>({...v,importo:e.target.value.replace('-','')}))} placeholder="0,00"/></div>
          <div className="form-row"><label>Note</label>
            <input type="text" value={d.note||''} onChange={e=>setD(v=>({...v,note:e.target.value}))} placeholder="facoltative"/></div>
          <div className="form-row"><label>Conto di cassa (piano di cassa)</label>
            <select value={d.cassa!=null?d.cassa:''} onChange={e=>setD(v=>({...v,cassa:e.target.value}))}>
              <option value="">— nessuno —</option>
              {LIQ_CODES.map(cod=><option key={cod} value={cod}>{contoByCode[cod]?.nome}</option>)}
            </select></div>
          <div className="form-row"><label>Data prevista del flusso</label>
            <input type="date" value={d.dataFlusso||''} onChange={e=>setD(v=>({...v,dataFlusso:e.target.value}))}/>
            <div style={{fontSize:11,color:'var(--ink-3)',marginTop:4}}>Quando ti aspetti l’incasso o il pagamento. Serve per la proiezione dell’esposizione di cassa.</div>
          </div>
          <div className="form-row"><label>Conti collegati ({(d.conti||[]).length})</label>
            <div style={{maxHeight:210,overflowY:'auto',border:'1px solid var(--rule)',borderRadius:6,padding:'6px 10px'}}>
              {disponibili.length===0 && <div style={{fontSize:12,color:'var(--ink-3)',padding:'6px 0'}}>Nessun conto disponibile per questa natura</div>}
              {disponibili.map(c=>(
                <label key={c.codice} style={{display:'flex',alignItems:'center',gap:8,fontSize:12.5,padding:'3px 0',cursor:'pointer'}}>
                  <input type="checkbox" checked={(d.conti||[]).includes(c.codice)} onChange={()=>toggleConto(c.codice)}/>
                  <span className="mono" style={{color:'var(--ink-3)',minWidth:26}}>{c.codice}</span>{c.nome}
                </label>
              ))}
            </div>
            <div style={{fontSize:11.5,color:'var(--ink-3)',marginTop:6}}>Il consuntivo della voce è la somma dei movimenti su questi conti, presi dal libro giornale.</div>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:14,paddingTop:14,borderTop:'1px solid var(--rule)'}}>
            <button className="btn ghost" onClick={onClose}>Annulla</button>
            <button className="btn accent" onClick={()=>{ if(!d.descr.trim()){alert('Inserisci una descrizione');return;} onSave({...d,descr:d.descr.trim(),importo:parseFloat(d.importo)||0}); }}>Salva voce</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function naturaConto(c){
  if(!c) return 'patrimoniale';
  if(c.categoria==='RICAVI') return 'ricavo';
  if(c.categoria==='COSTI') return 'costo';
  if(c.categoria==='RICAVI/COSTI') return 'ricavo';
  return 'patrimoniale';
}

/* Modale creazione budget: nome, periodo e scelta dei conti da includere.
   I conti di liquidità sono inclusi di default e non deselezionabili. */
function NewBudgetModal({scritture, onCreate, onClose}){
  const [nome,setNome]=useState('Budget '+new Date().getFullYear());
  const [da,setDa]=useState('');
  const [a,setA]=useState('');
  const [q,setQ]=useState('');
  const [vista,setVista]=useState('movimentati');   // movimentati | ce | sp | tutti
  const liq=new Set(LIQ_CODES);
  const [sel,setSel]=useState(()=>new Set(LIQ_CODES));
  // conti effettivamente movimentati (nel periodo scelto)
  const movimentati=useMemo(()=>{
    const set=new Set();
    (scritture||[]).forEach(s=>{ const d=s.data||''; if(da&&d<da)return; if(a&&d>a)return; (s.righe||[]).forEach(r=>{ if((r.d||0)||(r.a||0)) set.add(r.c); }); });
    return set;
  },[scritture,da,a]);
  const toggle=cod=>{ if(liq.has(cod)) return; setSel(p=>{const n=new Set(p); n.has(cod)?n.delete(cod):n.add(cod); return n;}); };
  const passaVista=c=> vista==='tutti' ? true
    : vista==='movimentati' ? movimentati.has(c.codice)
    : vista==='ce' ? c.prospetto==='CE'||c.prospetto==='CE/SP'
    : c.prospetto==='SP'||c.prospetto==='CE/SP';   // sp
  const filtered=CONTI.filter(c=>passaVista(c) && (!q||c.nome.toLowerCase().includes(q.toLowerCase())||String(c.codice)===q));
  const groups={};
  filtered.forEach(c=>{ (groups[c.categoria||'—']=groups[c.categoria||'—']||[]).push(c); });
  const selNonLiq=[...sel].filter(c=>!liq.has(c)).length;
  const tuttiFiltrati=()=>setSel(p=>{ const n=new Set(p); filtered.forEach(c=>n.add(c.codice)); return n; });
  const nessunoFiltrati=()=>setSel(p=>{ const n=new Set(p); filtered.forEach(c=>{ if(!liq.has(c.codice)) n.delete(c.codice); }); return n; });
  const soloLiquidita=()=>setSel(new Set(LIQ_CODES));
  const VISTE=[{v:'movimentati',l:'Solo movimentati'},{v:'ce',l:'Economici'},{v:'sp',l:'Patrimoniali'},{v:'tutti',l:'Tutti'}];
  function crea(){
    if(!nome.trim()){ alert('Inserisci un nome'); return; }
    const voci=CONTI.filter(c=>sel.has(c.codice)).map(c=>({id:uid(),descr:c.nome,natura:naturaConto(c),conti:[c.codice],importo:'',note:''}));
    onCreate({nome:nome.trim(),da,a,voci});
  }
  return (
    <div className="modal-bg" onClick={e=>{if(e.target.className==='modal-bg')onClose();}}>
      <div className="modal" style={{maxWidth:660}}>
        <div className="modal-head"><h3>Nuovo budget / forecast</h3><button className="btn ghost sm" onClick={onClose}>✕</button></div>
        <div className="modal-body">
          <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
            <div className="form-row" style={{flex:1,minWidth:200}}><label>Nome <span className="req">*</span></label>
              <input type="text" value={nome} onChange={e=>setNome(e.target.value)} placeholder="es. Forecast 2026"/></div>
            <div className="form-row" style={{maxWidth:150}}><label>Dal</label><input type="date" value={da} onChange={e=>setDa(e.target.value)}/></div>
            <div className="form-row" style={{maxWidth:150}}><label>Al</label><input type="date" value={a} onChange={e=>setA(e.target.value)}/></div>
          </div>
          <div className="form-row"><label>Conti da includere — {selNonLiq} + {liq.size} di liquidità</label>
            <div className="tipo-switch" style={{gridTemplateColumns:'1fr 1fr 1fr 1fr',marginBottom:8}}>
              {VISTE.map(x=><button key={x.v} className={vista===x.v?'active entrata':''} onClick={()=>setVista(x.v)}>{x.l}</button>)}
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8,flexWrap:'wrap'}}>
              <input type="text" placeholder="Cerca conto…" value={q} onChange={e=>setQ(e.target.value)} style={{flex:1,minWidth:160}}/>
              <button className="btn ghost sm" onClick={()=>setSel(new Set(CONTI.map(c=>c.codice)))}>Seleziona tutti</button>
              <button className="btn ghost sm" onClick={tuttiFiltrati}>Seleziona visibili</button>
              <button className="btn ghost sm" onClick={nessunoFiltrati}>Deseleziona visibili</button>
              <button className="btn ghost sm" onClick={soloLiquidita}>Solo liquidità</button>
            </div>
            <div style={{maxHeight:280,overflowY:'auto',border:'1px solid var(--rule)',borderRadius:6,padding:'6px 10px'}}>
              {Object.keys(groups).length===0 && <div style={{fontSize:12,color:'var(--ink-3)',padding:'6px 0'}}>Nessun conto con questo filtro</div>}
              {Object.entries(groups).map(([cat,items])=>(
                <div key={cat} style={{marginBottom:8}}>
                  <div style={{fontSize:10.5,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--ink-3)',margin:'6px 0 3px'}}>{cat}</div>
                  {items.map(c=>{ const isLiq=liq.has(c.codice); const mov=movimentati.has(c.codice); return (
                    <label key={c.codice} style={{display:'flex',alignItems:'center',gap:8,fontSize:12.5,padding:'3px 0',cursor:isLiq?'default':'pointer',opacity:isLiq?0.85:1}}>
                      <input type="checkbox" checked={sel.has(c.codice)} disabled={isLiq} onChange={()=>toggle(c.codice)}/>
                      <span className="mono" style={{color:'var(--ink-3)',minWidth:26}}>{c.codice}</span>{c.nome}
                      {!mov && !isLiq && <span style={{fontSize:10.5,color:'var(--ink-3)'}}>· non mov.</span>}
                      {isLiq && <span className="pill" style={{marginLeft:'auto',background:'var(--accent-soft)',color:'var(--accent-ink)'}}>sempre incluso</span>}
                    </label>
                  ); })}
                </div>
              ))}
            </div>
            <div style={{fontSize:11.5,color:'var(--ink-3)',marginTop:6}}>Per ogni conto scelto viene creata una voce (natura dedotta dal conto, importo da compilare). Potrai aggiungerne o toglierne anche dopo. “Solo movimentati” usa il periodo impostato sopra.</div>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:14,paddingTop:14,borderTop:'1px solid var(--rule)'}}>
            <button className="btn ghost" onClick={onClose}>Annulla</button>
            <button className="btn accent" onClick={crea}>Crea budget</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PageBudget({scritture, budgets, setBudgets, toast}){
  const ids=Object.keys(budgets||{});
  const [sel,setSel]=useState('');            // '' = schermata iniziale (elenco)
  const [draft,setDraft]=useState(null);      // copia di lavoro del budget aperto
  const [editing,setEditing]=useState(null);
  const [creating,setCreating]=useState(false);
  const [mostraCons,setMostraCons]=useState(true);
  const [sommaCons,setSommaCons]=useState(false);
  const [statoConti,setStatoConti]=useState(false);
  const [pianoCassa,setPianoCassa]=useState(false);

  const b = draft;
  const salvato = sel ? budgets[sel] : null;
  const dirty = !!(sel && draft && JSON.stringify(draft)!==JSON.stringify(salvato));
  const upd = patch => setDraft(d=>({...d,...patch}));

  function apri(k){ const bx=budgets[k]; setSel(k); setDraft(JSON.parse(JSON.stringify(bx))); setStatoConti(false); setMostraCons(bx.mostraCons!==false); setSommaCons(!!bx.sommaCons); }
  function chiudi(){
    if(dirty && !window.confirm('Ci sono modifiche non salvate. Uscire senza salvare?')) return;
    setSel(''); setDraft(null);
  }
  function salva(){
    if(!sel||!draft) return;
    setBudgets({...budgets,[sel]:draft});
    toast('Modifiche salvate','success');
  }
  function nuovo(){ setCreating(true); }
  function creaBudget(dati){
    const id=uid(); const nuovoB={id,...dati};
    setBudgets({...budgets,[id]:nuovoB});
    setSel(id); setDraft(JSON.parse(JSON.stringify(nuovoB)));
    setCreating(false); toast('Budget creato','success');
  }
  function duplica(){
    if(!draft) return;
    const nome=window.prompt('Nome della copia:',(draft.nome||'')+' (copia)');
    if(!nome) return;
    const id=uid();
    const copia={...JSON.parse(JSON.stringify(draft)),id,nome:nome.trim(),voci:(draft.voci||[]).map(v=>({...v,id:uid()}))};
    setBudgets({...budgets,[id]:copia});
    setSel(id); setDraft(JSON.parse(JSON.stringify(copia)));
    toast('Scenario duplicato (già salvato)','success');
  }
  function eliminaDaLista(k){
    if(!window.confirm(`Eliminare il budget "${budgets[k].nome}"?`)) return;
    const n={...budgets}; delete n[k]; setBudgets(n);
    if(k===sel){ setSel(''); setDraft(null); }
    toast('Budget eliminato','success');
  }
  function salvaVoce(v){
    const voci=[...((draft&&draft.voci)||[])];
    const i=voci.findIndex(x=>x.id===v.id);
    const {nuova,...clean}=v;
    if(i>=0) voci[i]=clean; else voci.push(clean);
    upd({voci}); setEditing(null);
  }
  function eliminaVoce(id){ if(!window.confirm('Eliminare questa voce?')) return; upd({voci:(draft.voci||[]).filter(v=>v.id!==id)}); }
  function updVoce(id,patch){ upd({voci:(draft.voci||[]).map(v=>v.id===id?{...v,...patch}:v)}); }
  /* ---- voce "verificata": si è realizzata davvero (come la contabilità futsal) ----
     realizzato=true + importoEffettivo = importo confermato o corretto + dataRealizzo */
  const isReal=v=>!!v&&v.realizzato===true;
  const valEff=v=>{ const e=v.importoEffettivo; return (e===null||e===undefined||e===''||isNaN(parseFloat(e)))?(parseFloat(v.importo)||0):parseFloat(e); };
  function toggleReal(v,on){
    updVoce(v.id, on
      ? {realizzato:true, importoEffettivo:(v.importoEffettivo!=null&&v.importoEffettivo!=='')?v.importoEffettivo:(parseFloat(v.importo)||0), dataRealizzo:todayISO()}
      : {realizzato:false, importoEffettivo:null, dataRealizzo:null});
  }
  // importo che deve ancora muovere la cassa: per le voci verificate solo la parte non ancora registrata
  const impCassa=v=>{
    if(!isReal(v)) return parseFloat(v.importo)||0;
    const cons=r2((v.conti||[]).reduce((s,c)=>s+movConto(scritture,c,v.natura,b&&b.da,b&&b.a),0));
    return Math.max(0,r2(valEff(v)-cons));
  };
  function saldoCassa(cod){ let s=0; (scritture||[]).forEach(x=>(x.righe||[]).forEach(r=>{ if(r.c===cod) s+=(r.d||0)-(r.a||0); })); return r2(s); }
  const cassaPlan = useMemo(()=>{
    if(!b) return [];
    const byCassa={};
    (b.voci||[]).forEach(v=>{
      if(v.cassa==null||v.cassa==='') return; const cod=parseInt(v.cassa); if(!LIQ_CODES.includes(cod)) return;
      const imp=impCassa(v); if(Math.abs(imp)<0.005) return;
      const seg = v.natura==='ricavo' ? imp : -imp;
      byCassa[cod]=byCassa[cod]||{entrate:0,uscite:0};
      if(seg>=0) byCassa[cod].entrate=r2(byCassa[cod].entrate+seg); else byCassa[cod].uscite=r2(byCassa[cod].uscite-seg);
    });
    return LIQ_CODES.filter(c=>byCassa[c]).map(cod=>{ const d=byCassa[cod]; const attuale=saldoCassa(cod); const impatto=r2(d.entrate-d.uscite);
      return {cod,nome:contoByCode[cod]?.nome,attuale,entrate:d.entrate,uscite:d.uscite,previsto:r2(attuale+impatto)}; });
  },[b,scritture]);

  /* ---- Timeline esposizione: saldo previsto giorno per giorno, per conto di cassa ---- */
  const esposizione = useMemo(()=>{
    if(!b) return {conti:[],eventi:[],minGlob:null};
    const cassaCods=[...new Set((b.voci||[]).filter(v=>v.cassa!=null&&v.cassa!=='').map(v=>parseInt(v.cassa)).filter(c=>LIQ_CODES.includes(c)))];
    if(!cassaCods.length) return {conti:[],eventi:[],minGlob:null};
    const saldiIni={}; cassaCods.forEach(c=>saldiIni[c]=saldoCassa(c));
    // eventi datati (voci con importo, cassa e data)
    let flussi=[];
    (b.voci||[]).forEach(v=>{
      if(v.cassa==null||v.cassa==='') return; const cod=parseInt(v.cassa); if(!LIQ_CODES.includes(cod)) return;
      const imp=impCassa(v); if(Math.abs(imp)<0.005) return;
      const seg=v.natura==='ricavo'?imp:-imp;
      flussi.push({cod,data:v.dataFlusso||'',descr:v.descr,seg,senzaData:!v.dataFlusso});
    });
    flussi.sort((a,b)=>(a.data||'9999').localeCompare(b.data||'9999'));
    // costruisci righe cumulate per conto
    const run={...saldiIni};
    const minPerConto={}; cassaCods.forEach(c=>minPerConto[c]=saldiIni[c]);
    const eventi=flussi.map(f=>{
      run[f.cod]=r2((run[f.cod]||0)+f.seg);
      if(run[f.cod]<minPerConto[f.cod]) minPerConto[f.cod]=run[f.cod];
      return {...f, saldoDopo:run[f.cod], nome:contoByCode[f.cod]?.nome};
    });
    const conti=cassaCods.map(cod=>({cod,nome:contoByCode[cod]?.nome,iniziale:saldiIni[cod],finale:r2(run[cod]),minimo:r2(minPerConto[cod])}));
    const minGlob=Math.min(...conti.map(c=>c.minimo));
    return {conti,eventi,minGlob,senzaData:flussi.some(f=>f.senzaData)};
  },[b,scritture]);

  /* ---- consuntivo: attribuzione singola per conto (niente doppi conteggi) ---- */
  const calc = useMemo(()=>{
    if(!b) return {righe:[],tot:{}};
    const usati=new Set();
    const righe=(b.voci||[]).map(v=>{
      const propri=(v.conti||[]).filter(c=>!usati.has(c));
      propri.forEach(c=>usati.add(c));
      const cons=r2(propri.reduce((s,c)=>s+movConto(scritture,c,v.natura,b.da,b.a),0));
      const real=isReal(v), prev=r2(parseFloat(v.importo)||0), eff=r2(valEff(v));
      const budg=real ? eff : (sommaCons ? r2(prev+cons) : prev);
      const atteso=real ? eff : r2(cons+prev);
      const dupl=(v.conti||[]).length-propri.length;
      return {...v, cons, budg, atteso, scost:r2(cons-budg), dupl, real, prev, eff, dPrev:r2(eff-prev)};
    });
    const somma=(nat,f)=>r2(righe.filter(r=>r.natura===nat).reduce((s,r)=>s+f(r),0));
    const tot={
      ricBudg:somma('ricavo',r=>r.budg), ricCons:somma('ricavo',r=>r.cons), ricAtt:somma('ricavo',r=>r.atteso),
      cosBudg:somma('costo',r=>r.budg), cosCons:somma('costo',r=>r.cons), cosAtt:somma('costo',r=>r.atteso),
      patBudg:somma('patrimoniale',r=>r.budg), patCons:somma('patrimoniale',r=>r.cons), patAtt:somma('patrimoniale',r=>r.atteso),
    };
    tot.resBudg=r2(tot.ricBudg-tot.cosBudg); tot.resCons=r2(tot.ricCons-tot.cosCons); tot.resAtt=r2(tot.ricAtt-tot.cosAtt);
    tot.scost=r2(tot.resCons-tot.resBudg);
    return {righe,tot};
  },[b,scritture,sommaCons]);

  function exportXls(){
    if(!window.XLSX){ toast('Libreria Excel non caricata','error'); return; }
    const head=['Voce','Natura','Conti','Budget','Consuntivo','Scostamento','Tot. atteso','Cassa','Note','Stato','Previsto','Effettivo'];
    const aoa=[[b.nome],[b.da||b.a?`Periodo ${b.da||'inizio'} → ${b.a||'oggi'}`:'Periodo: tutto'],[],head];
    NATURE.forEach(n=>{
      const rr=calc.righe.filter(r=>r.natura===n.v); if(!rr.length) return;
      aoa.push([n.l.toUpperCase()]);
      rr.forEach(r=>aoa.push([r.descr,n.l,(r.conti||[]).map(c=>contoByCode[c]?.nome||c).join(', '),r.budg,r.cons,r.scost,r.atteso,r.cassa?contoByCode[parseInt(r.cassa)]?.nome:'',r.note||'',r.real?'verificata':'prevista',r.prev,r.real?r.eff:'']));
    });
    aoa.push([]);
    aoa.push(['TOTALE RICAVI','','',calc.tot.ricBudg,calc.tot.ricCons,r2(calc.tot.ricCons-calc.tot.ricBudg),calc.tot.ricAtt,'','']);
    aoa.push(['TOTALE COSTI','','',calc.tot.cosBudg,calc.tot.cosCons,r2(calc.tot.cosCons-calc.tot.cosBudg),calc.tot.cosAtt,'','']);
    aoa.push(['RISULTATO','','',calc.tot.resBudg,calc.tot.resCons,calc.tot.scost,calc.tot.resAtt,'','']);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),'Budget');
    if(cassaPlan.length){
      const ca=[['PIANO DI CASSA PREVISIONALE — '+b.nome],[],['Conto','Saldo attuale','Entrate previste','Uscite previste','Saldo previsto']];
      cassaPlan.forEach(p=>ca.push([p.nome,p.attuale,p.entrate,p.uscite,p.previsto]));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ca),'Piano di cassa');
    }
    if(esposizione.eventi.length){
      const ea=[['ESPOSIZIONE — '+b.nome],[],['Data','Voce','Conto','Flusso','Saldo dopo']];
      esposizione.eventi.forEach(e=>ea.push([e.senzaData?'(senza data)':e.data,e.descr,e.nome,e.seg,e.saldoDopo]));
      ea.push([]); ea.push(['MINIMI PER CONTO']); esposizione.conti.forEach(c=>ea.push([c.nome,'iniziale '+num2(c.iniziale),'minimo '+num2(c.minimo),'finale '+num2(c.finale)]));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ea),'Esposizione');
    }
    XLSX.writeFile(wb,'Budget_'+(b.nome||'').replace(/[^\w]+/g,'_')+'.xlsx');
    toast('Export Excel completato','success');
  }

  function exportPdf(){
    if(!window.jspdf){ toast('Libreria PDF non caricata','error'); return; }
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const cx=doc.internal.pageSize.getWidth()/2;
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('BUDGET',cx,18,{align:'center'});
    doc.setFontSize(12); doc.setFont('helvetica','normal'); doc.text(b.nome||'',cx,25,{align:'center'});
    doc.setFontSize(9); doc.setTextColor(120);
    doc.text((b.da||b.a?`Periodo ${b.da||'inizio'} → ${b.a||'oggi'}`:'Periodo: tutto')+' · generato il '+new Date().toLocaleDateString('it-IT'),cx,31,{align:'center'});
    doc.setTextColor(0);
    const HEAD=[31,79,143], SUB=[240,238,233], TOT=[225,233,228];
    const showC=mostraCons;
    const headRow=showC?['Voce','Budget','Consuntivo','Scostam.','Tot. atteso']:['Voce','Budget'];
    const body=[];
    NATURE.forEach(n=>{ const rr=calc.righe.filter(r=>r.natura===n.v); if(!rr.length) return;
      body.push([{content:n.l.toUpperCase(),colSpan:headRow.length,styles:{fontStyle:'bold',fillColor:SUB}}]);
      rr.forEach(r=>{ const row=[r.descr+(r.note?'  ('+r.note+')':''),num2(r.budg)]; if(showC){ row.push(num2(r.cons)); row.push((r.scost>0?'+':'')+num2(r.scost)); row.push(num2(r.atteso)); } body.push(row); });
      const tb=r2(rr.reduce((s,r)=>s+r.budg,0)), tc=r2(rr.reduce((s,r)=>s+r.cons,0)), ta=r2(rr.reduce((s,r)=>s+r.atteso,0));
      const tr=[{content:'Totale '+n.l.toLowerCase(),styles:{fontStyle:'bold'}},{content:num2(tb),styles:{fontStyle:'bold'}}];
      if(showC){ tr.push({content:num2(tc),styles:{fontStyle:'bold'}}); tr.push({content:num2(r2(tc-tb)),styles:{fontStyle:'bold'}}); tr.push({content:num2(ta),styles:{fontStyle:'bold'}}); }
      body.push(tr);
    });
    const rres=[{content:'RISULTATO (ricavi − costi)',styles:{fontStyle:'bold',fillColor:TOT}},{content:num2(calc.tot.resBudg),styles:{fontStyle:'bold',fillColor:TOT}}];
    if(showC){ rres.push({content:num2(calc.tot.resCons),styles:{fontStyle:'bold',fillColor:TOT}}); rres.push({content:(calc.tot.scost>0?'+':'')+num2(calc.tot.scost),styles:{fontStyle:'bold',fillColor:TOT}}); rres.push({content:num2(calc.tot.resAtt),styles:{fontStyle:'bold',fillColor:TOT}}); }
    body.push(rres);
    const colStyles=showC?{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}}:{1:{halign:'right'}};
    doc.autoTable({startY:37,head:[headRow],body,styles:{fontSize:8.5,cellPadding:1.6},headStyles:{fillColor:HEAD},columnStyles:colStyles});

    if(cassaPlan.length){
      let y=doc.lastAutoTable.finalY+10; if(y>250){ doc.addPage(); y=20; }
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Piano di cassa previsionale',14,y); y+=3;
      const cbody=cassaPlan.map(p=>[p.nome,num2(p.attuale),'+'+num2(p.entrate),'−'+num2(p.uscite),num2(p.previsto)]);
      doc.autoTable({startY:y+2,head:[['Conto','Saldo attuale','Entrate','Uscite','Saldo previsto']],body:cbody,styles:{fontSize:8.5,cellPadding:1.6},headStyles:{fillColor:HEAD},columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}}});
    }
    if(esposizione.eventi.length){
      let y=doc.lastAutoTable.finalY+10; if(y>240){ doc.addPage(); y=20; }
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Esposizione — proiezione cronologica',14,y);
      const ebody=esposizione.eventi.map(e=>[e.senzaData?'—':fmtDate(e.data),e.descr,e.nome,(e.seg>0?'+':'')+num2(e.seg),num2(e.saldoDopo)]);
      doc.autoTable({startY:y+3,head:[['Data','Voce','Conto','Flusso','Saldo dopo']],body:ebody,styles:{fontSize:8,cellPadding:1.4},headStyles:{fillColor:HEAD},columnStyles:{3:{halign:'right'},4:{halign:'right'}},
        didParseCell:d=>{ if(d.section==='body' && esposizione.eventi[d.row.index] && esposizione.eventi[d.row.index].saldoDopo<0){ d.cell.styles.textColor=[170,50,50]; } }});
    }
    doc.save('Budget_'+(b.nome||'').replace(/[^\w]+/g,'_')+'.pdf');
    toast('PDF generato','success');
  }

  const nCol = mostraCons?8:5;

  /* ============ SCHERMATA INIZIALE: elenco budget ============ */
  if(!sel || !draft){
    return (
      <div>
        <PageHead title="Budget" sub="Scenari di budget confrontati con il consuntivo di partita doppia">
          <button className="btn accent" onClick={nuovo}>+ Nuovo budget</button>
        </PageHead>
        {ids.length===0 ? <div className="card"><div className="empty-state">Nessun budget salvato. Creane uno con “+ Nuovo budget”.</div></div> : (
          <div className="card">
            <div className="card-title">Budget salvati ({ids.length})</div>
            <div className="tbl-wrap"><table className="tbl">
              <thead><tr><th>Nome</th><th>Periodo</th><th className="num">Voci</th><th className="num">Ricavi budget</th><th className="num">Costi budget</th><th style={{width:130}}></th></tr></thead>
              <tbody>
                {ids.map(k=>{ const bx=budgets[k]; const v=bx.voci||[];
                  const ric=r2(v.filter(x=>x.natura==='ricavo').reduce((s,x)=>s+(parseFloat(x.importo)||0),0));
                  const cos=r2(v.filter(x=>x.natura==='costo').reduce((s,x)=>s+(parseFloat(x.importo)||0),0));
                  return <tr key={k} style={{cursor:'pointer'}} onClick={()=>apri(k)} title="Apri il budget">
                    <td><b>{bx.nome}</b></td>
                    <td style={{fontSize:12,color:'var(--ink-3)',whiteSpace:'nowrap'}}>{bx.da||bx.a?`${bx.da||'inizio'} → ${bx.a||'oggi'}`:'tutto'}</td>
                    <td className="num">{v.length}</td>
                    <td className="num">{num2(ric)}</td>
                    <td className="num">{num2(cos)}</td>
                    <td style={{whiteSpace:'nowrap',textAlign:'right'}} onClick={e=>e.stopPropagation()}>
                      <button className="btn ghost sm" onClick={()=>apri(k)}>Apri</button>{' '}
                      <button className="btn danger sm" title="Elimina" onClick={()=>eliminaDaLista(k)}>✕</button>
                    </td>
                  </tr>;
                })}
              </tbody>
            </table></div>
          </div>
        )}
        {creating && <NewBudgetModal scritture={scritture} onCreate={creaBudget} onClose={()=>setCreating(false)}/>}
      </div>
    );
  }

  /* ============ FOGLIO BUDGET APERTO ============ */
  return (
    <div>
      <PageHead title={b.nome||'Budget'} sub="Modifica il foglio e salva le variazioni">
        <button className="btn ghost" onClick={chiudi}>← Elenco</button>
        <button className="btn ghost" onClick={duplica}>⧉ Duplica</button>
        <button className="btn ghost" onClick={exportPdf}>↓ PDF</button>
        <button className="btn ghost" onClick={exportXls}>↓ Excel</button>
        <button className={'btn '+(dirty?'accent':'ghost')} onClick={salva} disabled={!dirty}>{dirty?'💾 Salva modifiche':'✓ Salvato'}</button>
      </PageHead>

      {dirty && <div style={{fontSize:12.5,color:'#7a5a1d',background:'#f7ecd2',border:'1px solid #e6d5a8',borderRadius:6,padding:'7px 12px',marginBottom:14}}>Modifiche non salvate — premi “Salva modifiche” per confermarle.</div>}

      <div className="filters">
        <span className="label">Nome</span>
        <input type="text" value={b.nome||''} onChange={e=>upd({nome:e.target.value})} style={{maxWidth:220}}/>
        <span className="label">Dal</span>
        <input type="date" value={b.da||''} onChange={e=>upd({da:e.target.value})}/>
        <span className="label">Al</span>
        <input type="date" value={b.a||''} onChange={e=>upd({a:e.target.value})}/>
      </div>

      <div className="card" style={{marginBottom:16,display:'flex',gap:18,flexWrap:'wrap',alignItems:'center'}}>
        <label style={{display:'flex',alignItems:'center',gap:7,fontSize:13,cursor:'pointer'}}>
          <input type="checkbox" checked={mostraCons} onChange={e=>{setMostraCons(e.target.checked); upd({mostraCons:e.target.checked});}}/> Confronto consuntivo
        </label>
        <label style={{display:'flex',alignItems:'center',gap:7,fontSize:13,cursor:'pointer'}}>
          <input type="checkbox" checked={sommaCons} onChange={e=>{setSommaCons(e.target.checked); upd({sommaCons:e.target.checked});}}/> Somma consuntivo al budget
        </label>
        <span style={{fontSize:11.5,color:'var(--ink-3)'}}>Con la somma attiva, l’importo che inserisci si aggiunge a quanto già registrato (forecast).</span>
        <div style={{flex:1}}></div>
        <button className="btn ghost sm" onClick={()=>setPianoCassa(v=>!v)}>{pianoCassa?'Nascondi':'Mostra'} piano di cassa</button>
        <button className="btn ghost sm" onClick={()=>setStatoConti(v=>!v)}>{statoConti?'Nascondi':'Mostra'} stato conti</button>
      </div>

      <div className="kpi-grid" style={{marginBottom:18}}>
        <Kpi label="Ricavi" value={eur(calc.tot.ricBudg)} hint={mostraCons?`Consuntivo ${eur(calc.tot.ricCons)}`:null}/>
        <Kpi label="Costi" value={eur(calc.tot.cosBudg)} hint={mostraCons?`Consuntivo ${eur(calc.tot.cosCons)}`:null}/>
        <Kpi label="Risultato" value={eur(calc.tot.resBudg)} neg={calc.tot.resBudg<0} hint={mostraCons?`Consuntivo ${eur(calc.tot.resCons)}`:null} accent/>
        {mostraCons && <Kpi label="Risultato atteso" value={eur(calc.tot.resAtt)} neg={calc.tot.resAtt<0} hint="Consuntivo + forecast"/>}
        {mostraCons && <Kpi label="Scostamento risultato" value={(calc.tot.scost>0?'+':'')+eur(calc.tot.scost)} neg={calc.tot.scost<0}/>}
      </div>

      {statoConti && <div className="card" style={{marginBottom:18}}>
        <div className="card-title">Stato dei conti nel periodo</div>
        <div className="tbl-wrap" style={{maxHeight:280,overflowY:'auto'}}>
          <table className="tbl">
            <thead><tr><th>Conto</th><th>Categoria</th><th className="num">Saldo</th></tr></thead>
            <tbody>
              {CONTI.map(c=>({c,v:movConto(scritture,c.codice,c.categoria==='RICAVI'?'ricavo':(c.prospetto==='CE'?'costo':'patrimoniale'),b.da,b.a)}))
                .filter(x=>x.v!==0)
                .sort((x,y)=>Math.abs(y.v)-Math.abs(x.v))
                .map(({c,v})=><tr key={c.codice}><td><b>{c.nome}</b></td><td style={{fontSize:12}}>{c.categoria}</td><td className={'num '+(v<0?'neg':'')}>{num2(v)}</td></tr>)}
            </tbody>
          </table>
        </div>
      </div>}

      {pianoCassa && <div className="card" style={{marginBottom:18}}>
        <div className="card-title">Piano di cassa previsionale</div>
        {cassaPlan.length===0
          ? <div className="empty-state" style={{padding:20}}>Nessuna voce collegata a un conto di cassa. Apri una voce (✎) e imposta il “Conto di cassa”.</div>
          : <div className="tbl-wrap"><table className="tbl">
              <thead><tr><th>Conto</th><th className="num">Saldo attuale</th><th className="num">Entrate previste</th><th className="num">Uscite previste</th><th className="num">Saldo previsto</th></tr></thead>
              <tbody>
                {cassaPlan.map(p=>(
                  <tr key={p.cod}>
                    <td><b>{p.nome}</b></td>
                    <td className="num">{num2(p.attuale)}</td>
                    <td className="num pos">{p.entrate?'+'+num2(p.entrate):num2(0)}</td>
                    <td className="num neg">{p.uscite?'−'+num2(p.uscite):num2(0)}</td>
                    <td className={'num '+(p.previsto<0?'neg':'')} style={{fontWeight:700}}>{num2(p.previsto)}</td>
                  </tr>
                ))}
              </tbody>
            </table></div>}
        <div style={{fontSize:11.5,color:'var(--ink-3)',marginTop:8}}>Proiezione: al saldo contabile attuale di ogni conto liquido somma le voci di budget collegate (ricavi in entrata, costi e investimenti in uscita), usando l’importo inserito.</div>

        {esposizione.eventi.length>0 && <div style={{marginTop:22}}>
          <div className="card-title">Esposizione — proiezione cronologica</div>
          <div className="kpi-grid" style={{marginBottom:14}}>
            {esposizione.conti.map(c=>(
              <Kpi key={c.cod} label={c.nome} value={eur(c.finale)} neg={c.finale<0}
                hint={`Minimo ${eur(c.minimo)}${c.minimo<0?' ⚠ scoperto':''}`} accent={c.minimo<0}/>
            ))}
          </div>
          {esposizione.minGlob<0 && <div style={{fontSize:12.5,color:'#a33',background:'#f7e4e4',border:'1px solid #e6bcbc',borderRadius:6,padding:'8px 12px',marginBottom:12}}>⚠ In almeno un giorno un conto va sotto zero (minimo {eur(esposizione.minGlob)}). Controlla le righe evidenziate.</div>}
          {esposizione.senzaData && <div style={{fontSize:12,color:'#7a5a1d',background:'#f7ecd2',border:'1px solid #e6d5a8',borderRadius:6,padding:'7px 12px',marginBottom:12}}>Alcune voci non hanno una data prevista: sono conteggiate all’inizio della proiezione. Impostane la data (✎) per collocarle nel tempo.</div>}
          <div className="tbl-wrap"><table className="tbl">
            <thead><tr><th>Data</th><th>Voce</th><th>Conto</th><th className="num">Flusso</th><th className="num">Saldo dopo</th></tr></thead>
            <tbody>
              {esposizione.eventi.map((e,i)=>(
                <tr key={i} style={e.saldoDopo<0?{background:'#faecec'}:null}>
                  <td style={{whiteSpace:'nowrap'}}>{e.senzaData?'—':fmtDate(e.data)}</td>
                  <td>{e.descr}</td>
                  <td style={{fontSize:12,color:'var(--ink-3)'}}>{e.nome}</td>
                  <td className={'num '+(e.seg>=0?'pos':'neg')}>{e.seg>0?'+':''}{num2(e.seg)}</td>
                  <td className={'num '+(e.saldoDopo<0?'neg':'')} style={{fontWeight:600}}>{num2(e.saldoDopo)}</td>
                </tr>
              ))}
            </tbody>
          </table></div>
          <div style={{fontSize:11.5,color:'var(--ink-3)',marginTop:8}}>Ordina le voci di cassa per data e mostra il saldo progressivo di ogni conto: le righe rosse sono i momenti in cui saresti sotto zero. Punto di partenza: il saldo contabile attuale del conto.</div>
        </div>}
      </div>}

      {(()=>{ const rr=calc.righe; const vr=rr.filter(x=>x.real); if(!rr.length) return null;
        const segno=x=>x.natura==='ricavo'?1:-1; const dTot=r2(vr.reduce((s,x)=>s+segno(x)*x.dPrev,0));
        return <div className="card flat" style={{marginBottom:12,padding:'10px 14px',display:'flex',gap:16,flexWrap:'wrap',alignItems:'center',fontSize:13}}>
          <span>Voci verificate <b>{vr.length}/{rr.length}</b></span>
          {vr.length>0 && <span>Effetto sul risultato rispetto al previsto: <b className={dTot<-0.005?'neg':(dTot>0.005?'pos':'')}>{dTot>0?'+':''}{num2(dTot)} €</b></span>}
          <span style={{color:'var(--ink-3)',fontSize:12}}>Spunta "Verificata?" quando una voce si realizza e conferma o correggi l'importo.</span>
        </div>; })()}
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr>
            <th>Voce</th><th>Conti collegati</th><th className="num" style={{minWidth:100}}>{sommaCons?'Forecast':'Budget'} inserito</th><th style={{minWidth:120}} title="Spunta quando la voce si è verificata: confermi l'importo previsto o lo correggi">Verificata?</th>
            {mostraCons && <th className="num">Consuntivo</th>}
            {mostraCons && <th className="num">Scostamento</th>}
            {mostraCons && <th className="num" title="Consuntivo + forecast inserito">Tot. atteso</th>}
            <th style={{width:80}}></th>
          </tr></thead>
          <tbody>
            {(b.voci||[]).length===0 && <tr><td colSpan={nCol} className="empty-state">Nessuna voce. Aggiungine una qui sotto.</td></tr>}
            {NATURE.map(n=>{
              const rr=calc.righe.filter(r=>r.natura===n.v);
              if(!rr.length) return null;
              const tb=r2(rr.reduce((s,r)=>s+r.budg,0)), tc=r2(rr.reduce((s,r)=>s+r.cons,0)), ta=r2(rr.reduce((s,r)=>s+r.atteso,0));
              return (
                <React.Fragment key={n.v}>
                  <tr className="gj-head"><td colSpan={nCol} style={{fontWeight:600}}>{n.l}</td></tr>
                  {rr.map(r=>{
                    const favorevole = r.natura==='ricavo' ? r.scost>=0 : r.scost<=0;
                    return (
                      <React.Fragment key={r.id}>
                      <tr>
                        <td><b>{r.descr}</b>{r.cassa && <span className="pill" style={{marginLeft:6,background:'var(--accent-soft)',color:'var(--accent-ink)'}}>→ {contoByCode[parseInt(r.cassa)]?.nome}{r.dataFlusso?' · '+fmtDate(r.dataFlusso):''}</span>}{r.dupl>0 && <span className="pill" style={{marginLeft:6,background:'#f7ecd2',color:'#7a5a1d'}} title="Alcuni conti sono già attribuiti a una voce precedente">{r.dupl} conto già usato</span>}
                          <div style={{marginTop:3}}><select value={r.natura} onChange={e=>updVoce(r.id,{natura:e.target.value})} style={{fontSize:11,padding:'1px 6px',color:'var(--ink-2)'}} title="Costo o ricavo — determina il segno">{NATURE.map(n=><option key={n.v} value={n.v}>{n.l}</option>)}</select></div>
                        </td>
                        <td style={{fontSize:12,color:'var(--ink-3)'}}>{(r.conti||[]).map(c=>contoByCode[c]?.nome||('#'+c)).join(' · ')||'—'}</td>
                        <td className="num" style={{padding:'4px 6px'}}>
                          <input type="number" min="0" step="0.01" value={r.importo??''} onChange={e=>updVoce(r.id,{importo:e.target.value.replace('-','')})}
                            placeholder="0,00"
                            style={{width:'100%',minWidth:78,textAlign:'right',border:'1px solid var(--rule)',borderRadius:4,padding:'4px 6px',fontFamily:"'JetBrains Mono',ui-monospace,monospace",fontSize:12.5,background:'var(--panel)'}}/>
                        </td>
                        <td style={{padding:'4px 6px',minWidth:120}}>
                          <label style={{display:'flex',alignItems:'center',gap:5,fontSize:11.5,cursor:'pointer',whiteSpace:'nowrap'}}>
                            <input type="checkbox" checked={r.real} onChange={e=>toggleReal(r,e.target.checked)} style={{width:'auto'}}/>
                            <span style={{color:r.real?'var(--success)':'var(--ink-3)',fontWeight:r.real?700:400}}>{r.real?'verificata':'prevista'}</span>
                          </label>
                          {r.real && <div style={{display:'flex',alignItems:'center',gap:4,marginTop:4}}>
                            <input type="number" min="0" step="0.01" value={r.importoEffettivo??''} title="Importo effettivo: conferma quello previsto o correggilo"
                              onChange={e=>updVoce(r.id,{importoEffettivo:e.target.value.replace('-','')})}
                              style={{width:84,textAlign:'right',fontSize:12,border:'1px solid var(--rule)',borderRadius:4,padding:'3px 5px',fontFamily:"'JetBrains Mono',ui-monospace,monospace"}}/>
                            <button className="btn ghost sm" title="Riporta all'importo previsto" onClick={()=>updVoce(r.id,{importoEffettivo:r.prev})}>↺</button>
                          </div>}
                          {r.real && <div style={{fontSize:10.5,marginTop:3,color:Math.abs(r.dPrev)<0.005?'var(--ink-3)':(((r.natura==='ricavo')?r.dPrev>0:r.dPrev<0)?'var(--success)':'var(--danger)')}}>
                            {Math.abs(r.dPrev)<0.005?'come previsto':`${r.dPrev>0?'+':''}${num2(r.dPrev)} vs previsto`}{r.dataRealizzo?' · '+fmtDate(r.dataRealizzo):''}
                          </div>}
                        </td>
                        {mostraCons && <td className="num" title="Da libro giornale">{num2(r.cons)}</td>}
                        {mostraCons && <td className={'num '+(favorevole?'pos':'neg')}>{r.scost>0?'+':''}{num2(r.scost)}</td>}
                        {mostraCons && <td className="num" style={{fontWeight:600}}>{num2(r.atteso)}</td>}
                        <td style={{whiteSpace:'nowrap'}}>
                          <button className="btn ghost sm" title="Modifica voce (conti, natura, cassa)" onClick={()=>setEditing({...r,nuova:false})}>✎</button>{' '}
                          <button className="btn danger sm" onClick={()=>eliminaVoce(r.id)}>✕</button>
                        </td>
                      </tr>
                      <tr>
                        <td style={{borderTop:'none',paddingTop:0}}></td>
                        <td colSpan={nCol-1} style={{borderTop:'none',paddingTop:0}}>
                          <input type="text" value={r.note||''} onChange={e=>updVoce(r.id,{note:e.target.value})} placeholder="Note…"
                            style={{width:'100%',border:'none',borderBottom:'1px dashed var(--rule)',background:'transparent',fontSize:12,color:'var(--ink-2)',padding:'2px 0'}}/>
                        </td>
                      </tr>
                      </React.Fragment>
                    );
                  })}
                  <tr className="rf-tot"><td colSpan={2} style={{fontWeight:600}}>Totale {n.l.toLowerCase()}</td>
                    <td className="num" style={{fontWeight:600}}>{num2(tb)}</td><td style={{fontSize:11,color:'var(--ink-3)'}}>{rr.filter(x=>x.real).length}/{rr.length} verif.</td>
                    {mostraCons && <td className="num" style={{fontWeight:600}}>{num2(tc)}</td>}
                    {mostraCons && <td className="num" style={{fontWeight:600}}>{num2(r2(tc-tb))}</td>}
                    {mostraCons && <td className="num" style={{fontWeight:600}}>{num2(ta)}</td>}
                    <td></td></tr>
                </React.Fragment>
              );
            })}
            <tr className="rf-tot strong"><td colSpan={2} style={{fontWeight:700}}>RISULTATO (ricavi − costi)</td>
              <td className="num" style={{fontWeight:700}}>{num2(calc.tot.resBudg)}</td><td></td>
              {mostraCons && <td className="num" style={{fontWeight:700}}>{num2(calc.tot.resCons)}</td>}
              {mostraCons && <td className={'num '+(calc.tot.scost<0?'neg':'pos')} style={{fontWeight:700}}>{calc.tot.scost>0?'+':''}{num2(calc.tot.scost)}</td>}
              {mostraCons && <td className="num" style={{fontWeight:700}}>{num2(calc.tot.resAtt)}</td>}
              <td></td></tr>
          </tbody>
        </table>
      </div>
      <div style={{display:'flex',gap:10,marginTop:14,flexWrap:'wrap'}}>
        <button className="btn accent" onClick={()=>setEditing({id:uid(),descr:'',natura:'costo',conti:[],importo:'',note:'',nuova:true})}>+ Aggiungi voce</button>
        <div style={{flex:1}}></div>
        <button className="btn danger" onClick={()=>eliminaDaLista(sel)}>Elimina budget</button>
      </div>
      <div style={{fontSize:12,color:'var(--ink-3)',marginTop:10,fontStyle:'italic'}}>Il consuntivo è calcolato dal libro giornale sui conti collegati a ogni voce (avere−dare per i ricavi, dare−avere per costi e patrimoniali). Se lo stesso conto compare in più voci, viene attribuito solo alla prima per evitare doppi conteggi. I conti patrimoniali usano sempre il saldo pieno, non solo il periodo.</div>

      {editing && <BudgetVoceModal voce={editing} onSave={salvaVoce} onClose={()=>setEditing(null)}/>}
    </div>
  );
}

function PageController({scritture, categorie, budget, setBudget}){
  const [tab,setTab]=useState('budget');
  const rf=useMemo(()=>buildRendiconto(scritture,categorie),[scritture,categorie]);
  const actual={}; ['entrata','uscita','investimento'].forEach(sez=> rf.rows[sez].forEach(r=>{ actual[r.nome]={sezione:sez,val:r.tot}; }));
  const cats=useMemo(()=>{
    const m={};
    (categorie||[]).forEach(c=>{ if(c.sezione!=='interno') m[c.nome]={nome:c.nome,sezione:c.sezione}; });
    Object.keys(actual).forEach(n=>{ if(!m[n]) m[n]={nome:n,sezione:actual[n].sezione}; });
    return Object.values(m);
  },[categorie,rf]);

  const [draft,setDraft]=useState(budget||{});
  useEffect(()=>setDraft(budget||{}),[budget]);
  const setB=(nome,val)=>setDraft(d=>({...d,[nome]:val}));
  const commit=()=>{ const clean={}; Object.entries(draft).forEach(([k,v])=>{ const n=parseFloat(v); if(n>0) clean[k]=n; }); setBudget(clean); };

  // % avanzamento anno solare
  const avanz=useMemo(()=>{ const o=new Date(); const a=o.getFullYear(); const ini=new Date(a,0,1),fin=new Date(a,11,31); return Math.round(Math.max(0,Math.min(1,(o-ini)/(fin-ini)))*100); },[]);

  const sezOrder=[{k:'entrata',l:'Entrate'},{k:'uscita',l:'Uscite'},{k:'investimento',l:'Investimenti'}];

  // analisi chart
  const chartRef=useRef(null);
  useEffect(()=>{
    if(tab!=='analisi'||!chartRef.current||!window.Chart) return;
    const ent=rf.rows.entrata.slice(0,8), usc=rf.rows.uscita.slice(0,8);
    const ctx=chartRef.current.getContext('2d');
    const ch=new Chart(ctx,{type:'bar',data:{
      labels:[...ent.map(r=>r.nome),...usc.map(r=>r.nome)],
      datasets:[{label:'Importo',data:[...ent.map(r=>r.tot),...usc.map(r=>-r.tot)],
        backgroundColor:[...ent.map(()=>'#1f4f8f'),...usc.map(()=>'#b54343')],borderRadius:4}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>num2(v)}}}}});
    return ()=>ch.destroy();
  },[tab,rf]);

  const totBudget=sez=>r2(cats.filter(c=>c.sezione===sez).reduce((s,c)=>s+(parseFloat(draft[c.nome])||0),0));
  const totActual=sez=>r2(cats.filter(c=>c.sezione===sez).reduce((s,c)=>s+((actual[c.nome]&&actual[c.nome].val)||0),0));

  return (
    <div>
      <PageHead title="Controller" sub="Contabilità analitica · budget e consuntivo per categoria">
        <div className="tipo-switch" style={{gridTemplateColumns:'1fr 1fr',width:240}}>
          <button className={tab==='budget'?'active entrata':''} onClick={()=>setTab('budget')}>Budget vs Consuntivo</button>
          <button className={tab==='analisi'?'active entrata':''} onClick={()=>setTab('analisi')}>Analisi</button>
        </div>
      </PageHead>

      {tab==='budget' && <>
        <div className="kpi-grid">
          <Kpi label="Budget entrate" value={eur(totBudget('entrata'))} hint={`Consuntivo ${eur(totActual('entrata'))}`}/>
          <Kpi label="Budget uscite" value={eur(totBudget('uscita'))} hint={`Consuntivo ${eur(totActual('uscita'))}`}/>
          <Kpi accent label="Avanzamento anno" value={avanz+'%'} hint="Riferimento per il ritmo di spesa"/>
        </div>
        {sezOrder.map(sez=>{
          const list=cats.filter(c=>c.sezione===sez.k).sort((a,b)=>((actual[b.nome]&&actual[b.nome].val)||0)-((actual[a.nome]&&actual[a.nome].val)||0));
          if(list.length===0) return null;
          const tB=totBudget(sez.k), tA=totActual(sez.k);
          return (
            <div key={sez.k} style={{marginBottom:18}}>
              <div className="card-title serif" style={{fontSize:15,margin:'6px 0 8px'}}>{sez.l}</div>
              <div className="tbl-wrap"><table className="tbl">
                <thead><tr><th>Categoria</th><th className="num">Budget</th><th className="num">Consuntivo</th><th className="num">Scostamento</th><th className="num">% uso</th></tr></thead>
                <tbody>
                  {list.map(c=>{
                    const a=(actual[c.nome]&&actual[c.nome].val)||0;
                    const b=parseFloat(draft[c.nome])||0;
                    const scost=r2(a-b);
                    const perc=b>0?Math.round(a/b*100):null;
                    const bad = sez.k==='entrata' ? scost<0 : scost>0; // entrate sotto budget o uscite sopra budget
                    return (
                      <tr key={c.nome}>
                        <td>{c.nome}</td>
                        <td className="num"><input type="number" step="0.01" value={draft[c.nome]!=null?draft[c.nome]:''} onChange={e=>setB(c.nome,e.target.value)} onBlur={commit} placeholder="—" style={{width:90,textAlign:'right'}}/></td>
                        <td className="num">{num2(a)}</td>
                        <td className={'num '+(b>0?(bad?'neg':'pos'):'')}>{b>0?(scost>0?'+':'')+num2(scost):'—'}</td>
                        <td className="num">{perc!=null?perc+'%':'—'}</td>
                      </tr>
                    );
                  })}
                </tbody>
                <tfoot><tr><td style={{fontWeight:600}}>Totale {sez.l}</td><td className="num" style={{fontWeight:600}}>{num2(tB)}</td><td className="num" style={{fontWeight:600}}>{num2(tA)}</td><td className="num" style={{fontWeight:600}}>{tB>0?num2(r2(tA-tB)):'—'}</td><td className="num"></td></tr></tfoot>
              </table></div>
            </div>
          );
        })}
        <div style={{fontSize:12,color:'var(--ink-3)',marginTop:6,fontStyle:'italic'}}>Imposta un budget annuo per categoria nella colonna Budget (si salva uscendo dal campo). Il consuntivo è calcolato dalle scritture.</div>
      </>}

      {tab==='analisi' && <>
        <div className="kpi-grid">
          <Kpi accent label="Totale entrate" value={eur(rf.colTot.totEnt)}/>
          <Kpi label="Totale uscite" value={eur(rf.colTot.totUsc)}/>
          <Kpi label="Margine (entrate − uscite)" value={eur(r2(rf.colTot.totEnt-rf.colTot.totUsc))} neg={(rf.colTot.totEnt-rf.colTot.totUsc)<0}/>
          {rf.colTot.totInv>0 && <Kpi label="Investimenti" value={eur(rf.colTot.totInv)}/>}
        </div>
        <div className="card flat">
          <div className="card-title">Categorie principali (entrate in verde, uscite in rosso)</div>
          <div style={{height:Math.max(260, (rf.rows.entrata.slice(0,8).length+rf.rows.uscita.slice(0,8).length)*30)}}><canvas ref={chartRef}></canvas></div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginTop:16}}>
          {sezOrder.filter(s=>rf.rows[s.k].length).map(sez=>(
            <div key={sez.k} className="card flat">
              <div className="card-title">{sez.l} per categoria</div>
              <table className="tbl"><tbody>
                {rf.rows[sez.k].map(r=>{
                  const tot=totActual(sez.k)||1;
                  return <tr key={r.nome}><td>{r.nome}</td><td className="num">{num2(r.tot)}</td><td className="num" style={{color:'var(--ink-3)',width:54}}>{Math.round(r.tot/tot*100)}%</td></tr>;
                })}
              </tbody></table>
            </div>
          ))}
        </div>
      </>}
    </div>
  );
}

/* ============================================================
   PAGINA: CATEGORIE (rendiconto)
   ============================================================ */
function PageCategorie({categorie, setCategorie, scritture, updateScritture, mappa, setMappa, toast}){
  const [nuovaNome,setNuovaNome]=useState('');
  const [nuovaSez,setNuovaSez]=useState('uscita');
  const [draft,setDraft]=useState({});   // rinomina in corso: indice -> testo digitato
  // conteggio utilizzi per categoria
  const usi={}; (scritture||[]).forEach(s=>{ const c=catOf(s); if(c) usi[nk(c)]=(usi[nk(c)]||0)+1; });

  function add(){
    const nome=nuovaNome.trim(); if(!nome){ toast('Inserisci un nome','error'); return; }
    if(categorie.some(c=>nk(c.nome)===nk(nome))){ toast('Categoria già presente','error'); return; }
    setCategorie([...categorie,{nome,sezione:nuovaSez}]); setNuovaNome('');
    toast('Categoria aggiunta','success');
  }
  function setSez(i,v){ setCategorie(categorie.map((c,j)=>j===i?{...c,sezione:v}:c)); }

  /* la rinomina si conferma uscendo dal campo (o con Invio):
     il nuovo nome viene propagato a tutte le scritture che usano la categoria */
  function renameCommit(i){
    const c=categorie[i]; if(!c) return;
    const nuovo=(draft[i]!=null?draft[i]:c.nome).trim();
    setDraft(d=>{ const n={...d}; delete n[i]; return n; });
    if(!nuovo || nuovo===c.nome) return;
    if(categorie.some((x,j)=>j!==i && nk(x.nome)===nk(nuovo))){ toast('Esiste già una categoria con questo nome','error'); return; }
    const vecchio=c.nome;
    setCategorie(categorie.map((x,j)=>j===i?{...x,nome:nuovo}:x));
    // stesso nome a meno di maiuscole/spazi: le scritture restano collegate, non serve toccarle
    if(nk(nuovo)===nk(vecchio)){ toast('Categoria rinominata','success'); return; }
    // aggiorna le scritture che usano la vecchia categoria
    const target=(scritture||[]).filter(s=>nk(catOf(s))===nk(vecchio));
    if(target.length && updateScritture) updateScritture(target.map(s=>({id:s.id,patch:{cat:nuovo}})));
    // aggiorna la mappatura categoria -> conto usata dall'import
    if(mappa && setMappa){
      const k=normKey(vecchio);
      if(mappa[k]!=null){ const m={...mappa}; m[normKey(nuovo)]=m[k]; delete m[k]; setMappa(m); }
    }
    toast(target.length?`Categoria rinominata — ${target.length} scrittur${target.length===1?'a aggiornata':'e aggiornate'}`:'Categoria rinominata','success');
  }
  function del(i){ const c=categorie[i]; if((usi[nk(c.nome)]||0)>0){ if(!window.confirm(`"${c.nome}" è usata in ${usi[nk(c.nome)]} scritture. Eliminarla comunque? Le scritture resteranno senza categoria.`)) return; } setCategorie(categorie.filter((_,j)=>j!==i)); }

  /* conto contabile collegato alla categoria (mappatura usata dall'import
     e dall'etichetta ricavo/costo nelle tendine) */
  const contoDi = nome => { const v=(mappa||{})[normKey(nome)]; return (v==null||v==='')?'':v; };
  function setContoDi(nome,cod){
    const m={...(mappa||{})}; const k=normKey(nome);
    if(cod===''||cod==null) delete m[k]; else m[k]=cod;
    setMappa(m);
    toast(cod===''||cod==null ? 'Collegamento rimosso' : `“${nome}” collegata a ${contoByCode[cod]?.nome||('#'+cod)}`,'success');
  }
  /* incoerenza fra sezione del rendiconto e natura del conto collegato */
  function incoerenza(c){
    const t=catTipoOf(c.nome);
    if(!t||t==='ricavo/costo') return '';
    if(c.sezione==='entrata' && t!=='ricavo') return `collegata a un conto di ${t}: nel rendiconto resta fra le entrate`;
    if(c.sezione==='uscita' && t!=='costo') return `collegata a un conto di ${t}: nel rendiconto resta fra le uscite`;
    if(c.sezione==='investimento' && t!=='investimento') return `collegata a un conto di ${t}`;
    return '';
  }

  const perSez=sez=>categorie.map((c,i)=>({...c,i})).filter(c=>c.sezione===sez);
  const senzaSez=categorie.map((c,i)=>({...c,i})).filter(c=>!SEZIONI.some(s=>s.v===c.sezione));
  const Blocco=({sez,label})=>(
    <div style={{marginBottom:18}}>
      <div className="card-title serif" style={{fontSize:15,margin:'4px 0 8px'}}>{label}</div>
      <div className="tbl-wrap"><table className="tbl">
        <thead><tr><th>Categoria</th><th>Sezione</th><th style={{width:250}}>Conto collegato</th><th className="num">Utilizzi</th><th></th></tr></thead>
        <tbody>
          {perSez(sez).length===0 && <tr><td colSpan="5" className="empty-state">Nessuna categoria</td></tr>}
          {perSez(sez).map(c=>{
            const warn=incoerenza(c);
            return (
            <tr key={c.i}>
              <td><input type="text" value={draft[c.i]!=null?draft[c.i]:c.nome}
                    onChange={e=>{const v=e.target.value; setDraft(d=>({...d,[c.i]:v}));}}
                    onBlur={()=>renameCommit(c.i)}
                    onKeyDown={e=>{ if(e.key==='Enter') e.target.blur(); if(e.key==='Escape'){ setDraft(d=>{const n={...d}; delete n[c.i]; return n;}); } }}
                    title="Modifica il nome e premi Invio: verrà aggiornato anche nelle scritture"
                    style={{minWidth:200}}/></td>
              <td><select value={c.sezione} onChange={e=>setSez(c.i,e.target.value)}>{SEZIONI.map(s=><option key={s.v} value={s.v}>{s.l}</option>)}</select></td>
              <td>
                <ContoSelect value={contoDi(c.nome)} onChange={v=>setContoDi(c.nome,v)}
                  filter={x=>x.categoria==='RICAVI'||x.categoria==='COSTI'||x.categoria==='RICAVI/COSTI'||/^IMM\./.test(x.categoria)}/>
                {warn && <div style={{fontSize:11,color:'var(--danger)',marginTop:3}} title={warn}>⚠ {warn}</div>}
              </td>
              <td className="num">{usi[nk(c.nome)]||0}</td>
              <td><button className="btn danger sm" onClick={()=>del(c.i)}>✕</button></td>
            </tr>
          );})}
        </tbody>
      </table></div>
    </div>
  );

  return (
    <div>
      <PageHead title="Categorie" sub="Categorie del rendiconto finanziario"/>
      <div className="card" style={{marginBottom:20,maxWidth:620}}>
        <div className="card-title">Aggiungi categoria</div>
        <div style={{display:'flex',gap:10,alignItems:'flex-end',flexWrap:'wrap'}}>
          <div className="form-row" style={{flex:1,minWidth:180}}><label>Nome</label><input type="text" value={nuovaNome} onChange={e=>setNuovaNome(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')add();}} placeholder="Es. Spese viaggio"/></div>
          <div className="form-row" style={{minWidth:160}}><label>Sezione</label><select value={nuovaSez} onChange={e=>setNuovaSez(e.target.value)}>{SEZIONI.map(s=><option key={s.v} value={s.v}>{s.l}</option>)}</select></div>
          <button className="btn accent" onClick={add}>+ Aggiungi</button>
        </div>
      </div>
      <Blocco sez="entrata" label="Entrate"/>
      <Blocco sez="uscita" label="Uscite"/>
      <Blocco sez="investimento" label="Investimenti"/>
      <Blocco sez="interno" label="Interne (escluse dal flusso)"/>
      {senzaSez.length>0 && <div style={{marginBottom:18}}>
        <div className="card-title serif" style={{fontSize:15,margin:'4px 0 8px'}}>Senza sezione ({senzaSez.length}) — assegna una sezione per vederle nel rendiconto</div>
        <div className="tbl-wrap"><table className="tbl">
          <thead><tr><th>Categoria</th><th>Sezione</th><th className="num">Utilizzi</th><th></th></tr></thead>
          <tbody>
            {senzaSez.map(c=>(
              <tr key={c.i}>
                <td><input type="text" value={draft[c.i]!=null?draft[c.i]:c.nome}
                      onChange={e=>{const v=e.target.value; setDraft(d=>({...d,[c.i]:v}));}}
                      onBlur={()=>renameCommit(c.i)}
                      onKeyDown={e=>{ if(e.key==='Enter') e.target.blur(); if(e.key==='Escape'){ setDraft(d=>{const n={...d}; delete n[c.i]; return n;}); } }}
                      style={{minWidth:200}}/></td>
                <td><select value={c.sezione||''} onChange={e=>setSez(c.i,e.target.value)}><option value="">— scegli —</option>{SEZIONI.map(s=><option key={s.v} value={s.v}>{s.l}</option>)}</select></td>
                <td className="num">{usi[nk(c.nome)]||0}</td>
                <td><button className="btn danger sm" onClick={()=>del(c.i)}>✕</button></td>
              </tr>
            ))}
          </tbody>
        </table></div>
      </div>}
      <div style={{fontSize:12,color:'var(--ink-3)',marginTop:6,fontStyle:'italic'}}>Per rinominare una categoria modifica il nome e premi Invio (o esci dal campo): il nuovo nome viene applicato automaticamente a tutte le scritture che la usano e alla mappatura dell'import. Esc annulla la modifica.<br/>Il <b>conto collegato</b> è la contropartita che l'import propone per quella categoria ed è anche ciò che determina l'etichetta <i>ricavo/costo</i> nelle tendine: se non coincide con la sezione (es. categoria in Uscite collegata a un conto di ricavo) compare un avviso ⚠ e basta scegliere il conto corretto.</div>
    </div>
  );
}

/* ============================================================
   PAGINA: VARIAZIONI CASSA
   Righe libere (descrizione, importo con segno, conto contabile,
   categoria RF) -> proposta di scrittura -> conferma manuale.
   ============================================================ */
function PageVariazioni({onAddMany, scritture, saldi, categorie, toast}){
  const [liq,setLiq]=useState(3);                 // conto liquidità: default CASSA
  const [dataDef,setDataDef]=useState(todayISO());
  // --- rettifica automatica spese cassa ---
  const [mkRett,setMkRett]=useState(()=>{ const t=todayISO(); if(parseInt(t.slice(8,10),10)>10) return t.slice(0,7);
    const [y,m]=t.slice(0,7).split('-').map(Number); const py=m===1?y-1:y, pm=m===1?12:m-1; return py+'-'+String(pm).padStart(2,'0'); }); // nei primi 10 giorni propone il mese precedente
  const [rettCode,setRettCode]=useState(()=>contoByCode[CONTO_RETTIFICA_DEFAULT]?CONTO_RETTIFICA_DEFAULT:'');
  const [descrRett,setDescrRett]=useState('Rettifiche spese cassa');
  const [catRett,setCatRett]=useState('');
  const newRow=()=>({k:uid(), data:dataDef, descr:'', importo:'', conto:'', cat:''});
  const [rows,setRows]=useState(()=>[{k:uid(),data:todayISO(),descr:'',importo:'',conto:'',cat:''}]);
  const [proposta,setProposta]=useState(null);    // null finché non si preme "Proponi"

  const invalida=()=>setProposta(null);
  const setRow=(i,k,v)=>{ invalida(); setRows(rs=>rs.map((r,j)=>j===i?{...r,[k]:v}:r)); };
  const addRow=()=>{ invalida(); setRows(rs=>[...rs,newRow()]); };
  const delRow=i=>{ invalida(); setRows(rs=>rs.length>1?rs.filter((_,j)=>j!==i):[newRow()]); };
  const resetAll=()=>{ setProposta(null); setRows([newRow()]); };

  const impOf=r=>{ const n=parseFloat(String(r.importo).replace(',','.')); return isNaN(n)?0:n; };
  const isValida=r=>!!r.data && !!r.conto && Math.abs(impOf(r))>0.004;
  const valide=rows.filter(isValida);
  const incomplete=rows.filter(r=>(r.descr||r.importo!==''||r.conto) && !isValida(r)).length;

  const totale=r2(valide.reduce((s,r)=>s+impOf(r),0));
  const saldoAtt=(saldi[liq]&&saldi[liq].saldo)||0;

  function proponi(){
    if(!valide.length){ toast('Nessuna riga completa (servono importo ≠ 0 e conto)','error'); return; }
    const scrit=valide.map(r=>{
      const v=r2(impOf(r)); const imp=Math.abs(v); const pos=v>0; const cc=parseInt(r.conto);
      return {
        id:uid(), data:r.data,
        descr:(r.descr||'').trim() || (pos?'Variazione cassa in aumento':'Variazione cassa in diminuzione'),
        righe: pos ? [{c:liq,d:imp,a:0},{c:cc,d:0,a:imp}]
                   : [{c:cc,d:imp,a:0},{c:liq,d:0,a:imp}],
        origine:'manuale', tipo:'liquidita', cat:(r.cat||'').trim(),
        _pos:pos, _imp:imp, _cc:cc
      };
    });
    setProposta(scrit);
  }
  const rett = useMemo(
    ()=>calcRettificaCassa(scritture, liq, parseInt(rettCode)||0, mkRett),
    [scritture, liq, rettCode, mkRett]
  );

  function proponiRettifica(){
    const cc=parseInt(rettCode);
    if(!cc){ toast('Seleziona il conto di rettifica','error'); return; }
    if(rett.residuo<=0.004){
      toast(rett.uscite>0.004?'Il mese è già rettificato per intero':'Nessuna uscita di cassa in questo mese','error');
      return;
    }
    const imp=rett.residuo, data=fineMese(mkRett);
    setProposta([{
      id:uid(), data,
      descr:(descrRett||'').trim()||'Rettifiche spese cassa',
      righe:[{c:liq,d:imp,a:0},{c:cc,d:0,a:imp}],
      origine:'manuale', tipo:'liquidita', cat:(catRett||'').trim(),
      _pos:true, _imp:imp, _cc:cc
    }]);
  }

  function conferma(){
    if(!proposta||!proposta.length) return;
    const puliti=proposta.map(s=>{ const {_pos,_imp,_cc,...rest}=s; return rest; });
    onAddMany(puliti);
    toast(`${puliti.length} ${puliti.length===1?'scrittura registrata':'scritture registrate'}`,'success');
    resetAll();
  }

  return (
    <div>
      <PageHead title="Variazioni cassa" sub="Inserisci le variazioni, poi proponi la scrittura e confermala">
        <button className="btn ghost" onClick={resetAll}>Svuota</button>
        <button className="btn accent" onClick={proponi} disabled={!valide.length}>⇢ Proponi scritture</button>
      </PageHead>

      <div className="card" style={{marginBottom:14,display:'flex',gap:18,flexWrap:'wrap',alignItems:'flex-end'}}>
        <div className="form-row" style={{minWidth:220}}>
          <label>Conto liquidità (contropartita)</label>
          <ContoSelect value={liq} onChange={v=>{invalida();setLiq(v);}} filter={c=>c.categoria==='DISP. LIQUIDE'}/>
        </div>
        <div className="form-row" style={{minWidth:170}}>
          <label>Data predefinita</label>
          <input type="date" value={dataDef} onChange={e=>setDataDef(e.target.value)}/>
        </div>
        <div style={{marginLeft:'auto',fontSize:12.5,color:'var(--ink-2)',textAlign:'right'}}>
          Saldo {contoByCode[liq]?.nome}: <b>{eur(saldoAtt)}</b><br/>
          Variazione proposta: <b style={{color:totale>=0?'var(--success)':'var(--danger)'}}>{totale>=0?'+':''}{num2(totale)}</b> → saldo <b>{eur(r2(saldoAtt+totale))}</b>
        </div>
      </div>

      <div className="card" style={{marginBottom:22,borderColor:'var(--accent)'}}>

const anLocale = {
  dati: null, sub: new Set(),
  load() {
    if (!this.dati) {
      try { this.dati = JSON.parse(localStorage.getItem(AN_LS) || "null"); } catch (e) { this.dati = null; }
      if (!this.dati || typeof this.dati !== "object") this.dati = {};
    }
    return this.dati;
  },
  get(path) { let o = this.load(); for (const p of path.split("/")) { if (!o || typeof o !== "object") return null; o = o[p]; } return o === undefined ? null : o; },
  set(path, val) {
    const parti = path.split("/"); let o = this.load();
    parti.slice(0, -1).forEach(p => { if (!o[p] || typeof o[p] !== "object") o[p] = {}; o = o[p]; });
    const ult = parti[parti.length - 1];
    if (val === null || val === undefined) delete o[ult]; else o[ult] = anPulisci(val);
    try { localStorage.setItem(AN_LS, JSON.stringify(this.dati)); } catch (e) { throw new Error("spazio del browser esaurito"); }
    this.sub.forEach(f => f());
  },
};
const anDb = {
  ascolta(path, cb, onErr) {
    if (firebaseReady) { const r = db.ref(path); const h = r.on("value", s => cb(s.val() || {}), onErr); return () => r.off("value", h); }
    const f = () => cb(anPulisci(anLocale.get(path) || {}));
    anLocale.sub.add(f); f();
    return () => anLocale.sub.delete(f);
  },
  set(path, val) {
    if (firebaseReady) return db.ref(path).set(val);
    try { anLocale.set(path, val); return Promise.resolve(); } catch (e) { return Promise.reject(e); }
  },
  push(path, val) {
    if (firebaseReady) { const r = db.ref(path).push(); return r.set(val).then(() => r.key); }
    const k = anNuovoId("d");
    try { anLocale.set(path + "/" + k, val); return Promise.resolve(k); } catch (e) { return Promise.reject(e); }
  },
  remove(path) { return this.set(path, null); },
};
