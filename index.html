function PageInvestimenti({scritture, authUser, toast}){
  const [lock,setLock]=useState(undefined);      // undefined = caricamento · null = non ancora configurato
  const [pos,setPos]=useState(null);
  const [aperto,setAperto]=useState(()=>Date.now()<invUnlockedUntil);
  const [pin,setPin]=useState(''); const [pin2,setPin2]=useState('');
  const [busy,setBusy]=useState(false);
  const [det,setDet]=useState(null);             // id dell'investimento aperto nel dettaglio
  const [sicurezza,setSicurezza]=useState(false);
  const [prezziStato,setPrezziStato]=useState('');
  const [rendMis,setRendMis]=useState('pct');     // classifica rendimenti: pct | eur

  useEffect(()=>{
    if(!firebaseReady){ setLock(null); setPos({}); return; }
    const rl=db.ref('investimenti/lock'), rp=db.ref('investimenti/posizioni');
    const h1=rl.on('value',s=>setLock(s.val()||null));
    const h2=rp.on('value',s=>setPos(s.val()||{}));
    return ()=>{ rl.off('value',h1); rp.off('value',h2); };
  },[]);

  // finché la pagina si usa lo sblocco si rinnova; dopo INV_LOCK_MIN minuti di inattività si riblocca
  useEffect(()=>{
    if(!aperto) return;
    const bump=()=>{ invUnlockedUntil=Date.now()+INV_LOCK_MIN*60000; };
    bump();
    const ev=['click','keydown','touchstart','scroll'];
    ev.forEach(e=>window.addEventListener(e,bump,{passive:true}));
    const t=setInterval(()=>{ if(Date.now()>invUnlockedUntil) setAperto(false); },15000);
    return ()=>{ ev.forEach(e=>window.removeEventListener(e,bump)); clearInterval(t); };
  },[aperto]);

  const contiFin = CONTI.filter(c=>c.categoria==='IMM. FINANZIARIE');
  const posList = useMemo(()=>Object.entries(pos||{}).filter(([,p])=>p).map(([id,p])=>({id,...p}))
    .sort((a,b)=>((a.ordine??99)-(b.ordine??99))||(a.nome||'').localeCompare(b.nome||'')),[pos]);

  const calc = useMemo(()=>{
    // costo di carico da estratto: sostituisce lo storico contabile fino alla sua data
    const hasCosto=p=>p.costoCarico!=null && p.costoCarico!=='' && !isNaN(Number(p.costoCarico)) && !!p.dataCosto;
    const perPos={}; posList.forEach(p=>{ perPos[p.id]={versato:hasCosto(p)?r2(Number(p.costoCarico)):0, mov:[], inCosto:0}; });
    const cutoff={}; posList.forEach(p=>{ if(hasCosto(p)){ const c=Number(p.conto); if(!cutoff[c]||p.dataCosto<cutoff[c]) cutoff[c]=p.dataCosto; } });
    const incl={};      // conto -> movimenti storici non attribuiti ma già compresi nei costi di carico
    const nonAttr={};
    const codFin=new Set(contiFin.map(c=>c.codice));
    (scritture||[]).forEach(s=>(s.righe||[]).forEach(r=>{
      if(!codFin.has(r.c)) return;
      const imp=r2((r.d||0)-(r.a||0)); if(Math.abs(imp)<0.005) return;
      const de=(s.descr||'').toUpperCase();
      const cand=posList.filter(p=>Number(p.conto)===r.c);
      let p=cand.find(x=>x.chiave && String(x.chiave).split('|').some(k=>k.trim() && de.includes(k.trim().toUpperCase())));
      // un prodotto senza parola chiave prende il resto del conto, ma non lo storico già compreso nei costi di carico
      if(!p && !(cutoff[r.c] && (s.data||'')<=cutoff[r.c])) p=cand.find(x=>!x.chiave);
      const m={data:s.data,descr:s.descr,imp};
      if(p){
        if(hasCosto(p) && (s.data||'')<=p.dataCosto){ m.inCosto=true; perPos[p.id].inCosto=r2(perPos[p.id].inCosto+imp); }
        else perPos[p.id].versato=r2(perPos[p.id].versato+imp);
        perPos[p.id].mov.push(m);
      }
      else if(cutoff[r.c] && (s.data||'')<=cutoff[r.c]){ incl[r.c]=incl[r.c]||[]; incl[r.c].push(m); }
      else { nonAttr[r.c]=nonAttr[r.c]||{versato:0,mov:[]}; nonAttr[r.c].versato=r2(nonAttr[r.c].versato+imp); nonAttr[r.c].mov.push(m); }
    }));
    const righe=posList.map(p=>{
      const vals=Object.entries(p.valori||{}).filter(([,x])=>x&&x.data).map(([vid,x])=>({vid,...x})).sort((a,b)=>a.data.localeCompare(b.data));
      const ult=vals.length?vals[vals.length-1]:null;
      const versato=perPos[p.id].versato;
      const valore=ult?(Number(ult.valore)||0):versato;
      const pl=ult?r2(valore-versato):null;
      // per il grafico: storico contabile + allineamento al costo di carico alla sua data
      const movSerie=[...perPos[p.id].mov.map(m=>({data:m.data,imp:m.imp}))];
      // l'allineamento al costo di carico avviene alla data del costo o, se prima, al primo valore inserito
      const adjD=hasCosto(p) ? ((vals.length && vals[0].data<p.dataCosto) ? vals[0].data : p.dataCosto) : null;
      if(adjD) movSerie.push({data:adjD, imp:r2(Number(p.costoCarico)-perPos[p.id].inCosto), adj:true});
      return {...p, gruppo:invGruppo(p), conCosto:hasCosto(p), adjD, movSerie, versato, mov:perPos[p.id].mov.sort((a,b)=>(b.data||'').localeCompare(a.data||'')), vals, ult, valore,
        pl, plPct:(ult&&Math.abs(versato)>0.005)?pl/versato*100:null};
    });
    const na=Object.entries(nonAttr).map(([c,x])=>({conto:Number(c),gruppo:invGruppo({conto:Number(c)}),...x}));
    // serie per i grafici
    const adjCut={}; righe.forEach(x=>{ if(x.adjD){ const c=Number(x.conto); if(!adjCut[c]||x.adjD<adjCut[c]) adjCut[c]=x.adjD; } });
    const inclList=Object.entries(incl).map(([c,mm])=>({conto:Number(c),mov:[...mm.filter(m=>m.data<(adjCut[c]||cutoff[c])),{data:adjCut[c]||cutoff[c],imp:-r2(mm.filter(m=>m.data<(adjCut[c]||cutoff[c])).reduce((t,m)=>t+m.imp,0))}]}));
    const dates=invDates([...righe.flatMap(x=>x.movSerie),...na.flatMap(x=>x.mov),...inclList.flatMap(x=>x.mov)], righe.flatMap(x=>x.vals));
    const serieTot=dates.map(d=>({d,vers:0,val:0}));
    const somma=arr=>arr.forEach((p,i)=>{ serieTot[i].vers=r2(serieTot[i].vers+p.vers); serieTot[i].val=r2(serieTot[i].val+p.val); });
    righe.forEach(x=>{ x.serie=invSerie(x.movSerie,x.vals,dates,x.conCosto?x.dataCosto:null); somma(x.serie); });
    na.forEach(x=>somma(invSerie(x.mov,[],dates)));
    inclList.forEach(x=>somma(invSerie(x.mov,[],dates)));
    // confronto con la contabilità: saldo dei conti titoli usati nel gruppo
    const saldoConto={}; (scritture||[]).forEach(s=>(s.righe||[]).forEach(r=>{ if(codFin.has(r.c)) saldoConto[r.c]=r2((saldoConto[r.c]||0)+(r.d||0)-(r.a||0)); }));
    const nomiGruppi=[...new Set([...INV_GRUPPI,...righe.map(x=>x.gruppo),...na.map(x=>x.gruppo)])];
    const gruppi=nomiGruppi.map(g=>{
      const rr=righe.filter(x=>x.gruppo===g), nn=na.filter(x=>x.gruppo===g);
      const versato=r2(rr.reduce((s,x)=>s+x.versato,0)+nn.reduce((s,x)=>s+x.versato,0));
      const valore=r2(rr.reduce((s,x)=>s+x.valore,0)+nn.reduce((s,x)=>s+x.versato,0));
      const conti=[...new Set([...rr.map(x=>Number(x.conto)),...nn.map(x=>x.conto)])];
      // la differenza ha senso solo se i conti del gruppo non sono condivisi con altri gruppi
      const condivisi=conti.some(c=>righe.some(x=>Number(x.conto)===c && x.gruppo!==g));
      const contab=r2(conti.reduce((t,c)=>t+(saldoConto[c]||0),0));
      return {nome:g, righe:rr, na:nn, versato, valore, pl:r2(valore-versato), contab, diffContab:condivisi?null:r2(versato-contab)};
    }).filter(g=>g.righe.length||g.na.length);
    const tot={versato:r2(righe.reduce((s,x)=>s+x.versato,0)+na.reduce((s,x)=>s+x.versato,0))};
    tot.valore=r2(righe.reduce((s,x)=>s+x.valore,0)+na.reduce((s,x)=>s+x.versato,0));
    tot.pl=r2(tot.valore-tot.versato);
    tot.plPct=Math.abs(tot.versato)>0.005?tot.pl/tot.versato*100:null;
    const pe=righe.filter(x=>x.tipo==='Private equity');
    tot.impegno=r2(pe.reduce((s,x)=>s+(Number(x.impegno)||0),0));
    tot.residuo=r2(pe.reduce((s,x)=>s+Math.max(0,(Number(x.impegno)||0)-x.versato),0));
    return {righe,na,tot,serieTot,gruppi};
  },[posList,scritture]);

  async function aggiornaPrezzi(forza){
    const lista=calc.righe.filter(x=>x.codiceBI && Number(x.quote)>0);
    if(!lista.length){ if(forza) toast('Nessun investimento con codice Borsa Italiana e quote','error'); return; }
    if(!forza && invPrezziFatti===todayISO()) return;
    invPrezziFatti=todayISO(); setPrezziStato('Aggiornamento prezzi…');
    const up={}; const ok=[], ko=[];
    for(const x of lista){
      try{
        const {prezzo,data}=await invPrezzoBI(x.codiceBI);
        const dopo=r2(x.mov.filter(m=>!m.inCosto && x.dataQuote && (m.data||'')>x.dataQuote).reduce((t,m)=>t+m.imp,0));
        const valore=r2(Number(x.quote)*prezzo+dopo);
        up['investimenti/posizioni/'+x.id+'/valori/bi'+data.replace(/-/g,'')]={data,valore,prezzo,quote:Number(x.quote),auto:true};
        up['investimenti/posizioni/'+x.id+'/ultimoPrezzo']={prezzo,data,letto:new Date().toISOString()};
        ok.push(x.nome+' '+num2(prezzo)+' ('+fmtDate(data)+')');
      }catch(e){ ko.push(x.nome); }
    }
    if(Object.keys(up).length) await db.ref().update(up);
    setPrezziStato((ok.length?'Prezzi Borsa Italiana: '+ok.join(' · '):'')+(ko.length?(ok.length?' — ':'')+'non riuscito: '+ko.join(', '):''));
    if(forza) toast(ok.length?'Prezzi aggiornati':'Aggiornamento non riuscito', ok.length?'success':'error');
  }
  useEffect(()=>{ if(aperto && pos) aggiornaPrezzi(false); },[aperto, !!pos]);
  const sblocca=()=>{ invUnlockedUntil=Date.now()+INV_LOCK_MIN*60000; setAperto(true); setPin(''); setPin2(''); };
  const blocca=()=>{ invUnlockedUntil=0; setAperto(false); setSicurezza(false); setDet(null); };

  async function impostaPin(){
    if(!/^\d{4,8}$/.test(pin)){ toast('Il PIN deve avere da 4 a 8 cifre','error'); return; }
    if(pin!==pin2){ toast('I due PIN non coincidono','error'); return; }
    try{
      const salt=invB64u(invRnd(16)); const hash=await invHash(pin,salt);
      await db.ref('investimenti/lock').update({salt,hash,aggiornato:new Date().toISOString()});
      if(!pos || !Object.keys(pos).length){
        const up={}; INV_DEFAULT.forEach((p,i)=>{ up['p'+Date.now().toString(36)+i]={...p,creato:todayISO()}; });
        await db.ref('investimenti/posizioni').update(up);
      }
      toast('PIN impostato','success'); sblocca();
    }catch(e){ toast('Salvataggio non riuscito: '+(e.message||e),'error'); }
  }
  async function provaPin(){
    if(!lock||!lock.hash) return;
    const h=await invHash(pin,lock.salt);
    if(h===lock.hash) sblocca(); else { toast('PIN errato','error'); setPin(''); }
  }
  async function attivaBio(){
    if(!invBioOk()){ toast('Face ID / Touch ID non disponibile su questo browser','error'); return; }
    try{
      setBusy(true);
      const cred=await navigator.credentials.create({publicKey:{
        challenge:invRnd(32), rp:{name:'Contabilità Personale', id:location.hostname},
        user:{id:invRnd(16), name:(authUser&&authUser.email)||'utente', displayName:'Investimenti'},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged'},
        timeout:60000, attestation:'none'}});
      const id=invB64u(cred.rawId);
      await db.ref('investimenti/lock/creds/'+invKey(id)).set({id, device:invDevice(), creato:new Date().toISOString()});
      toast('Face ID / Touch ID attivato su questo dispositivo','success');
    }catch(e){ if(!e||e.name!=='NotAllowedError') toast('Attivazione non riuscita: '+((e&&e.message)||e),'error'); }
    finally{ setBusy(false); }
  }
  async function sbloccaBio(){
    const creds=Object.values((lock&&lock.creds)||{}).filter(c=>c&&c.id);
    if(!creds.length||!invBioOk()) return;
    try{
      setBusy(true);
      const res=await navigator.credentials.get({publicKey:{challenge:invRnd(32), rpId:location.hostname, timeout:60000,
        userVerification:'required', allowCredentials:creds.map(c=>({type:'public-key', id:invUnb64u(c.id), transports:['internal']}))}});
      if(res) sblocca();
    }catch(e){ if(!e||e.name!=='NotAllowedError') toast('Sblocco non riuscito: '+((e&&e.message)||e),'error'); }
    finally{ setBusy(false); }
  }
  async function togliDispositivo(k){
    if(!window.confirm('Togliere questo dispositivo dallo sblocco biometrico?')) return;
    await db.ref('investimenti/lock/creds/'+k).remove(); toast('Dispositivo rimosso','success');
  }
  // apre una scheda vuota: non salva niente finché non si preme Salva
  function nuovo(){ setDet('__nuovo'); }

  const pinInput = (val,set,ph,onEnter) => (
    <input type="password" inputMode="numeric" autoComplete="off" maxLength={8} value={val} placeholder={ph}
      onChange={e=>set(e.target.value.replace(/\D/g,''))} onKeyDown={e=>{ if(e.key==='Enter'&&onEnter) onEnter(); }}
      style={{fontSize:20,letterSpacing:6,textAlign:'center',maxWidth:220}}/>
  );

  if(lock===undefined || pos===null) return <div><PageHead title="Investimenti" sub="Caricamento…"/></div>;

  /* ---------- schermata di blocco ---------- */
  if(!aperto){
    const creds=Object.values((lock&&lock.creds)||{}).filter(c=>c&&c.id);
    const configurato=!!(lock&&lock.hash);
    return (
      <div>
        <PageHead title="Investimenti" sub="Sezione protetta"/>
        <div className="card" style={{maxWidth:420,margin:'10px auto',textAlign:'center',padding:'26px 20px'}}>
          <div style={{fontSize:34,marginBottom:6}}>🔒</div>
          {!configurato ? <>
            <div className="card-title" style={{textAlign:'center'}}>Imposta il PIN della sezione</div>
            <p style={{fontSize:13,color:'var(--ink-2)',marginTop:0}}>Da 4 a 8 cifre. Dopo potrai attivare Face ID o Touch ID su ogni dispositivo.</p>
            <div style={{display:'grid',gap:10,justifyItems:'center'}}>
              {pinInput(pin,setPin,'PIN')}
              {pinInput(pin2,setPin2,'Ripeti PIN',impostaPin)}
              <button className="btn accent" onClick={impostaPin}>Imposta PIN</button>
            </div>
          </> : <>
            <div className="card-title" style={{textAlign:'center'}}>Sblocca gli investimenti</div>
            {creds.length>0 && invBioOk() && <div style={{margin:'6px 0 16px'}}>
              <button className="btn accent" onClick={sbloccaBio} disabled={busy} style={{width:'100%',maxWidth:260}}>Sblocca con Face ID / Touch ID</button>
              <div style={{fontSize:11.5,color:'var(--ink-3)',marginTop:8}}>oppure con il PIN</div>
            </div>}
            <div style={{display:'grid',gap:10,justifyItems:'center'}}>
              {pinInput(pin,setPin,'PIN',provaPin)}
              <button className={'btn '+(creds.length?'ghost':'accent')} onClick={provaPin} disabled={!pin}>Sblocca con PIN</button>
            </div>
          </>}
        </div>
      </div>
    );
  }

  /* ---------- sezione sbloccata ---------- */
  const {righe,na,tot,serieTot,gruppi}=calc;
  const pesoBase=Math.max(0.01,righe.reduce((s,x)=>s+Math.max(0,x.valore),0)+na.reduce((s,x)=>s+Math.max(0,x.versato),0));
  const creds=Object.entries((lock&&lock.creds)||{}).filter(([,c])=>c&&c.id);
  const pe=righe.filter(x=>x.tipo==='Private equity');
  const pct=x=>x==null?'':(x>0?'+':'')+x.toFixed(1).replace('.',',')+'%';
  const detRow=det==='__nuovo'
    ? {id:'__nuovo', nuovo:true, nome:'', tipo:'Fondo', gruppo:'', conto:'', chiave:'', vals:[], mov:[], versato:0, valore:0, pl:null, ordine:righe.length+1}
    : (det?righe.find(x=>x.id===det):null);
  const compo=[...righe.map(x=>({nome:x.nome,v:Math.max(0,x.valore)})),...na.map(x=>({nome:(contoByCode[x.conto]?.nome||'#'+x.conto)+' (non attr.)',v:Math.max(0,x.versato)}))].filter(c=>c.v>0.005).sort((a,b)=>b.v-a.v);

  return (
    <div>
      <PageHead title="Investimenti" sub={`Versato da estratto titoli e libro giornale, valore di mercato inserito a mano · si riblocca dopo ${INV_LOCK_MIN} minuti di inattività`}>
        <button className="btn ghost sm" onClick={()=>aggiornaPrezzi(true)}>↻ Prezzi</button>
        <button className="btn ghost sm" onClick={()=>setSicurezza(x=>!x)}>⚙ Sicurezza</button>
        <button className="btn ghost sm" onClick={blocca}>🔒 Blocca</button>
        <button className="btn accent sm" onClick={nuovo}>+ Aggiungi prodotto</button>
      </PageHead>

      {sicurezza && <div className="card" style={{marginBottom:16}}>
        <div className="card-title">Sicurezza della sezione</div>
        <div style={{fontSize:13,marginBottom:10}}>
          <b>Face ID / Touch ID</b> — {creds.length?`${creds.length} dispositiv${creds.length===1?'o attivo':'i attivi'}`:'nessun dispositivo attivo'}
          {creds.map(([k,c])=>(
            <div key={k} style={{display:'flex',alignItems:'center',gap:8,marginTop:6,fontSize:12.5}}>
              <span>{c.device||'Dispositivo'} · attivato il {fmtDate((c.creato||'').slice(0,10))}</span>
              <button className="btn ghost sm" onClick={()=>togliDispositivo(k)}>Togli</button>
            </div>
          ))}
          <div style={{marginTop:10}}>
            <button className="btn accent sm" onClick={attivaBio} disabled={busy||!invBioOk()}>Attiva su questo dispositivo ({invDevice()})</button>
            {!invBioOk() && <span style={{fontSize:12,color:'var(--ink-3)',marginLeft:8}}>Non supportato da questo browser</span>}
          </div>
        </div>
        <div style={{fontSize:13,borderTop:'1px solid var(--rule)',paddingTop:10}}>
          <b>Cambia PIN</b>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:8,alignItems:'center'}}>
            {pinInput(pin,setPin,'Nuovo PIN')}{pinInput(pin2,setPin2,'Ripeti',impostaPin)}
            <button className="btn ghost sm" onClick={impostaPin}>Salva PIN</button>
          </div>
        </div>
        <div style={{fontSize:11.5,color:'var(--ink-3)',marginTop:10,fontStyle:'italic'}}>
          È un blocco di riservatezza: impedisce di vedere la sezione a chi usa l'app sul tuo telefono o computer.
          I dati restano comunque protetti dal tuo accesso Firebase, come il resto della contabilità.
        </div>
      </div>}

      {prezziStato && <div style={{fontSize:11.5,color:'var(--ink-3)',margin:'-6px 0 12px'}}>{prezziStato}</div>}
      <div className="kpi-grid">
        <Kpi accent label="Valore attuale" value={eur(tot.valore)} hint="Ultimo valore inserito, altrimenti il versato"/>
        <Kpi label="Totale versato" value={eur(tot.versato)} hint="Costo di carico da estratto + versamenti successivi"/>
        <Kpi label="Plus / minus" value={eur(tot.pl)} neg={tot.pl<0} hint={tot.plPct==null?'':pct(tot.plPct)+' sul versato'}/>
        {tot.impegno>0
          ? <Kpi label="Private equity da richiamare" value={eur(tot.residuo)} hint={`Impegno totale ${eur(tot.impegno)}`}/>
          : <Kpi label="Investimenti" value={String(righe.length)} hint="Tocca una scheda per il dettaglio"/>}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(290px,1fr))',gap:14,marginBottom:20}}>
        <div className="card" style={{marginBottom:0}}>
          <div className="card-title">Andamento del portafoglio</div>
          <InvChart config={invLineConfig(serieTot,true)} height={240}/>
          <div style={{fontSize:11,color:'var(--ink-3)',marginTop:6}}>Linea piena: valore (ultimo valore inserito per ogni titolo, altrimenti il versato). Tratteggio: soldi versati.</div>
        </div>
        <div className="card" style={{marginBottom:0}}>
          <div className="card-title">Composizione</div>
          <InvChart height={240} config={{type:'doughnut', data:{labels:compo.map(c=>c.nome), datasets:[{data:compo.map(c=>c.v), backgroundColor:compo.map((c,i)=>INV_COL[i%INV_COL.length]), borderWidth:1}]},
            options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}},
              tooltip:{callbacks:{label:c=>c.label+': '+eur(c.parsed)+' ('+(c.parsed/pesoBase*100).toFixed(1).replace('.',',')+'%)'}}}}}}/>
          <div style={{display:'flex',gap:12,flexWrap:'wrap',justifyContent:'center',marginTop:6,fontSize:12}}>
            {gruppi.map(g=><span key={g.nome}>{g.nome} <b>{(Math.max(0,g.valore)/pesoBase*100).toFixed(1).replace('.',',')}%</b></span>)}
          </div>
        </div>
      </div>

      {(()=>{ const rr=righe.filter(x=>x.pl!=null).map(x=>({nome:x.nome,pl:x.pl,pct:x.plPct||0,valore:x.valore,versato:x.versato}))
          .sort((a,b)=>rendMis==='pct'?b.pct-a.pct:b.pl-a.pl);
        if(!rr.length) return null;
        const val=x=>rendMis==='pct'?Math.round(x.pct*100)/100:x.pl;
        return (
          <div className="card" style={{marginBottom:20}}>
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',marginBottom:6}}>
              <div className="card-title" style={{margin:0}}>Rendimento per titolo</div>
              <div className="tipo-switch" style={{gridTemplateColumns:'1fr 1fr',maxWidth:150,margin:'0 0 0 auto'}}>
                <button className={rendMis==='pct'?'active':''} onClick={()=>setRendMis('pct')}>%</button>
                <button className={rendMis==='eur'?'active':''} onClick={()=>setRendMis('eur')}>€</button>
              </div>
            </div>
            <InvChart height={Math.max(140,rr.length*42+40)} config={{type:'bar',
              data:{labels:rr.map(x=>x.nome),datasets:[{label:rendMis==='pct'?'Rendimento %':'Plus/minus €',data:rr.map(val),
                backgroundColor:rr.map(x=>x.pl>=0?'rgba(47,125,79,.85)':'rgba(192,67,63,.85)'),borderRadius:4,barThickness:22}]},
              options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
                tooltip:{callbacks:{label:c=>{ const x=rr[c.dataIndex]; return (x.pl>0?'+':'')+num2(x.pl)+' € · '+(x.pct>0?'+':'')+x.pct.toFixed(2).replace('.',',')+'% (valore '+eur(x.valore)+', versato '+eur(x.versato)+')'; }}}},
                scales:{x:{ticks:{callback:v=>rendMis==='pct'?v+'%':invEurTick(v),font:{size:10}},grid:{color:'#eef2f8'}},y:{ticks:{font:{size:11}},grid:{display:false}}}}}}/>
            <div className="tbl-wrap" style={{marginTop:10}}><table className="tbl">
              <thead><tr><th>#</th><th>Titolo</th><th className="num">Versato</th><th className="num">Valore</th><th className="num">Plus/minus</th><th className="num">%</th></tr></thead>
              <tbody>{rr.map((x,i)=>(
                <tr key={x.nome}><td style={{color:'var(--ink-3)'}}>{i+1}</td><td>{x.nome}</td><td className="num">{num2(x.versato)}</td><td className="num">{num2(x.valore)}</td>
                  <td className={'num '+(x.pl<0?'neg':'pos')}>{x.pl>0?'+':''}{num2(x.pl)}</td><td className={'num '+(x.pl<0?'neg':'pos')} style={{fontWeight:600}}>{x.pct>0?'+':''}{x.pct.toFixed(2).replace('.',',')}%</td></tr>
              ))}</tbody>
            </table></div>
            <div style={{fontSize:11,color:'var(--ink-3)',marginTop:6}}>Rendimento semplice: (valore − versato) / versato, sui titoli con un valore di mercato.</div>
          </div>
        ); })()}

      {gruppi.map(g=>(
        <div key={g.nome} style={{marginBottom:22}}>
          <div style={{display:'flex',alignItems:'baseline',gap:12,flexWrap:'wrap',margin:'4px 0 10px',borderBottom:'1px solid var(--rule)',paddingBottom:6}}>
            <div className="card-title serif" style={{fontSize:16,margin:0}}>{g.nome}</div>
            <span style={{fontSize:12.5,color:'var(--ink-2)'}}>valore <b>{eur(g.valore)}</b> · versato {eur(g.versato)}
              {Math.abs(g.pl)>0.005 && <> · <span className={g.pl<0?'neg':'pos'}>{g.pl>0?'+':''}{num2(g.pl)} € ({pct(Math.abs(g.versato)>0.005?g.pl/g.versato*100:null)})</span></>}</span>
            {g.diffContab!=null && Math.abs(g.diffContab)>0.5 && <span style={{fontSize:11.5,color:'var(--ink-3)'}} title="Saldo dei conti titoli in contabilità rispetto al costo di carico da estratto">in contabilità {eur(g.contab)} · differenza {g.diffContab>0?'+':''}{num2(g.diffContab)} €</span>}
          </div>
          <div className="liq-grid">
            {g.righe.map(x=>{
              const peso=Math.max(0,x.valore)/pesoBase*100;
              return (
                <div className="liq-card" key={x.id} onClick={()=>setDet(x.id)} style={{cursor:'pointer'}} title="Apri il dettaglio">
                  <div className="head"><span className="name">{x.nome}</span><span style={{fontSize:11,color:'var(--ink-3)'}}>{x.tipo}</span></div>
                  <div className={'saldo'+(x.valore<0?' neg':'')}>{eur(x.valore)}</div>
                  <div className="delta">
                    versato {eur(x.versato)}
                    {x.pl!=null && <> · <span className={x.pl<0?'neg':'pos'}>{x.pl>0?'+':''}{num2(x.pl)} € ({pct(x.plPct)})</span></>}
                    <div style={{fontSize:11,color:'var(--ink-3)',marginTop:2}}>{x.ult?'valore al '+fmtDate(x.ult.data):'nessun valore di mercato inserito'}</div>
                  </div>
                  <div style={{height:5,background:'var(--rule)',borderRadius:3,marginTop:8,overflow:'hidden'}}>
                    <div style={{width:peso.toFixed(1)+'%',height:'100%',background:'var(--accent)'}}></div>
                  </div>
                  <div style={{fontSize:10.5,color:'var(--ink-3)',marginTop:3}}>{peso.toFixed(1).replace('.',',')}% del portafoglio</div>
                </div>
              );
            })}
            {g.na.map(x=>(
              <div className="liq-card" key={'na'+x.conto} style={{opacity:.8}}>
                <div className="head"><span className="name">{contoByCode[x.conto]?.nome||('#'+x.conto)}</span><span style={{fontSize:11,color:'var(--ink-3)'}}>non attribuito</span></div>
                <div className="saldo">{eur(x.versato)}</div>
                <div className="delta">Movimenti del conto non collegati a nessun investimento: crea un investimento su questo conto.</div>
              </div>
            ))}
          </div>
        </div>
      ))}

      {pe.length>0 && <div className="card" style={{marginBottom:18}}>
        <div className="card-title">Private equity · richiami di capitale</div>
        {pe.map(x=>{
          const imp=Number(x.impegno)||0; const q=imp>0?Math.min(100,x.versato/imp*100):0;
          return (
            <div key={x.id} style={{marginBottom:12,fontSize:13}}>
              <div style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
                <b>{x.nome}</b>
                <span>richiamato <b>{eur(x.versato)}</b>{imp>0?<> su {eur(imp)} · da richiamare <b>{eur(Math.max(0,imp-x.versato))}</b></>:' · impegno non inserito'}</span>
              </div>
              {imp>0 && <div style={{height:7,background:'var(--rule)',borderRadius:4,marginTop:6,overflow:'hidden'}}><div style={{width:q.toFixed(1)+'%',height:'100%',background:'var(--accent)'}}></div></div>}
              {(x.prossimoData||x.prossimoImporto) && <div style={{fontSize:12,color:'var(--ink-2)',marginTop:5}}>Prossimo richiamo: <b>{x.prossimoImporto?eur(Number(x.prossimoImporto)):'importo da definire'}</b>{x.prossimoData?' il '+fmtDate(x.prossimoData):' · data da definire'}</div>}
            </div>
          );
        })}
        <div style={{fontSize:11.5,color:'var(--ink-3)'}}>Impegno e prossimo richiamo si impostano dal dettaglio dell'investimento.</div>
      </div>}

      {detRow && <InvDettaglio x={detRow} contiFin={contiFin} gruppiEsistenti={gruppi.map(g=>g.nome)} onClose={()=>setDet(null)} toast={toast}/>}
    </div>
  );
}

function InvDettaglio({x, contiFin, gruppiEsistenti, onClose, toast}){
  const [f,setF]=useState({isin:x.isin||'',quote:x.quote??'',dataQuote:x.dataQuote||'',codiceBI:x.codiceBI||'',costoCarico:x.costoCarico??'',dataCosto:x.dataCosto||'',gruppo:x.gruppo||'Altri',nome:x.nome||'',tipo:x.tipo||'Altro',conto:String(x.conto||''),chiave:x.chiave||'',impegno:x.impegno??'',
    prossimoData:x.prossimoData||'',prossimoImporto:x.prossimoImporto??'',note:x.note||''});
  const [nv,setNv]=useState({data:todayISO(),valore:''});
  const ref=x.nuovo ? null : db.ref('investimenti/posizioni/'+x.id);
  const set=(k,v)=>setF(o=>({...o,[k]:v}));
  async function salva(){
    const n=parseFloat(String(f.impegno).replace(',','.')), pi=parseFloat(String(f.prossimoImporto).replace(',','.'));
    const cc=parseFloat(String(f.costoCarico).replace(/\./g,'').replace(',','.'));
    const q=parseFloat(String(f.quote).replace(',','.'));
    if(!(f.nome||'').trim()){ toast('Scrivi il nome del prodotto (es. Azimut PAC Bilanciato)','error'); return; }
    const dati={isin:(f.isin||'').trim().toUpperCase()||null, quote:isNaN(q)?null:q, dataQuote:isNaN(q)?null:(f.dataQuote||todayISO()), codiceBI:(f.codiceBI||'').trim()||null, costoCarico:isNaN(cc)?null:cc, dataCosto:isNaN(cc)?null:(f.dataCosto||todayISO()), gruppo:(f.gruppo||'').trim()||'Altri',nome:(f.nome||'').trim()||'Investimento',tipo:f.tipo,conto:parseInt(f.conto)||null,chiave:(f.chiave||'').trim(),
      impegno:isNaN(n)?null:n, prossimoData:f.prossimoData||null, prossimoImporto:isNaN(pi)?null:pi, note:f.note||''};
    if(x.nuovo){
      await db.ref('investimenti/posizioni/p'+Date.now().toString(36)).set({...dati, ordine:x.ordine, creato:todayISO()});
      toast('Prodotto aggiunto','success'); onClose(); return;
    }
    await ref.update(dati);
    toast('Investimento salvato','success');
  }
  async function nuovoConto(){
    const nome=(window.prompt('Nome del nuovo conto titoli (es. TITOLI DIRECTA, FONDO PENSIONE):','TITOLI ')||'').trim().toUpperCase();
    if(!nome) return;
    if(CONTI.some(c=>String(c.nome).toUpperCase()===nome)){ toast('Esiste già un conto con questo nome','error'); return; }
    const codice=CONTI.reduce((m,c)=>Math.max(m,c.codice||0),0)+1;
    const nuovo={codice,nome,categoria:'IMM. FINANZIARIE',eccedenza:'DARE',prospetto:'SP'};
    await db.ref('conti').set([...CONTI.map(c=>({...c})),nuovo].sort((a,b)=>a.codice-b.codice));
    set('conto',String(codice)); toast(`Conto ${codice} · ${nome} creato nel piano dei conti`,'success');
  }
  async function aggiungiValore(){
    const v=parseFloat(String(nv.valore).replace(/\./g,'').replace(',','.'));
    if(!nv.data||isNaN(v)){ toast('Inserisci data e valore','error'); return; }
    await ref.child('valori/v'+Date.now().toString(36)).set({data:nv.data,valore:v});
    setNv({data:todayISO(),valore:''}); toast('Valore registrato','success');
  }
  async function togliValore(vid){ await ref.child('valori/'+vid).remove(); }
  async function elimina(){
    if(!window.confirm(`Eliminare "${x.nome}"? I movimenti in contabilità restano, cambia solo la vista degli investimenti.`)) return;
    await ref.remove(); onClose();
  }
  const lbl={display:'block',fontSize:12,fontWeight:600,color:'var(--ink-2)',marginBottom:4};
  return (
    <div className="modal-bg" onClick={e=>{if(e.target.className==='modal-bg')onClose();}}>
      <div className="modal" style={{maxWidth:640}}>
        <div className="modal-head"><h3>{x.nuovo?'Aggiungi prodotto':x.nome}</h3><button className="btn ghost sm" onClick={onClose}>✕</button></div>
        <div className="modal-body" style={{paddingTop:0}}>
          <div style={{display:'flex',gap:14,flexWrap:'wrap',fontSize:13,margin:'4px 0 14px'}}>
            <span>Versato <b>{eur(x.versato)}</b></span>
            <span>Valore <b>{eur(x.valore)}</b></span>
            {x.pl!=null && <span>Plus/minus <b className={x.pl<0?'neg':'pos'}>{x.pl>0?'+':''}{num2(x.pl)} €</b></span>}
            {x.ultimoPrezzo && <span>Prezzo quota <b>{String(x.ultimoPrezzo.prezzo).replace('.',',')} €</b> al {fmtDate(x.ultimoPrezzo.data)}</span>}
          </div>

          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:10}}>
            <div><label style={lbl}>Nome</label><input type="text" value={f.nome} onChange={e=>set('nome',e.target.value)}/></div>
            <div><label style={lbl} title="La sezione in cui compare: di solito il provider (BPER, Azimut…)">Gruppo / provider</label>
              <select value={f.gruppo} onChange={e=>{
                  if(e.target.value==='__nuovo'){ const g=(window.prompt('Nome del nuovo gruppo (es. Directa, Fineco, Fondo pensione):','')||'').trim(); if(g) set('gruppo',g); }
                  else set('gruppo',e.target.value); }}>
                <option value="">— scegli —</option>
                {[...new Set([...INV_GRUPPI,...(gruppiEsistenti||[]),...(f.gruppo?[f.gruppo]:[])])].map(g=><option key={g} value={g}>{g}</option>)}
                <option value="__nuovo">+ Nuovo gruppo…</option>
              </select></div>
            <div><label style={lbl}>Tipo</label><select value={f.tipo} onChange={e=>set('tipo',e.target.value)}>{INV_TIPI.map(t=><option key={t}>{t}</option>)}</select></div>
            <div><label style={lbl} title="Il conto titoli del libro giornale da cui leggere i versamenti">Conto in contabilità</label>
              <select value={f.conto} onChange={e=>{ if(e.target.value==='__nuovo') nuovoConto(); else set('conto',e.target.value); }}>
                <option value="">— nessuno: versato e valori a mano —</option>
                {contiFin.map(c=><option key={c.codice} value={c.codice}>{c.codice} · {c.nome}</option>)}
                <option value="__nuovo">+ Nuovo conto titoli…</option>
              </select></div>
            <div><label style={lbl} title="Parole nella descrizione delle scritture, separate da |. Vuoto = prende tutto il resto del conto">Parola chiave</label>
              <input type="text" value={f.chiave} onChange={e=>set('chiave',e.target.value)} placeholder="es. ARCA TE (vuoto = resto del conto)"/></div>
            <div><label style={lbl} title="Dall'estratto titoli: sostituisce lo storico della contabilità fino alla data indicata; i versamenti successivi si aggiungono">Costo di carico € (da estratto)</label>
              <input type="text" inputMode="decimal" value={f.costoCarico} onChange={e=>set('costoCarico',e.target.value)} placeholder="vuoto = dalla contabilità"/></div>
            <div><label style={lbl}>Costo di carico · alla data</label><input type="date" value={f.dataCosto} onChange={e=>set('dataCosto',e.target.value)}/></div>
            <div><label style={lbl}>ISIN</label><input type="text" value={f.isin} onChange={e=>set('isin',e.target.value)} placeholder="IT000…"/></div>
            <div><label style={lbl} title="Numero di quote possedute: con il prezzo di Borsa Italiana l'app calcola il valore da sola">Quote possedute</label><input type="text" inputMode="decimal" value={f.quote} onChange={e=>set('quote',e.target.value)} placeholder="es. 355,392"/></div>
            <div><label style={lbl}>Quote · alla data</label><input type="date" value={f.dataQuote} onChange={e=>set('dataQuote',e.target.value)}/></div>
            <div><label style={lbl} title="Il codice nell'indirizzo della pagina del fondo su borsaitaliana.it, es. 1ATE per …/dettaglio/1ATE.html">Codice Borsa Italiana</label><input type="text" value={f.codiceBI} onChange={e=>set('codiceBI',e.target.value)} placeholder="es. 1ATE"/></div>
            {f.tipo==='Private equity' && <>
              <div><label style={lbl}>Impegno totale €</label><input type="text" inputMode="decimal" value={f.impegno} onChange={e=>set('impegno',e.target.value)} placeholder="0,00"/></div>
              <div><label style={lbl}>Prossimo richiamo · data</label><input type="date" value={f.prossimoData} onChange={e=>set('prossimoData',e.target.value)}/></div>
              <div><label style={lbl}>Prossimo richiamo · importo €</label><input type="text" inputMode="decimal" value={f.prossimoImporto} onChange={e=>set('prossimoImporto',e.target.value)} placeholder="0,00"/></div>
            </>}
          </div>
          <div style={{marginTop:10}}><label style={lbl}>Note</label><input type="text" value={f.note} onChange={e=>set('note',e.target.value)} placeholder="ISIN, piattaforma, scadenze…"/></div>
          <div style={{display:'flex',gap:8,marginTop:12}}>
            <button className="btn accent" onClick={salva}>Salva</button>
            <div style={{flex:1}}></div>
            {!x.nuovo && <button className="btn danger sm" onClick={elimina}>Elimina</button>}
          </div>

          {x.nuovo ? <div style={{fontSize:12.5,color:'var(--ink-3)',marginTop:16}}>Dopo il salvataggio potrai inserire i valori di mercato e vedere grafico e movimenti.</div> : <>
          {x.serie && x.serie.length>1 && <>
            <div className="card-title" style={{marginTop:20}}>Andamento</div>
            <InvChart config={invLineConfig(x.serie,true)} height={200}/>
          </>}
          <div className="card-title" style={{marginTop:20}}>Valore di mercato</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end',marginBottom:8}}>
            <div><label style={lbl}>Data</label><input type="date" value={nv.data} onChange={e=>setNv(o=>({...o,data:e.target.value}))}/></div>
            <div><label style={lbl}>Valore €</label><input type="text" inputMode="decimal" value={nv.valore} onChange={e=>setNv(o=>({...o,valore:e.target.value}))} placeholder="0,00" onKeyDown={e=>{if(e.key==='Enter')aggiungiValore();}}/></div>
            <button className="btn ghost" onClick={aggiungiValore}>+ Aggiungi</button>
          </div>
          <div className="tbl-wrap"><table className="tbl">
            <thead><tr><th>Data</th><th className="num">Valore</th><th className="num">vs versato</th><th></th></tr></thead>
            <tbody>
              {x.vals.length===0 && <tr><td colSpan="4" className="empty-state">Nessun valore: finché non lo inserisci si usa il versato</td></tr>}
              {[...x.vals].reverse().map(v=>(
                <tr key={v.vid}><td>{fmtDate(v.data)}</td><td className="num">{num2(v.valore)}</td>
                  <td className={'num '+((v.valore-x.versato)<0?'neg':'pos')}>{num2(r2(v.valore-x.versato))}</td>
                  <td style={{textAlign:'right'}}><button className="btn ghost sm" onClick={()=>togliValore(v.vid)}>✕</button></td></tr>
              ))}
            </tbody>
          </table></div>

          <div className="card-title" style={{marginTop:20}}>Movimenti in contabilità</div>
          <div className="tbl-wrap"><table className="tbl">
            <thead><tr><th>Data</th><th>Descrizione</th><th className="num">Importo</th></tr></thead>
            <tbody>
              {x.mov.length===0 && <tr><td colSpan="3" className="empty-state">Nessun movimento collegato</td></tr>}
              {x.mov.map((m,i)=>(<tr key={i} style={m.inCosto?{color:'var(--ink-3)'}:null}><td style={{whiteSpace:'nowrap'}}>{fmtDate(m.data)}</td><td>{m.descr}{m.inCosto && <span style={{fontSize:11,marginLeft:6}}>(già nel costo di carico)</span>}</td><td className={'num '+(m.imp<0?'neg':'')}>{num2(m.imp)}</td></tr>))}
            </tbody>
          </table></div>
          </>}
        </div>
      </div>
    </div>
  );
}

function seedScrittureObj(){
  const obj={}; SEED.scritture.forEach((s,i)=>{ obj['seed'+i]={data:s.data,descr:s.descr,righe:s.righe.map(r=>({...r})),origine:'seed',tipo:s.liq?'liquidita':'contabile'}; }); return obj;
}
function seedCespitiObj(){
  const obj={}; CESPITI_SEED.forEach((c,i)=>{ obj['c'+i]={...c}; delete obj['c'+i].id; }); return obj;
}

function App({authUser, onLogout}){
  const [scritture,setScritture]=useState([]);
  const [cespiti,setCespiti]=useState([]);
  const [conti,setContiState]=useState(CONTI);
  const [saldiIni,setSaldiIniState]=useState(()=>({...SALDI_INIZIALI}));
  const [mappa,setMappaState]=useState({});
  const [categorie,setCategorieState]=useState(()=>{ const c=seedCategorie(); setCatNames(c); return c; });
  const [budget,setBudgetState]=useState({});
  const [budgets,setBudgetsState]=useState({});
  const [ready,setReady]=useState(false);
  const [page,setPage]=useState('dashboard');
  const [menuOpen,setMenuOpen]=useState(false);
  const [toast,setToastState]=useState({msg:'',kind:''});
  const toastTimer=useRef(null);
  const showToast=(msg,kind)=>{ setToastState({msg,kind}); clearTimeout(toastTimer.current); toastTimer.current=setTimeout(()=>setToastState({msg:'',kind:''}),kind==='error'?8000:2600); };
  // errori di scrittura su Firebase: prima venivano ignorati in silenzio
  const fbErr = e => { console.error('Firebase',e); showToast('⚠ Salvataggio NON riuscito: '+((e&&(e.code||e.message))||e),'error'); };
  const fbOnline = useRef(true);
  useEffect(()=>{ if(!firebaseReady) return; const r=db.ref('.info/connected'); const h=r.on('value',s=>{ fbOnline.current=!!s.val(); }); return ()=>r.off('value',h); },[]);


  // ---- caricamento iniziale (Firebase o locale) ----
  useEffect(()=>{
    if(firebaseReady){
      const sref=db.ref('scritture');
      sref.on('value',snap=>{
        const val=snap.val();
        if(val==null){ sref.set(seedScrittureObj()); return; }
        setScritture(Object.entries(val).map(([id,v])=>({id,...v,righe:v.righe||[]})));
        setReady(true);
      });
      const cref=db.ref('cespiti');
      cref.on('value',snap=>{
        const val=snap.val();
        if(val==null){ cref.set(seedCespitiObj()); return; }
        setCespiti(Object.entries(val).map(([id,v])=>({id,...v})));
      });
      const ctref=db.ref('conti');
      ctref.on('value',snap=>{ const v=snap.val(); if(v==null){ ctref.set(CONTI); return; } const arr=(Array.isArray(v)?v.filter(Boolean):Object.values(v)); applyConti(arr); setContiState(arr); });
      const siref=db.ref('saldiIniziali');
      siref.on('value',snap=>{ const v=snap.val(); if(v==null){ siref.set(saldiIniToFB(SALDI_INIZIALI)); return; } applySaldiIni(v); setSaldiIniState({...SALDI_INIZIALI}); });
      db.ref('mappaCategorie').on('value',snap=>{ const m=mappaFromFB(snap.val()); setMappaCat(m); setMappaState(m); });
      const catref=db.ref('categorieRF');
      catref.on('value',snap=>{ const v=snap.val(); if(v==null){ catref.set(seedCategorie()); return; } const arr=Array.isArray(v)?v.filter(Boolean):Object.values(v); setCatNames(arr); setCategorieState(arr); });
      db.ref('budget').on('value',snap=>setBudgetState(snap.val()||{}));
      db.ref('budgets').on('value',snap=>setBudgetsState(snap.val()||{}));
    } else {
      setScritture(loadScritture()); setCespiti(loadCespiti()); setReady(true);
      try{ const m=JSON.parse(localStorage.getItem('contabilita_mappa_v1')||'{}'); setMappaCat(m); setMappaState(m); }catch(e){}
      try{ const c=JSON.parse(localStorage.getItem('contabilita_cat_v1')||'null'); if(c){ setCatNames(c); setCategorieState(c); } }catch(e){}
      try{ setBudgetState(JSON.parse(localStorage.getItem('contabilita_budget_v1')||'{}')); }catch(e){}
      try{ setBudgetsState(JSON.parse(localStorage.getItem('contabilita_budgets_v1')||'{}')); }catch(e){}
    }
  },[]);

  const saldi = useMemo(()=>calcSaldi(scritture),[scritture]);

  const addScrittura = s => {
    if(firebaseReady){ const {id,...rest}=s; db.ref('scritture/'+id).set(rest).catch(fbErr); }
    else setScritture(arr=>{ const n=[...arr,s]; saveScritture(n); return n; });
  };
  const updateScrittura = (id,patch) => {
    if(firebaseReady){
      const cur=scritture.find(s=>s.id===id)||{};
      const {id:_,...rest}={...cur,...patch};
      db.ref('scritture/'+id).set(rest).catch(fbErr);
    } else setScritture(arr=>{ const n=arr.map(s=>s.id===id?{...s,...patch}:s); saveScritture(n); return n; });
  };
  const deleteScrittura = id => {
    if(firebaseReady){ db.ref('scritture/'+id).remove().catch(fbErr); }
    else setScritture(arr=>{ const n=arr.filter(s=>s.id!==id); saveScritture(n); return n; });
  };
  const deleteScritture = ids => {
    if(!ids||!ids.length) return;
    const set=new Set(ids);
    if(firebaseReady){ const up={}; ids.forEach(id=>{ up['scritture/'+id]=null; }); db.ref().update(up).catch(fbErr); }
    else setScritture(arr=>{ const n=arr.filter(s=>!set.has(s.id)); saveScritture(n); return n; });
  };
  const updateScritture = updates => {
    if(!updates||!updates.length) return;
    if(firebaseReady){
      const up={};
      updates.forEach(({id,patch})=>{ const cur=scritture.find(s=>s.id===id)||{}; const {id:_,...rest}={...cur,...patch}; up['scritture/'+id]=rest; });
      db.ref().update(up);
    } else setScritture(arr=>{
      const m=new Map(updates.map(u=>[u.id,u.patch]));
      const n=arr.map(s=>m.has(s.id)?{...s,...m.get(s.id)}:s); saveScritture(n); return n;
    });
  };
  const addScritture = list => {
    if(!list||!list.length) return;
    if(firebaseReady){
      const up={}; list.forEach(s=>{ const {id,...rest}=s; up['scritture/'+id]=rest; });
      if(!fbOnline.current) showToast('⚠ Sei offline: le scritture saranno salvate solo quando torni online (non chiudere l\'app)','error');
      try{ db.ref().update(up).then(()=>{ if(!fbOnline.current) return; }).catch(fbErr); }catch(e){ fbErr(e); }
    }
    else setScritture(arr=>{ const n=[...arr,...list]; saveScritture(n); return n; });
  };
  const setMappa = m => {
    setMappaCat(m);
    setMappaState(m);
    if(firebaseReady){ db.ref('mappaCategorie').set(mappaToFB(m)).catch(fbErr); }
    else { try{ localStorage.setItem('contabilita_mappa_v1', JSON.stringify(m)); }catch(e){} }
  };
  const setConti = list => {
    applyConti(list);
    setContiState(list);
    if(firebaseReady){ db.ref('conti').set(list); }
    else { saveContiLS(list); }
  };
  const setSaldiIni = obj => {
    const clean=normSaldiIni(obj);
    applySaldiIni(clean);
    setSaldiIniState(clean);
    if(firebaseReady){ db.ref('saldiIniziali').set(saldiIniToFB(clean)); }
    else { saveSaldiIniLS(clean); }
  };
  const setCategorie = list => {
    setCatNames(list);
    setCategorieState(list);
    if(firebaseReady){ db.ref('categorieRF').set(list); }
    else { try{ localStorage.setItem('contabilita_cat_v1', JSON.stringify(list)); }catch(e){} }
  };
  const setBudgets = obj => {
    setBudgetsState(obj);
    if(firebaseReady){ db.ref('budgets').set(obj); }
    else { try{ localStorage.setItem('contabilita_budgets_v1',JSON.stringify(obj)); }catch(e){} }
  };
  const setBudget = obj => {
    setBudgetState(obj);
    if(firebaseReady){ db.ref('budget').set(obj); }
    else { try{ localStorage.setItem('contabilita_budget_v1', JSON.stringify(obj)); }catch(e){} }
  };
  const updateCespiti = arr => {
    if(firebaseReady){ const obj={}; arr.forEach(c=>{ const {id,...rest}=c; obj[id]=rest; }); db.ref('cespiti').set(obj); }
    else { setCespiti(arr); saveCespiti(arr); }
  };

  function resetSeed(){
    if(window.confirm('Ripristinare i dati originali dal libro giornale? Le scritture e i cespiti aggiunti verranno persi.')){
      if(firebaseReady){ db.ref('scritture').set(seedScrittureObj()); db.ref('cespiti').set(seedCespitiObj()); }
      else { try{ localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_CES); }catch(e){} setScritture(loadScritture()); setCespiti(loadCespiti()); }
      showToast('Dati ripristinati','success');
    }
  }

  const nav=id=>{setPage(id);setMenuOpen(false);};
  // telefono: a ogni cambio pagina si riparte dall'alto
  useEffect(()=>{ try{ window.scrollTo(0,0); }catch(e){} },[page]);
  // tabelle scorrevoli: sfumano il bordo quando c'è altro contenuto a destra/sinistra
  useEffect(()=>{
    const upd=()=>{ document.querySelectorAll('.tbl-wrap, .an-tbl-wrap').forEach(el=>{
      const max=el.scrollWidth-el.clientWidth; let v='';
      if(max>2){ const l=el.scrollLeft>2, r=el.scrollLeft<max-2; v=l&&r?'lr':(l?'l':(r?'r':'')); }
      if((el.dataset.more||'')!==v){ if(v) el.dataset.more=v; else delete el.dataset.more; }
    }); };
    let t=null; const sched=()=>{ if(t) return; t=requestAnimationFrame(()=>{ t=null; upd(); }); };
    const mo=new MutationObserver(sched); mo.observe(document.body,{childList:true,subtree:true});
    document.addEventListener('scroll',sched,true); window.addEventListener('resize',sched); sched();
    return ()=>{ mo.disconnect(); document.removeEventListener('scroll',sched,true); window.removeEventListener('resize',sched); if(t) cancelAnimationFrame(t); };
  },[]);
  const BOTTOM=[{id:'dashboard',ico:'◫',label:'Home'},{id:'giornale',ico:'≣',label:'Giornale'},{id:'nuova',ico:'+',label:'Nuova',plus:true},{id:'analisi',ico:'◧',label:'Analisi'}];

  if(!ready) return (
    <div className="login-shell"><div className="login-card" style={{textAlign:'center'}}>
      <div className="logo serif">Contabilità Personale</div>
      <div className="tag">{firebaseReady?'Connessione a Firebase…':'Avvio…'}</div>
    </div></div>
  );

  return (
    <div className="app">
      <div className="topbar">
        <button className="menu-btn" onClick={()=>setMenuOpen(o=>!o)}>☰</button>
        <h1 className="serif">Contabilità Personale<span className="sub">partita doppia</span></h1>
        <span className="badge desktop-only" style={firebaseReady?{borderColor:'#2a4d86',color:'#9fc0ee'}:{}}>{firebaseReady?'● Firebase':'● Locale'}</span>
        <span className="badge desktop-only">{scritture.length} scritture</span>
        <button className="icon-btn hide-m" onClick={resetSeed}>↺ Reset</button>
        {onLogout && <button className="icon-btn" onClick={onLogout} title={authUser?authUser.email:''}>⎋ Esci</button>}
      </div>
      <div className="layout">
        <div className={'sidebar'+(menuOpen?' open':'')}>
          {NAV.map(g=>(
            <React.Fragment key={g.sec}>
              <div className="section-label">{g.sec}</div>
              {g.items.map(it=>(
                <button key={it.id} className={'navlink'+(page===it.id?' active':'')} onClick={()=>nav(it.id)}>
                  <span className="ico">{it.ico}</span>{it.label}
                </button>
              ))}
            </React.Fragment>
          ))}
          <div className="sidebar-tools">
            <div className="info">{firebaseReady?'● Firebase':'● Locale'} · {scritture.length} scritture</div>
            <button className="btn danger sm" onClick={()=>{setMenuOpen(false);resetSeed();}}>↺ Reset dati</button>
          </div>
        </div>
        <div className="sidebar-backdrop" onClick={()=>setMenuOpen(false)}></div>
        <div className="main">
          {page==='dashboard' && <PageDashboard scritture={scritture} saldi={saldi} goto={nav}/>}
          {page==='snapshot' && <PageSnapshot scritture={scritture}/>}
          {page==='chiusura' && <PageChiusura scritture={scritture} categorie={categorie} toast={showToast}/>}
          {page==='nuova' && <PageNuova onAdd={addScrittura} toast={showToast} categorie={categorie}/>}
          {page==='variazioni' && <PageVariazioni onAddMany={addScritture} scritture={scritture} saldi={saldi} categorie={categorie} toast={showToast}/>}
          {page==='import' && <PageImport onAddMany={addScritture} mappa={mappa} setMappa={setMappa} categorie={categorie} setCategorie={setCategorie} toast={showToast} scritture={scritture} onDeleteMany={deleteScritture}/>}
          {page==='giornale' && <PageLibroGiornale scritture={scritture} onUpdate={updateScrittura} onDelete={deleteScrittura} onDeleteMany={deleteScritture} updateScritture={updateScritture} toast={showToast} categorie={categorie}/>}
          {page==='movimenti' && <PageMovimenti scritture={scritture} saldi={saldi}/>}
          {page==='analisi' && <PageAnalisi scritture={scritture} cespiti={cespiti} budgets={budgets} categorie={categorie} toast={showToast}/>}
          {page==='bilancio' && <PageBilancio saldi={saldi}/>}
          {page==='schema' && <PageSchemaBilancio scritture={scritture} conti={conti} categorie={categorie} toast={showToast}/>}
          {page==='rendiconto' && <PageRendiconto scritture={scritture} categorie={categorie} updateScritture={updateScritture} toast={showToast}/>}
          {page==='controller' && <PageController scritture={scritture} categorie={categorie} budget={budget} setBudget={setBudget}/>}
          {page==='investimenti' && <PageInvestimenti scritture={scritture} authUser={authUser} toast={showToast}/>}
          {page==='budget' && <PageBudget scritture={scritture} budgets={budgets} setBudgets={setBudgets} toast={showToast}/>}
          {page==='liquidita' && <PageLiquidita saldi={saldi} scritture={scritture} conti={conti} setConti={setConti} saldiIni={saldiIni} setSaldiIni={setSaldiIni} toast={showToast}/>}
          {page==='pianoconti' && <PagePianoConti saldi={saldi} conti={conti} setConti={setConti} toast={showToast}/>}
          {page==='cespiti' && <PageCespiti cespiti={cespiti} setCespiti={updateCespiti} toast={showToast}/>}
          {page==='ammortamenti' && <PageAmmortamenti cespiti={cespiti} onAdd={addScrittura} updateCespiti={updateCespiti} toast={showToast}/>}
          {page==='categorie' && <PageCategorie categorie={categorie} setCategorie={setCategorie} scritture={scritture} updateScritture={updateScritture} mappa={mappa} setMappa={setMappa} toast={showToast}/>}
          {page==='export' && <PageExport scritture={scritture} cespiti={cespiti} saldi={saldi} categorie={categorie} toast={showToast}/>}
        </div>
      </div>
      <nav className="bottom-nav">
        {BOTTOM.map(b=>(
          <button key={b.id} className={(b.plus?'plus ':'')+(page===b.id&&!menuOpen?'on':'')} onClick={()=>nav(b.id)}>
            <span className="bi">{b.ico}</span>{b.label}
          </button>
        ))}
        <button className={menuOpen||!BOTTOM.some(b=>b.id===page)?'on':''} onClick={()=>setMenuOpen(o=>!o)}>
          <span className="bi">☰</span>{menuOpen?'Chiudi':(BOTTOM.some(b=>b.id===page)?'Menu':((NAV.flatMap(g=>g.items).find(i=>i.id===page)||{}).label||'Menu').split(' ')[0])}
        </button>
      </nav>
      <Toast msg={toast.msg} kind={toast.kind}/>
    </div>
  );
}

/* ============================================================
   LOGIN
   ============================================================ */
function Splash({text}){
  return (<div className="login-shell"><div className="login-card" style={{textAlign:'center'}}>
    <div className="logo serif">Contabilità Personale</div><div className="tag">{text}</div>
  </div></div>);
}

/* login con Firebase Authentication (email + password) */
function LoginAuth(){
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  const [info,setInfo]=useState('');
  function submit(){
    setErr(''); setInfo(''); setBusy(true);
    auth.signInWithEmailAndPassword(email.trim(),pw)
      .catch(e=>{
        const m={'auth/invalid-email':'Email non valida','auth/user-not-found':'Utente inesistente',
          'auth/wrong-password':'Password errata','auth/invalid-credential':'Credenziali errate',
          'auth/too-many-requests':'Troppi tentativi, riprova più tardi'};
        setErr(m[e.code]||'Accesso non riuscito');
      })
      .finally(()=>setBusy(false));
  }
  function reset(){
    if(!email.trim()){ setErr('Inserisci la tua email per il reset'); return; }
    auth.sendPasswordResetEmail(email.trim())
      .then(()=>setInfo('Email di reset inviata'))
      .catch(()=>setErr('Impossibile inviare il reset'));
  }
  return (
    <div className="login-shell">
      <div className="login-card">
        <div className="logo serif">Contabilità Personale</div>
        <div className="tag">Accedi con le tue credenziali</div>
        {err && <div className="err">{err}</div>}
        {info && <div className="err" style={{background:'var(--accent-soft)',color:'var(--accent-ink)'}}>{info}</div>}
        <div className="field"><label>Email</label>
          <input type="email" value={email} autoFocus onChange={e=>{setEmail(e.target.value);setErr('');}} onKeyDown={e=>{if(e.key==='Enter')submit();}}/></div>
        <div className="field"><label>Password</label>
          <input type="password" value={pw} onChange={e=>{setPw(e.target.value);setErr('');}} onKeyDown={e=>{if(e.key==='Enter')submit();}}/></div>
        <button className="btn accent" onClick={submit} disabled={busy}>{busy?'Accesso…':'Accedi'}</button>
        <button className="btn ghost sm" onClick={reset} style={{marginTop:8}}>Password dimenticata?</button>
      </div>
    </div>
  );
}

/* login semplice (solo password) — fallback senza Firebase */
function Login({onOk}){
  const [pw,setPw]=useState('');
  const [err,setErr]=useState('');
  function submit(){
    if(pw===APP_PASSWORD){ try{ sessionStorage.setItem('cp_unlocked','1'); }catch(e){} onOk(); }
    else setErr('Password errata');
  }
  return (
    <div className="login-shell"><div className="login-card">
      <div className="logo serif">Contabilità Personale</div>
      <div className="tag">Inserisci la password per accedere</div>
      {err && <div className="err">{err}</div>}
      <div className="field"><label>Password</label>
        <input type="password" value={pw} autoFocus onChange={e=>{setPw(e.target.value);setErr('');}} onKeyDown={e=>{if(e.key==='Enter')submit();}}/></div>
      <button className="btn accent" onClick={submit}>Accedi</button>
    </div></div>
  );
}

function Root(){
  const [user,setUser]=useState(undefined);
  const [pwUnlocked,setPwUnlocked]=useState(()=>{ try{ return sessionStorage.getItem('cp_unlocked')==='1'; }catch(e){ return false; } });
  useEffect(()=>{
    if(firebaseReady && auth){ const unsub=auth.onAuthStateChanged(u=>setUser(u||null)); return unsub; }
    setUser(null);
  },[]);
  if(firebaseReady && auth){
    if(user===undefined) return <Splash text="Caricamento…"/>;
    if(!user) return <LoginAuth/>;
    return <App authUser={user} onLogout={()=>auth.signOut()}/>;
  }
  // fallback senza Firebase Auth: password locale
  if(!pwUnlocked) return <Login onOk={()=>setPwUnlocked(true)}/>;
  return <App/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);

</script>
