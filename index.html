// Garantisce che uno schema caricato da Firebase abbia tutte le sezioni.
// Migra anche il vecchio formato del rendiconto (categorie assegnate direttamente
// all'area, senza sottovoci) verso il nuovo formato area -> voci -> categorie.
function normalizzaSchema(s) {
  const d = schemaDefault();
  const out = { sp: s.sp || d.sp, ce: s.ce || d.ce, rf: s.rf || d.rf };
  out.rf.aree = (out.rf.aree || d.rf.aree).map(a => {
    if (a.voci) return { ...a, voci: (a.voci || []).map(v => ({ ...v, categorie: v.categorie || [] })) };
    // "Categorie" era un nome segnaposto della vecchia migrazione: nel PDF
    // usciva come "1. Categorie", che non dice nulla. Meglio un nome parlante.
    const voci = (a.categorie && a.categorie.length)
      ? [{ id: uid(), codice: "", nome: "Altri flussi non classificati", categorie: a.categorie }]
      : [];
    return { id: a.id, codice: a.codice, nome: a.nome, voci };
  });
  out.rf.natura = out.rf.natura || {};
  return out;
}

// Natura di default di un conto, dedotta dalla categoria del piano dei conti.
function naturaAuto(conto) {
  const cat = ((conto && conto.categoria) || "").toUpperCase();
  if (cat === "DISP. LIQUIDE") return "liquidita";
  if (/^IMM\./.test(cat)) return "immobilizzazioni";
  if (cat === "RETTIFICA ATTIVO") return "fondo";
  if (cat === "PN" || cat === "PATRIMONIO NETTO") return "patrimonio";
  if (cat === "CREDITI" || cat === "DEBITI" || cat === "CONTO TRANSITORIO") return "circolante";
  if (cat === "RICAVI" || cat === "COSTI" || cat === "COSTI/RICAVI" || cat === "RICAVI/COSTI") return "economico";
  return "circolante";
}

// Regole di coerenza fra categoria di cassa e sottovoce del rendiconto.
// Usate sia dagli avvisi (che le segnalano) sia dalla correzione automatica
// (che le applica): una sola fonte, cosi' non possono divergere.
// auto:false = la regola segnala ma non sposta niente da sola. E' il caso degli
// sponsor: "SPONSORIZZAZIONI SOCIAL" e' un costo, e una regola cieca sul nome
// lo sposterebbe dentro gli incassi. Quel caso lo decide una persona.
const REGOLE_CAT_RF = [
  { cat: /COMMERCIALIST/, voce: /commercialist|servizi|fornitor|altri pagament/i, attesa: 'una voce di pagamenti a fornitori/servizi', auto: true },
  { cat: /RITENUT/,       voce: /impost|ritenut/i,             attesa: '"Imposte/ritenute pagate"',   auto: true },
  { cat: /DIVIDEND/,      voce: /dividend|mezzi propri/i,      attesa: '"Mezzi propri - Dividendi"',  auto: true },
  { cat: /SPONSOR/,       voce: /sponsor/i,                    attesa: '"Incassi da sponsor"',        auto: false },
];

// Rinumera 1..n le sottovoci di ogni area del rendiconto. Senza questo, una
// voce aggiunta a mano resta senza codice e nel PDF esce senza numero
// in mezzo a voci numerate (era il caso di "Incassi da sponsor").
function rinumeraVociRF(s) {
  (s.rf?.aree || []).forEach(a => {
    (a.voci || []).forEach((v, i) => { v.codice = String(i + 1); });
  });
  return s;
}

// Calcola le correzioni di classificazione applicabili allo schema.
// Funzione pura: restituisce lo schema corretto e l'elenco di cosa cambia,
// senza scrivere nulla. Serve sia al pulsante (che applica) sia alla UI
// (che deve sapere in anticipo se c'e' qualcosa da correggere).
function calcolaCorrezioniSchema(schema, contiMap) {
  if (!schema) return { schema: null, azioni: [] };
  const s = JSON.parse(JSON.stringify(schema));
  const azioni = [];
  const nomeConto = (c) => (contiMap?.[Number(c)]?.nome || `Conto ${c}`).trim();


  // 1) Conto economico: le ritenute escono dalla voce delle imposte.
  const trovaVoceCE = (re) => {
    for (const cl of (s.ce || [])) {
      const v = (cl.voci || []).find(x => re.test(x.nome || ""));
      if (v) return v;
    }
    return null;
  };
  const destServizi = trovaVoceCE(/per servizi/i) || trovaVoceCE(/oneri diversi/i);
  (s.ce || []).forEach(cl => {
    if (!/impost/i.test(cl.nome || "")) return;
    (cl.voci || []).forEach(v => {
      if (v === destServizi) return;
      // stesso trattamento per i conti agganciati alla voce e per quelli
      // dentro le sue sotto-voci
      const estrai = (contenitore, etichetta) => {
        const restano = [];
        (contenitore.conti || []).forEach(x => {
          if (/RITENUT/.test(nomeConto(x.c).toUpperCase()) && destServizi) {
            destServizi.conti = destServizi.conti || [];
            if (!destServizi.conti.some(y => Number(y.c) === Number(x.c))) destServizi.conti.push(x);
            azioni.push(`CE · conto ${x.c} ${nomeConto(x.c)}: da "${etichetta}" a "${destServizi.nome}"`);
          } else restano.push(x);
        });
        contenitore.conti = restano;
      };
      estrai(v, v.nome);
      (v.sottovoci || []).forEach(sv => estrai(sv, `${v.nome} · ${sv.nome}`));
    });
  });

  // 2) Rendiconto: ogni categoria va sulla sottovoce che la descrive,
  //    cercando la destinazione nella stessa area (il flusso non cambia area).
  (s.rf?.aree || []).forEach(a => {
    (a.voci || []).forEach(v => {
      const restano = [];
      (v.categorie || []).forEach(c => {
        const r = REGOLE_CAT_RF.find(x => x.auto && x.cat.test(String(c).toUpperCase()) && !x.voce.test(v.nome || ""));
        const dest = r ? (a.voci || []).find(x => x !== v && r.voce.test(x.nome || "")) : null;
        if (dest) {
          dest.categorie = [...new Set([...(dest.categorie || []), c])].sort();
          azioni.push(`RF · categoria "${c}": da "${v.nome}" a "${dest.nome}"`);
        } else restano.push(c);
      });
      v.categorie = restano;
    });
  });

  // 3) Il segnaposto "Categorie": eliminato se ormai vuoto, altrimenti rinominato.
  (s.rf?.aree || []).forEach(a => {
    a.voci = (a.voci || []).filter(v => {
      if (!/^categorie$/i.test((v.nome || "").trim())) return true;
      if (!(v.categorie || []).length) {
        azioni.push(`RF · area ${a.codice || a.nome}: rimossa la sottovoce segnaposto "Categorie", ormai vuota`);
        return false;
      }
      azioni.push(`RF · area ${a.codice || a.nome}: "Categorie" rinominata "Altri flussi non classificati"`);
      v.nome = "Altri flussi non classificati";
      return true;
    });
  });

  // 4) Rinumerazione finale: nessuna voce resta senza numero nel PDF.
  const primaDeiNumeri = JSON.stringify((s.rf?.aree || []).map(a => (a.voci || []).map(v => v.codice)));
  rinumeraVociRF(s);
  if (JSON.stringify((s.rf?.aree || []).map(a => (a.voci || []).map(v => v.codice))) !== primaDeiNumeri) {
    azioni.push("RF · sottovoci rinumerate 1..n in ogni area");
  }
  return { schema: s, azioni };
}

// Proposta di mappatura automatica: assegna i conti alle voci in base
// alla categoria del piano dei conti. I fondi ammortamento vanno alla
// stessa voce del cespite che rettificano.
function proponiMappatura(schema, conti) {
  const s = JSON.parse(JSON.stringify(schema));
  const trova = (prosp, re) => {
    for (const cl of s[prosp]) {
      const v = (cl.voci || []).find(x => x.tipo !== "sottosezione" && !x.speciale && re.test(x.nome || ""));
      if (v) return v;
    }
    return null;
  };
  const gia = new Set();
  ["sp","ce"].forEach(p => s[p].forEach(c => (c.voci || []).forEach(v => {
    (v.conti || []).forEach(x => gia.add(Number(x.c)));
    (v.sottovoci || []).forEach(sv => (sv.conti || []).forEach(x => gia.add(Number(x.c))));
  })));
  const put = (voce, codice, segno) => {
    if (!voce || gia.has(Number(codice))) return;
    voce.conti = voce.conti || [];
    voce.conti.push({ c: Number(codice), s: segno });
    gia.add(Number(codice));
  };
  const mater    = trova("sp", /materiali|beni durevoli/i);
  const finanzSP = trova("sp", /finanziari/i);
  const crediti  = trova("sp", /^crediti/i);
  const liquide  = trova("sp", /liquid/i);
  const capitale = trova("sp", /capitale/i);
  const riserve  = trova("sp", /riserv/i);
  const aNuovo   = trova("sp", /a nuovo/i) || riserve;
  const debiti   = trova("sp", /^debiti/i);
  const transit  = trova("sp", /transitor|apertura/i);
  const lavoro   = trova("ce", /lavoro|redditi/i);
  const altriRic = trova("ce", /altri proventi|altri ricavi/i);
  const acquisti = trova("ce", /acquisti|materie/i);
  const servizi  = trova("ce", /servizi/i);
  const ammort   = trova("ce", /ammortament/i);
  const diverse  = trova("ce", /diverse|oneri diversi/i);
  const finanzCE = trova("ce", /finanziar/i);
  const straord  = trova("ce", /sopravven|straordinar/i);

  (conti || []).forEach(c => {
    const cod = Number(c.codice);
    const cat = (c.categoria || "").toUpperCase();
    const nome = (c.nome || "").toUpperCase();
    if (cat === "IMM. MATERIALI" || cat === "IMM. IMMATERIALI") put(mater, cod, 1);
    else if (cat === "IMM. FINANZIARIE") put(finanzSP || mater, cod, 1);
    // il fondo segue il bene che rettifica: segno naturale, avendo saldo AVERE si deduce da solo
    else if (cat === "RETTIFICA ATTIVO") put(mater, cod, 1);
    else if (cat === "CREDITI") put(crediti, cod, 1);
    else if (cat === "DISP. LIQUIDE") put(liquide, cod, 1);
    else if (cat === "DEBITI") put(debiti, cod, 1);
    else if (cat === "CONTO TRANSITORIO") put(transit || debiti, cod, 1);
    else if (cat === "PATRIMONIO NETTO" || cat === "PN") {
      if (nome.includes("CAPITALE")) put(capitale, cod, 1);
      else if (nome.includes("RISERV")) put(riserve, cod, 1);
      // utile/perdita riaperti dall'esercizio precedente e risultati a nuovo
      else put(aNuovo, cod, 1);
    }
    else if (cat === "RICAVI" || cat === "RICAVI/COSTI" || cat === "COSTI/RICAVI") {
      if (nome.includes("SOPRAVVENIEN") || nome.includes("RETTIFICH")) put(straord, cod, 1);
      else if (nome.includes("STIPEND") || nome.includes("RIPETIZIONI") || nome.includes("LAVORO")) put(lavoro || altriRic, cod, 1);
      else put(altriRic, cod, 1);
    }
    else if (cat === "COSTI") {
      if (nome.startsWith("AMMORTAMENTO") || nome.startsWith("SVALUTAZIONE")) put(ammort, cod, 1);
      else if (nome.includes("SOPRAVVENIEN")) put(straord, cod, 1);
      else if (nome.includes("INTERESS") || nome.includes("FINANZIAR")) put(finanzCE, cod, 1);
      else if (nome.includes("SPESE C/C") || nome.includes("COMMISSION") || nome.includes("BANCA")) put(servizi || diverse, cod, 1);
      else if (nome.includes("ACQUIST")) put(acquisti || diverse, cod, 1);
      else put(diverse, cod, 1);
    }
  });
  return s;
}

// Calcola i valori dei prospetti a partire dallo schema e dai mastrini.
// Convenzione: saldo = dare - avere.
//  - classi orientate DARE (attivo, costi)   -> valore = +saldo * segnoConto
//  - classi orientate AVERE (passivo, ricavi) -> valore = -saldo * segnoConto
function calcolaProspetti(schema, mastrini) {
  const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
  const saldi = {}, nomiConto = {};
  (mastrini || []).forEach(m => {
    saldi[Number(m.codice)] = m.saldo;
    nomiConto[Number(m.codice)] = (m.nome || "").trim();
  });

  const dettaglioDi = (voce, orient) => (voce.conti || []).map(x => ({
    c: Number(x.c), s: Number(x.s) || 1, nome: nomiConto[Number(x.c)] || `Conto ${x.c}`,
    valore: r2(((orient === "dare" ? 1 : -1) * (saldi[Number(x.c)] || 0)) * (Number(x.s) || 1)),
  }));
  // Terzo livello (art. 2424): una voce puo' articolarsi in sotto-voci con un
  // proprio subtotale — "II. Immobilizzazioni materiali" che si apre in
  // "1) Terreni e fabbricati", "2) Impianti e macchinario" e cosi' via.
  // Il totale della voce e' la somma dei conti agganciati direttamente piu'
  // quelli delle sue sotto-voci, quindi le classi e le quadrature non cambiano.
  const sottovociDi = (voce, orient) => (voce.sottovoci || []).map(sv => {
    const dettaglio = dettaglioDi(sv, orient);
    return { ...sv, dettaglio, valore: r2(dettaglio.reduce((s, d) => s + d.valore, 0)) };
  });
  const valoreVoce = (voce, orient) => r2(
    dettaglioDi(voce, orient).reduce((s, d) => s + d.valore, 0) +
    sottovociDi(voce, orient).reduce((s, sv) => s + sv.valore, 0)
  );

  const ce = (schema.ce || []).map(cl => {
    const orient = cl.segno >= 0 ? "avere" : "dare";
    const voci = (cl.voci || []).map(v => ({
      ...v, valore: valoreVoce(v, orient), dettaglio: dettaglioDi(v, orient),
      sottovoci: sottovociDi(v, orient),
    }));
    return { ...cl, voci, totale: r2(voci.reduce((s, v) => s + v.valore, 0)) };
  });
  const risultato = r2(ce.reduce((s, cl) => s + (cl.segno >= 0 ? cl.totale : -cl.totale), 0));

  const sp = (schema.sp || []).map(cl => {
    const orient = cl.lato === "attivo" ? "dare" : "avere";
    const voci = (cl.voci || []).map(v => ({
      ...v,
      valore: v.speciale === "risultato" ? risultato : valoreVoce(v, orient),
      dettaglio: v.speciale === "risultato" ? [] : dettaglioDi(v, orient),
      sottovoci: v.speciale === "risultato" ? [] : sottovociDi(v, orient),
    }));
    return { ...cl, voci, totale: r2(voci.reduce((s, v) => s + v.valore, 0)) };
  });
  const totAttivo  = r2(sp.filter(c => c.lato === "attivo").reduce((s, c) => s + c.totale, 0));
  const totPassivo = r2(sp.filter(c => c.lato === "passivo").reduce((s, c) => s + c.totale, 0));

  return { sp, ce, risultato, totAttivo, totPassivo, sbilancio: r2(totAttivo - totPassivo) };
}

// Controlli: conti movimentati non assegnati, conti assegnati piu' volte.
function controlliSchema(schema, mastrini, esclusi) {
  const assegnati = {};
  ["sp","ce"].forEach(p => (schema[p] || []).forEach(cl => (cl.voci || []).forEach(v => {
    const registra = (conti, dove) => (conti || []).forEach(x => {
      const k = Number(x.c);
      if (!assegnati[k]) assegnati[k] = [];
      assegnati[k].push(dove);
    });
    registra(v.conti, `${p.toUpperCase()} ${cl.codice} - ${v.nome}`);
    // anche i conti agganciati alle sotto-voci sono assegnati a tutti gli effetti:
    // senza questo risulterebbero "mancanti" e riassegnabili una seconda volta
    (v.sottovoci || []).forEach(sv => registra(sv.conti, `${p.toUpperCase()} ${cl.codice} - ${v.nome} · ${sv.nome}`));
  })));
  const escSet = new Set((esclusi || []).map(Number));
  const mancanti = (mastrini || [])
    .filter(m => Math.abs(m.saldo) > 0.005 && !assegnati[Number(m.codice)] && !escSet.has(Number(m.codice)))
    .map(m => ({ codice: Number(m.codice), nome: (m.nome || "").trim(), saldo: m.saldo }));
  const doppi = Object.entries(assegnati)
    .filter(([, dove]) => dove.length > 1)
    .map(([c, dove]) => ({ codice: Number(c), dove }));
  return { mancanti, doppi, assegnati };
}

// ---------- RENDICONTO FINANZIARIO ----------

// Metodo DIRETTO: raggruppa i flussi monetari per categoria di movimento
// e li porta nell'area a cui la categoria e' assegnata.
// Disponibilita' liquide per singolo conto di cassa/banca (apertura e chiusura del periodo).
function disponibilitaLiquidePerConto(scritture) {
  const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
  const byCod = {};
  (LIQ_CODES || []).forEach(cod => { byCod[cod] = { codice: cod, nome: ((contoByCode[cod] && contoByCode[cod].nome) || ("Conto " + cod)).trim(), apertura: 0, flusso: 0 }; });
  (scritture || []).forEach(s => {
    const ap = isApertura(s);
    (s.righe || []).forEach(r => {
      const o = byCod[r.c]; if (!o) return;
      const d = (Number(r.d) || 0) - (Number(r.a) || 0);
      if (ap) o.apertura += d; else o.flusso += d;
    });
  });
  return Object.values(byCod).map(o => ({
    codice: o.codice, nome: o.nome, apertura: r2(o.apertura), chiusura: r2(o.apertura + o.flusso),
  }));
}

// Raggruppa i conti di liquidita' nelle 4 righe di dettaglio richieste per il rendiconto:
// Futsal C/C, Pos C/C, Cassa e tutte le altre disponibilita' liquide accorpate.
function raggruppaDisponibilitaLiquide(perConto) {
  // un rigo per ogni conto di liquidità (BPER c/c, Cassa, Prepagata…)
  return (perConto || []).map(p => ({ nome: p.nome, apertura: p.apertura, chiusura: p.chiusura }));
}

function rendicontoDiretto(schema, scritture) {
  const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
  const aree = (schema.rf?.aree || []).map(a => ({
    ...a,
    voci: (a.voci || []).map(v => ({ ...v, categorie: v.categorie || [] })),
  }));
  const mappaCat = {};   // categoria -> { areaId, voceId }
  aree.forEach(a => a.voci.forEach(v => (v.categorie || []).forEach(c => { mappaCat[c] = { areaId: a.id, voceId: v.id }; })));
  const primaArea = aree[0];
  const nonAssegnate = new Set();
  const flussiCat = {};   // categoria -> importo del periodo

  // Flusso di cassa di ogni scrittura: effetto netto sui conti di liquidità.
  // Aperture escluse (sono la dotazione iniziale); i giroconti fra conti di
  // liquidità hanno effetto netto zero e quindi spariscono da soli.
  (scritture || []).forEach(s => {
    if (isApertura(s)) return;
    const liq = (s.righe || []).filter(r => (LIQ_CODES || []).includes(r.c));
    if (!liq.length) return;
    const v = r2(liq.reduce((t, r) => t + (Number(r.d) || 0) - (Number(r.a) || 0), 0));
    if (Math.abs(v) < 0.005) return;
    const cat = catOf(s) || "(senza categoria)";
    if (!mappaCat[cat]) nonAssegnate.add(cat);
    flussiCat[cat] = (flussiCat[cat] || 0) + v;
  });

  aree.forEach(a => {
    a.voci.forEach(v => {
      v.righe = (v.categorie || [])
        .map(cat => ({ cat, val: r2(flussiCat[cat] || 0) }))
        .sort((x, y) => x.cat.localeCompare(y.cat));
      v.totale = r2(v.righe.reduce((s, r) => s + r.val, 0));
    });
    a.totale = r2(a.voci.reduce((s, v) => s + v.totale, 0));
  });

  if (primaArea) {
    const righeNC = [...nonAssegnate]
      .map(cat => ({ cat, val: r2(flussiCat[cat] || 0) }))
      .filter(r => Math.abs(r.val) > 0.005)
      .sort((x, y) => x.cat.localeCompare(y.cat));
    if (righeNC.length) {
      const totNC = r2(righeNC.reduce((s, r) => s + r.val, 0));
      primaArea.voci = [...primaArea.voci,
        { id: "_nc", codice: "", nome: "Categorie non classificate", categorie: [], righe: righeNC, totale: totNC, virtuale: true }];
      primaArea.totale = r2(primaArea.totale + totNC);
    }
  }

  const perConto = disponibilitaLiquidePerConto(scritture);
  const dettaglioLiquidita = raggruppaDisponibilitaLiquide(perConto);
  const apertura = r2(perConto.reduce((s, p) => s + p.apertura, 0));
  const chiusura = r2(perConto.reduce((s, p) => s + p.chiusura, 0));
  const variazioneAree = r2(aree.reduce((s, a) => s + a.totale, 0));
  const differenzaNascosta = r2(chiusura - apertura - variazioneAree);
  if (primaArea && Math.abs(differenzaNascosta) > 0.005) {
    primaArea.voci = [...primaArea.voci,
      { id: "_ln", codice: "", nome: "Differenze non classificate sui conti di liquidità", categorie: [],
        righe: [], totale: differenzaNascosta, virtuale: true }];
    primaArea.totale = r2(primaArea.totale + differenzaNascosta);
  }
  const variazione = r2(variazioneAree + differenzaNascosta);
  return {
    aree, apertura, variazione, chiusura,
    nonAssegnate: [...nonAssegnate].sort(), dettaglioLiquidita, differenzaNascosta,
  };
}

// Metodo INDIRETTO: ricostruito dalle variazioni dei saldi patrimoniali.
// Vale l'identita' contabile: la somma delle variazioni di TUTTI i conti e' zero,
// quindi la variazione di liquidita' e' l'opposto della somma delle variazioni
// di tutti i conti non liquidi. La scomposizione per natura da' le tre aree.
function rendicontoIndiretto(schema, mastriniFin, mastriniIni, contiMap) {
  const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
  const ini = {};
  (mastriniIni || []).forEach(m => { ini[Number(m.codice)] = m.saldo; });
  const natMap = (schema.rf && schema.rf.natura) || {};
  const nat = (cod) => natMap[String(cod)] || naturaAuto(contiMap[cod]);

  const b = { liquidita: 0, circolante: 0, immobilizzazioni: 0, fondo: 0, patrimonio: 0, economico: 0 };
  const dettagli = { circolante: [], immobilizzazioni: [], fondo: [], patrimonio: [] };

  (mastriniFin || []).forEach(m => {
    const cod = Number(m.codice);
    const delta = (m.saldo || 0) - (ini[cod] || 0);
    if (Math.abs(delta) < 0.005) return;
    const n = nat(cod);
    if (b[n] === undefined) return;
    b[n] += delta;
    if (dettagli[n]) dettagli[n].push({ codice: cod, nome: (m.nome || "").trim(), val: r2(-delta) });
  });

  const risultato   = r2(-b.economico);
  const ammortamenti = r2(-b.fondo);
  const varCircolante = r2(-b.circolante);
  const operativo   = r2(risultato + ammortamenti + varCircolante);
  const investimenti = r2(-b.immobilizzazioni);
  const finanziamenti = r2(-b.patrimonio);
  const variazione  = r2(operativo + investimenti + finanziamenti);

  Object.values(dettagli).forEach(l => l.sort((a, c) => Math.abs(c.val) - Math.abs(a.val)));

  return {
    risultato, ammortamenti, varCircolante, operativo, investimenti, finanziamenti,
    variazione, variazioneLiquidita: r2(b.liquidita), dettagli,
  };
}

// ---------- RENDICONTO RICLASSIFICATO (gestionale) ----------
// Parte dal conto economico dello schema, lo riclassifica fino all'EBITDA e poi
// scende verso la cassa: capitale circolante, investimenti, FCFF, gestione
// finanziaria, FCFE, rapporti con i soci. La variazione calcolata deve coincidere
// con la variazione effettiva della liquidita': se non coincide, c'e' un problema
// di classificazione e lo scarto lo mostra.
function rendicontoRiclassificato(schema, prospetti, mastriniFin, mastriniIni, contiMap) {
  const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
  const somma = l => r2((l || []).reduce((a, x) => a + (x.val || 0), 0));

  // 1) Conto economico riclassificato, voce per voce dallo schema
  const tipoClasse = (cl) => {
    const nome = (cl.nome || "").toLowerCase();
    const cod = String(cl.codice || "").toUpperCase();
    if (/impost/.test(nome) || cod === "20" || cod === "22") return "imposte";
    if (/straordinar/.test(nome) || cod === "E") return "straordinari";
    if (/finanziar/.test(nome) || cod === "C") return "finanziaria";
    if (/ammortament/.test(nome)) return "da";
    return cl.segno >= 0 ? "ricavi" : "costi";
  };
  const ce = { ricavi: [], costi: [], da: [], finanziaria: [], straordinari: [], imposte: [] };
  (prospetti?.ce || []).forEach(cl => {
    const t = tipoClasse(cl);
    const segno = cl.segno >= 0 ? 1 : -1;
    (cl.voci || []).forEach(v => {
      if (v.tipo === "sottosezione") return;
      const val = r2(segno * (v.valore || 0));      // contributo al risultato
      if (Math.abs(val) < 0.005) return;
      let dest = t;
      if (t === "costi" && /ammortament|svalutaz/i.test(v.nome || "")) dest = "da";
      ce[dest].push({ nome: `${v.codice ? v.codice + ") " : ""}${v.nome}`, val });
    });
  });
  const ricavi = somma(ce.ricavi), costi = somma(ce.costi);
  const ebitda = r2(ricavi + costi);
  const da = somma(ce.da);
  const ebit = r2(ebitda + da);
  const finanziaria = somma(ce.finanziaria), straordinari = somma(ce.straordinari), imposte = somma(ce.imposte);
  const risultato = r2(ebit + finanziaria + straordinari + imposte);

  // 2) Variazioni patrimoniali tra apertura e chiusura, conto per conto
  const ini = {};
  (mastriniIni || []).forEach(m => { ini[Number(m.codice)] = m.saldo || 0; });
  const natMap = (schema && schema.rf && schema.rf.natura) || {};
  const nat = (cod) => natMap[String(cod)] || naturaAuto(contiMap[cod]);
  const g = { crediti: [], debiti: [], altroCirc: [], imm: [], fondo: [], patrimonio: [], finanziamento: [] };
  let deltaEconomico = 0, liqIni = 0, liqFin = 0;
  (mastriniFin || []).forEach(m => {
    const cod = Number(m.codice);
    const n = nat(cod);
    if (n === "liquidita") { liqIni += ini[cod] || 0; liqFin += m.saldo || 0; return; }
    const delta = r2((m.saldo || 0) - (ini[cod] || 0));
    if (Math.abs(delta) < 0.005) return;
    if (n === "economico") { deltaEconomico += delta; return; }
    const voce = { codice: cod, nome: (m.nome || contiMap[cod]?.nome || `Conto ${cod}`).trim(), val: r2(-delta) };
    if (n === "immobilizzazioni") { g.imm.push(voce); return; }
    if (n === "fondo" || n === "patrimonio" || n === "finanziamento") { g[n].push(voce); return; }
    const cat = (contiMap[cod]?.categoria || "").toUpperCase();
    if (cat === "CREDITI") g.crediti.push(voce);
    else if (cat === "DEBITI") g.debiti.push(voce);
    else g.altroCirc.push(voce);
  });
  Object.values(g).forEach(l => l.sort((a, b) => Math.abs(b.val) - Math.abs(a.val)));

  // conti economici movimentati ma non assegnati nello schema: altrimenti la cassa non quadra
  const nonClassificato = r2(-deltaEconomico - risultato);

  const varCrediti = somma(g.crediti), varDebiti = somma(g.debiti), varAltro = somma(g.altroCirc);
  const flussoOperativo = r2(ebitda + varCrediti + varDebiti + varAltro + straordinari + imposte + nonClassificato);

  const investimenti = r2(g.imm.filter(x => x.val < 0).reduce((a, x) => a + x.val, 0));
  // cessioni, svalutazioni e fondi: al netto degli ammortamenti gia' riaggiunti sono cassa vera solo in caso di vendite
  const altreImm = r2(g.imm.filter(x => x.val > 0).reduce((a, x) => a + x.val, 0) + somma(g.fondo) + da);
  const fcff = r2(flussoOperativo + investimenti + altreImm);

  const varFinanziamenti = somma(g.finanziamento);
  const fcfe = r2(fcff + finanziaria + varFinanziamenti);

  const distribuzioni = r2(g.patrimonio.filter(x => x.val < 0).reduce((a, x) => a + x.val, 0));
  const apporti = r2(g.patrimonio.filter(x => x.val > 0).reduce((a, x) => a + x.val, 0));
  const variazione = r2(fcfe + distribuzioni + apporti);
  const variazioneEffettiva = r2(liqFin - liqIni);

  return {
    ce, ricavi, costi, ebitda, da, ebit, finanziaria, straordinari, imposte, risultato,
    risultatoSchema: r2(prospetti?.risultato || 0),
    dettagli: g, varCrediti, varDebiti, varAltro, nonClassificato,
    flussoOperativo, investimenti, altreImm, fcff, varFinanziamenti, fcfe,
    distribuzioni, apporti, variazione,
    liqIni: r2(liqIni), liqFin: r2(liqFin), variazioneEffettiva,
    scarto: r2(variazione - variazioneEffettiva),
  };
}

// Righe del prospetto riclassificato, condivise tra schermo ed export.
// tipo: "sez" titolo di sezione · "voce" riga normale · "tot" risultato intermedio ·
// "fin" risultato finale · "det" dettaglio conto (solo se richiesto)
function righeRfRiclassificato(R, conDettaglio) {
  const out = [];
  // add restituisce l'indice della riga, così i totali possono dichiarare da
  // quali righe sono composti (campo `parti`). Serve solo per verificare se
  // gli arrotondamenti all'unità producono una colonna che non somma a vista.
  const add = (tipo, label, val, extra) => { out.push({ tipo, label, val, ...(extra || {}) }); return out.length - 1; };
  const det = (lista) => { if (conDettaglio) (lista || []).forEach(d => add("det", `${d.codice != null ? d.codice + " " : ""}${d.nome}`, d.val)); };

  add("sez", "CONTO ECONOMICO RICLASSIFICATO");
  const iRic = add("voce", "Ricavi operativi", R.ricavi); det(R.ce.ricavi);
  const iCos = add("voce", "Costi operativi", R.costi); det(R.ce.costi);
  const iEbitda = add("tot", "EBITDA · Margine operativo lordo", R.ebitda, { parti: [iRic, iCos] });
  const iDa = add("voce", "Ammortamenti e svalutazioni", R.da); det(R.ce.da);
  const iEbit = add("tot", "EBIT · Risultato operativo", R.ebit, { parti: [iEbitda, iDa] });
  const iFin = add("voce", "Gestione finanziaria", R.finanziaria); det(R.ce.finanziaria);
  const iStr = add("voce", "Componenti straordinarie", R.straordinari); det(R.ce.straordinari);
  const iImp = add("voce", "Imposte", R.imposte); det(R.ce.imposte);
  add("fin", "RISULTATO D'ESERCIZIO", R.risultato, { parti: [iEbit, iFin, iStr, iImp] });

  add("sez", "DALLA REDDITIVITÀ ALLA CASSA");
  const iEbitda2 = add("tot", "EBITDA", R.ebitda);
  const pOp = [iEbitda2];
  pOp.push(add("voce", "Variazione crediti", R.varCrediti)); det(R.dettagli.crediti);
  pOp.push(add("voce", "Variazione debiti operativi", R.varDebiti)); det(R.dettagli.debiti);
  pOp.push(add("voce", "Altre variazioni del circolante", R.varAltro)); det(R.dettagli.altroCirc);
  pOp.push(add("voce", "Componenti straordinarie", R.straordinari));
  pOp.push(add("voce", "Imposte", R.imposte));
  if (Math.abs(R.nonClassificato) >= 0.5) pOp.push(add("voce", "Componenti economiche non assegnate nello schema", R.nonClassificato));
  const iFlusso = add("tot", "FLUSSO DI CASSA OPERATIVO", R.flussoOperativo, { parti: pOp });
  const iInv = add("voce", "Investimenti", R.investimenti); det(R.dettagli.imm.filter(x => x.val < 0));
  const iAltreImm = add("voce", "Disinvestimenti e altre variazioni delle immobilizzazioni", R.altreImm);
  const iFcff = add("tot", "FREE CASH FLOW OPERATIVO (FCFF)", R.fcff, { parti: [iFlusso, iInv, iAltreImm] });
  const iFin2 = add("voce", "Gestione finanziaria", R.finanziaria);
  const iVarFin = add("voce", "Finanziamenti accesi / rimborsati", R.varFinanziamenti); det(R.dettagli.finanziamento);
  const iFcfe = add("tot", "FREE CASH FLOW PER I SOCI (FCFE)", R.fcfe, { parti: [iFcff, iFin2, iVarFin] });
  const iDist = add("voce", "Distribuzioni ai soci", R.distribuzioni); det(R.dettagli.patrimonio.filter(x => x.val < 0));
  const iApp = add("voce", "Apporti dei soci", R.apporti); det(R.dettagli.patrimonio.filter(x => x.val > 0));
  add("fin", "VARIAZIONE DELLE DISPONIBILITÀ LIQUIDE", R.variazione, { parti: [iFcfe, iDist, iApp] });
  add("voce", "Disponibilità liquide iniziali", R.liqIni);
  add("voce", "Disponibilità liquide finali", R.liqFin);
  return out;
}

// Gli importi sono esposti in unità di euro: ogni riga viene arrotondata per
// conto suo, quindi una colonna può non tornare di ±1 anche quando i valori
// reali quadrano al centesimo. Qui verifico se succede davvero, per mettere la
// nota di arrotondamento solo quando serve.
// Forzare la somma non è un'opzione: lo scarto andrebbe scaricato su una riga
// (gestione finanziaria, imposte, ammortamenti) che nel conto economico è
// esposta con il suo valore arrotondato vero, e si creerebbe una discrepanza
// peggiore fra due prospetti dello stesso documento.
function scartiDiArrotondamento(righe) {
  const r0 = n => { const x = Number(n) || 0; return (x < 0 ? -1 : 1) * Math.round(Math.abs(x)); };
  return (righe || []).some(r => {
    if (!r.parti || !r.parti.length) return false;
    const somma = r.parti.reduce((s, i) => s + r0(righe[i].val), 0);
    return somma !== r0(r.val);
  });
}

// Sezione PDF del rendiconto riclassificato. Usa esattamente le righe della
// vista a schermo (righeRfRiclassificato), così carta e video non possono
// divergere: se cambia il prospetto, cambiano entrambi insieme.
// `doc` e' il documento su cui appendere; `titolo` l'intestazione di sezione.
function generaPdfRfRiclassificato(R, stagione, doc, titolo, conDettaglio) {
  if (!R) return;
  const W = doc.internal.pageSize.width;
  doc.setFont("helvetica", "bold"); doc.setFontSize(14);
  doc.text(titolo, 14, 18);
  doc.setDrawColor(26, 26, 26); doc.line(14, 21, W - 14, 21);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(110);
  doc.text("Dall'EBITDA al free cash flow: voci del conto economico dello schema e variazioni patrimoniali fra apertura e chiusura.",
           14, 26);
  doc.setTextColor(0);

  // Stessa formattazione degli altri prospetti del documento: importi interi,
  // lo zero scritto "-". Prendo money() dal builder cosi' non puo' divergere.
  const { money, NERO, GRIGIO_CHIARO: GRIGIO } = creaPdfBuilder(stagione, "portrait", doc);
  const body = righeRfRiclassificato(R, !!conDettaglio).map(r => {
    const imp = money(r.val);
    if (r.tipo === "sez") return [{ content: r.label, colSpan: 2, styles: { fontStyle: "bold", fillColor: NERO, textColor: 240 } }];
    if (r.tipo === "det") return [{ content: `      ${r.label}`, styles: { fontSize: 7, textColor: [130, 130, 130] } },
                                  { content: imp, styles: { fontSize: 7, textColor: [130, 130, 130] } }];
    if (r.tipo === "tot") return [{ content: `  ${r.label}`, styles: { fontStyle: "bold", fillColor: GRIGIO } },
                                  { content: imp, styles: { fontStyle: "bold", fillColor: GRIGIO } }];
    if (r.tipo === "fin") return [{ content: `  ${r.label}`, styles: { fontStyle: "bold", fillColor: NERO, textColor: 240 } },
                                  { content: imp, styles: { fontStyle: "bold", fillColor: NERO, textColor: 240 } }];
    return [`     ${r.label}`, imp];
  });
  doc.autoTable({
    startY: 30, head: [["Voce", "Importo"]], body, theme: "plain",
    styles: { fontSize: 8.5, cellPadding: 1.6 },
    headStyles: { fillColor: NERO, textColor: 240, fontStyle: "bold" },
    columnStyles: { 0: { cellWidth: 126 }, 1: { cellWidth: 34, halign: "right" } },
    margin: { left: (W - 160) / 2 },
  });

  const righeRf = righeRfRiclassificato(R, !!conDettaglio);
  if (scartiDiArrotondamento(righeRf)) {
    const yN = doc.lastAutoTable.finalY + 5;
    doc.setFont("helvetica", "italic"); doc.setFontSize(7.5); doc.setTextColor(120);
    doc.text("Importi in unità di euro: ogni riga è arrotondata singolarmente, quindi una somma può differire di 1 dal totale esposto. I valori reali quadrano al centesimo.",
             (W - 160) / 2, yN);
    doc.setFont("helvetica", "normal"); doc.setTextColor(0);
  }

  // La riga di controllo resta solo quando c'e' davvero uno scarto da spiegare.
  if (Math.abs(R.scarto) >= 0.5) {
    const y = doc.lastAutoTable.finalY + (scartiDiArrotondamento(righeRf) ? 14 : 8);
    doc.setFillColor(181, 67, 67); doc.rect(14, y - 5, W - 28, 10, "F");
    doc.setTextColor(255); doc.setFont("helvetica", "bold"); doc.setFontSize(9);
    // Riga discorsiva: qui il segno si scrive col meno, la parentesi serve solo nelle colonne di importi
    doc.text(`SCARTO DI ${R.scarto < 0 ? "-" : ""}${money(Math.abs(R.scarto))} RISPETTO ALLA VARIAZIONE EFFETTIVA DELLA LIQUIDITÀ`, 16, y + 2);
    doc.setTextColor(0);
  }
}

// Vista a schermo (componente a livello di modulo, come gli altri editor dello schema)
function SBRfRiclassificato({ R }) {
  const [dettaglio, setDettaglio] = useState(false);
  if (!R) return null;
  // m0: colonne di importi → negativi fra parentesi. m0s: righe discorsive → segno meno.
  const m0 = (n) => { const r = Math.round(Number(n) || 0); if (r === 0) return "-";
                      const s = Math.abs(r).toLocaleString("it-IT"); return r < 0 ? "(" + s + ")" : s; };
  const m0s = (n) => { const r = Math.round(Number(n) || 0); return r === 0 ? "-" : r.toLocaleString("it-IT"); };
  const righe = righeRfRiclassificato(R, dettaglio);
  const ok = Math.abs(R.scarto) < 0.5;
  const okCe = Math.abs(R.risultato - R.risultatoSchema) < 0.5;
  return (
    <div className="card" style={{ maxWidth: 640, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
        <div className="card-title" style={{ margin: 0 }}>RF Riclassificato</div>
        <label style={{ fontSize: 12.5, display: "flex", gap: 6, alignItems: "center", color: "var(--ink-2)" }}>
          <input type="checkbox" checked={dettaglio} onChange={e => setDettaglio(e.target.checked)} />
          Mostra i conti
        </label>
      </div>
      <div style={{ fontSize: 12, color: "var(--ink-3)", margin: "6px 0 12px", lineHeight: 1.5 }}>
        Dall'EBITDA al free cash flow. Legge le voci del conto economico dallo schema e le variazioni
        patrimoniali tra apertura e chiusura, classificate secondo la natura dei conti impostata in Struttura RF.
      </div>
      <table style={{ width: "100%" }}>
        <tbody>
          {righe.map((r, i) => {
            if (r.tipo === "sez") return (
              <tr key={i}><td colSpan={2} style={{ paddingTop: i ? 18 : 4, fontFamily: "'Fraunces',serif", fontSize: 14,
                                                  borderBottom: "1px solid var(--rule-2)" }}>{r.label}</td></tr>
            );
            if (r.tipo === "det") return (
              <tr key={i}>
                <td style={{ paddingLeft: 22, fontSize: 11.5, color: "var(--ink-3)" }}>{r.label}</td>
                <td className="num" style={{ fontSize: 11.5, color: "var(--ink-3)" }}>{m0(r.val)}</td>
              </tr>
            );
            const tot = r.tipo === "tot", fin = r.tipo === "fin";
            return (
              <tr key={i} style={tot ? { background: "var(--panel-2)" } : fin ? { background: "var(--ink)", color: "#fff" } : {}}>
                <td style={{ paddingLeft: tot || fin ? 8 : 12, fontWeight: tot || fin ? 700 : 400 }}>
                  {r.label}
                </td>
                <td className={"num " + (!fin && r.val < -0.5 ? "neg" : "")} style={{ fontWeight: tot || fin ? 700 : 400, paddingRight: 8 }}>
                  {m0(r.val)}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
      {scartiDiArrotondamento(righe) && (
        <div style={{ marginTop: 10, fontSize: 11.5, color: "var(--ink-3)", fontStyle: "italic", lineHeight: 1.5 }}>
          Importi in unità di euro: ogni riga è arrotondata singolarmente, quindi una somma può differire
          di 1 dal totale esposto. I valori reali quadrano al centesimo.
        </div>
      )}
      <div style={{ marginTop: 14, padding: "8px 12px", borderRadius: 6, fontSize: 12.5,
                    background: ok ? "#e7f3ea" : "var(--danger-soft)", color: ok ? "var(--accent)" : "var(--danger)" }}>
        {ok
          ? `✓ Quadra con la variazione effettiva della liquidità (${m0s(R.variazioneEffettiva)})`
          : `✗ Scarto di ${m0s(R.scarto)} rispetto alla variazione effettiva della liquidità (${m0s(R.variazioneEffettiva)}): c'è un conto classificato male o una natura da correggere in Struttura RF.`}
      </div>
      {!okCe && (
        <div style={{ marginTop: 8, fontSize: 12, color: "var(--danger)" }}>
          ⚠ Il risultato riclassificato ({m0s(R.risultato)}) non coincide con quello del conto economico ({m0s(R.risultatoSchema)}).
        </div>
      )}
    </div>
  );
}

// ---------- Costruttore PDF condiviso per i prospetti "ufficiali" (SP, CE, RF) ----------
// Stessa grafica ovunque vengano generati: pagina Schema di Bilancio e pagina Export.
// I numeri sono sempre arrotondati all'unita' di euro (nessun decimale).
function creaPdfBuilder(stagione, orientamento, docEsistente) {
  const { jsPDF } = window.jspdf;
  const doc = docEsistente || new jsPDF({ orientation: orientamento || "portrait", unit: "mm", format: "a4" });
  // Importi interi; lo zero si scrive "-" come nei prospetti di bilancio classici
  // I negativi si scrivono fra parentesi tonde: -1.726 → (1.726)
  const money = n => {
    const x = Number(n) || 0;
    const r = Math.sign(x) * Math.round(Math.abs(x));   // simmetrico: -676,50 → -677
    if (r === 0) return "-";
    const s = numIT(Math.abs(r), 0);
    return r < 0 ? "(" + s + ")" : s;
  };
  const oggi = new Date().toLocaleDateString("it-IT");
  const VERDE = [31, 79, 143], ROSSO = [192, 67, 63], NERO = [22, 34, 61];
  const VERDE_CHIARO = [230, 237, 248], ROSSO_CHIARO = [251, 236, 236], GRIGIO_CHIARO = [238, 241, 246];

  const intestazioneP = (titolo) => {
    doc.setFont("helvetica", "bold"); doc.setFontSize(16);
    doc.text("CONTABILITÀ PERSONALE", 105, 18, { align: "center" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(11);
    doc.text(`${titolo} · ${stagione}`, 105, 25, { align: "center" });
    doc.setFontSize(9); doc.setTextColor(100);
    doc.text(`Generato il ${oggi}`, 105, 31, { align: "center" });
    doc.setTextColor(0);
  };
  const intestazioneL = (titolo) => {
    doc.setFont("helvetica", "bold"); doc.setFontSize(15);
    doc.text("CONTABILITÀ PERSONALE", 148, 14, { align: "center" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    doc.text(`${titolo} · ${stagione}`, 148, 20, { align: "center" });
    doc.setFontSize(8); doc.setTextColor(100);
    doc.text(`Generato il ${oggi}`, 148, 25, { align: "center" });
    doc.setTextColor(0);
  };
  // tabella con intestazione colorata (verde/rosso), come in Export
  const tabellaColorata = (body, headLabel, startY, coloreHead) => {
    doc.autoTable({
      startY, head: [[headLabel, "Importo"]], body, theme: "plain",
      styles: { fontSize: 9, cellPadding: 2 },
      headStyles: { fillColor: coloreHead, textColor: 240, fontStyle: "bold" },
      columnStyles: { 0: { cellWidth: 140 }, 1: { cellWidth: 42, halign: "right" } },
    });
    return doc.lastAutoTable.finalY;
  };
  // barra finale nera/colorata con etichetta e valore, come RISULTATO D'ESERCIZIO in Export
  const barraFinale = (y, label, valore, colore) => {
    doc.setFillColor(...colore); doc.rect(14, y, doc.internal.pageSize.width - 28, 10, "F");
    doc.setTextColor(255); doc.setFont("helvetica", "bold"); doc.setFontSize(11);
    doc.text(label, 16, y + 7);
    doc.text(valore, doc.internal.pageSize.width - 16, y + 7, { align: "right" });
    doc.setTextColor(0);
  };
  // righe di una macroclasse, con eventuale sottotitolo per le voci "sotto-sezione"
  // (marcatori senza conti propri, es. Immobilizzazioni materiali / immateriali / finanziarie)
  const righeClasse = (cl, prefissoVoce) => {
    const rows = [[{ content: `${cl.codice ? cl.codice + ") " : ""}${cl.nome}`, styles: { fontStyle: "bold" } },
                   { content: money(cl.totale), styles: { fontStyle: "bold" } }]];
    (cl.voci || []).forEach(v => {
      if (v.tipo === "sottosezione") {
        rows.push([{ content: `   ${v.nome}`, styles: { fontStyle: "italic", textColor: [130, 130, 130] } }, ""]);
        return;
      }
      rows.push([`   ${v.codice ? v.codice + prefissoVoce : ""}${v.nome}`, money(v.valore)]);
      // sotto-voci: un livello piu' rientrato, col proprio subtotale, come
      // "1) Terreni e fabbricati" sotto "II. Immobilizzazioni materiali"
      (v.sottovoci || []).forEach(sv => {
        rows.push([{ content: `      ${sv.codice ? sv.codice + ") " : ""}${sv.nome}`, styles: { textColor: [90, 90, 90] } },
                   { content: money(sv.valore), styles: { textColor: [90, 90, 90] } }]);
      });
    });
    return rows;
  };

  return { doc, money, VERDE, ROSSO, NERO, VERDE_CHIARO, ROSSO_CHIARO, GRIGIO_CHIARO,
           intestazioneP, intestazioneL, tabellaColorata, barraFinale, righeClasse };
}

// --- Stato Patrimoniale (documento singolo) ---
function generaPdfSP(prospetti, stagione) {
  const b = creaPdfBuilder(stagione, "portrait");
  b.intestazioneP("Stato Patrimoniale");
  const attivoRows = prospetti.sp.filter(c => c.lato === "attivo").flatMap(cl => b.righeClasse(cl, ". "));
  attivoRows.push([{ content: "TOTALE ATTIVO", styles: { fontStyle: "bold" } },
                    { content: b.money(prospetti.totAttivo), styles: { fontStyle: "bold", fillColor: b.VERDE_CHIARO } }]);
  let y = b.tabellaColorata(attivoRows, "ATTIVO", 36, b.VERDE);
  const passivoRows = prospetti.sp.filter(c => c.lato === "passivo").flatMap(cl => b.righeClasse(cl, ". "));
  passivoRows.push([{ content: "TOTALE PASSIVO E PN", styles: { fontStyle: "bold" } },
                     { content: b.money(prospetti.totPassivo), styles: { fontStyle: "bold", fillColor: b.ROSSO_CHIARO } }]);
  y = b.tabellaColorata(passivoRows, "PASSIVO E PATRIMONIO NETTO", y + 10, b.ROSSO);
  if (Math.abs(prospetti.sbilancio) >= 0.01) {
    b.barraFinale(y + 6, "SBILANCIO ATTIVO / PASSIVO", b.money(prospetti.sbilancio), b.ROSSO);
  }
  b.doc.save(`Stato_Patrimoniale_${sbSlug(stagione)}.pdf`);
}

// --- Conto Economico (documento singolo) ---
function generaPdfCE(prospetti, stagione) {
  const b = creaPdfBuilder(stagione, "portrait");
  b.intestazioneP("Conto Economico");
  const posCE = prospetti.ce.filter(cl => cl.segno >= 0);
  const negCE = prospetti.ce.filter(cl => cl.segno < 0);
  let y = 34;
  if (posCE.length) {
    const rows = posCE.flatMap(cl => b.righeClasse(cl, ") "));
    rows.push([{ content: "Totale voci positive", styles: { fontStyle: "bold" } },
               { content: b.money(posCE.reduce((s, c) => s + c.totale, 0)), styles: { fontStyle: "bold", fillColor: b.VERDE_CHIARO } }]);
    y = b.tabellaColorata(rows, "VOCI POSITIVE", y, b.VERDE) + 10;
  }
  if (negCE.length) {
    const rows = negCE.flatMap(cl => b.righeClasse(cl, ") "));
    rows.push([{ content: "Totale voci negative", styles: { fontStyle: "bold" } },
               { content: b.money(negCE.reduce((s, c) => s + c.totale, 0)), styles: { fontStyle: "bold", fillColor: b.ROSSO_CHIARO } }]);
    y = b.tabellaColorata(rows, "VOCI NEGATIVE", y, b.ROSSO) + 10;
  }
  b.barraFinale(y, "RISULTATO D'ESERCIZIO",
                `${b.money(prospetti.risultato)}  (${prospetti.risultato >= 0 ? "Utile" : "Perdita"})`, b.NERO);
  b.doc.save(`Conto_Economico_${sbSlug(stagione)}.pdf`);
}

// Genera in un unico PDF (3 pagine) i prospetti civilistici SP + CE + RF (metodo diretto),

  b.intestazioneP("Stato Patrimoniale");
  const attivoRows = prospetti.sp.filter(c => c.lato === "attivo").flatMap(cl => b.righeClasse(cl, ". "));
  attivoRows.push([{ content: "TOTALE ATTIVO", styles: { fontStyle: "bold" } },
                    { content: b.money(prospetti.totAttivo), styles: { fontStyle: "bold", fillColor: b.VERDE_CHIARO } }]);
  let y = b.tabellaColorata(attivoRows, "ATTIVO", 36, b.VERDE);
  const passivoRows = prospetti.sp.filter(c => c.lato === "passivo").flatMap(cl => b.righeClasse(cl, ". "));
  passivoRows.push([{ content: "TOTALE PASSIVO E PN", styles: { fontStyle: "bold" } },
                     { content: b.money(prospetti.totPassivo), styles: { fontStyle: "bold", fillColor: b.ROSSO_CHIARO } }]);
  y = b.tabellaColorata(passivoRows, "PASSIVO E PATRIMONIO NETTO", y + 10, b.ROSSO);
  if (Math.abs(prospetti.sbilancio) >= 0.01) {
    b.barraFinale(y + 6, "SBILANCIO ATTIVO / PASSIVO", b.money(prospetti.sbilancio), b.ROSSO);
  }

  // --- Conto Economico ---
  b.doc.addPage(); b.intestazioneP("Conto Economico");
  const posCE = prospetti.ce.filter(cl => cl.segno >= 0);
  const negCE = prospetti.ce.filter(cl => cl.segno < 0);
  let y2 = 34;
  if (posCE.length) {
    const rows = posCE.flatMap(cl => b.righeClasse(cl, ") "));
    rows.push([{ content: "Totale voci positive", styles: { fontStyle: "bold" } },
               { content: b.money(posCE.reduce((s, c) => s + c.totale, 0)), styles: { fontStyle: "bold", fillColor: b.VERDE_CHIARO } }]);
    y2 = b.tabellaColorata(rows, "VOCI POSITIVE", y2, b.VERDE) + 10;
  }
  if (negCE.length) {
    const rows = negCE.flatMap(cl => b.righeClasse(cl, ") "));
    rows.push([{ content: "Totale voci negative", styles: { fontStyle: "bold" } },
               { content: b.money(negCE.reduce((s, c) => s + c.totale, 0)), styles: { fontStyle: "bold", fillColor: b.ROSSO_CHIARO } }]);
    y2 = b.tabellaColorata(rows, "VOCI NEGATIVE", y2, b.ROSSO) + 10;
  }
  b.barraFinale(y2, "RISULTATO D'ESERCIZIO",
                `${b.money(prospetti.risultato)}  (${prospetti.risultato >= 0 ? "Utile" : "Perdita"})`, b.NERO);

  // --- Rendiconto: metodo diretto ---
  b.doc.addPage("a4", "landscape"); b.intestazioneL("Rendiconto Finanziario · Metodo diretto");
  const bodyD = [];
  rfDir.aree.forEach(a => {
    bodyD.push([{ content: `${a.codice ? a.codice + ") " : ""}${a.nome}`, styles: { fontStyle: "bold", fillColor: b.GRIGIO_CHIARO } },
                { content: b.money(a.totale), styles: { fontStyle: "bold", fillColor: b.GRIGIO_CHIARO } }]);
    (a.voci || []).forEach(v => {
      bodyD.push([{ content: `   ${v.codice ? v.codice + ". " : ""}${v.nome}`, styles: { fontStyle: "bold" } },
                  { content: b.money(v.totale), styles: { fontStyle: "bold" } }]);
    });
  });
  bodyD.push([{ content: "VARIAZIONE DELLE DISPONIBILITA' LIQUIDE", styles: { fontStyle: "bold" } },
              { content: b.money(rfDir.variazione), styles: { fontStyle: "bold", fillColor: b.VERDE_CHIARO } }]);
  bodyD.push(["Disponibilita' liquide iniziali", b.money(rfDir.apertura)]);
  rfDir.dettaglioLiquidita.forEach(d => bodyD.push([`      ${d.nome}`, b.money(d.apertura)]));
  bodyD.push([{ content: "Disponibilita' liquide finali", styles: { fontStyle: "bold" } },
              { content: b.money(rfDir.chiusura), styles: { fontStyle: "bold" } }]);
  rfDir.dettaglioLiquidita.forEach(d => bodyD.push([`      ${d.nome}`, b.money(d.chiusura)]));
  b.doc.autoTable({
    startY: 30, head: [["Voce", "Importo"]], body: bodyD, theme: "plain",
    styles: { fontSize: 9, cellPadding: 2 },
    headStyles: { fillColor: b.VERDE, textColor: 240, fontStyle: "bold" },
    columnStyles: { 0: { cellWidth: 108 }, 1: { cellWidth: 32, halign: "right" } },
    // tabella stretta: la centro nella pagina invece di lasciarla appoggiata a sinistra
    margin: { left: (b.doc.internal.pageSize.width - 140) / 2 },
  });

  // Metodo indiretto: tolto per ora (vedi commento sopra la funzione).

  b.doc.save(`Prospetti_Civilistici_${sbSlug(stagione)}.pdf`);
}

function SBEditorVoce({ p, cl, v, api, contiMap, contiOrdinati, assegnati }) {
  const [forza, setForza] = useState(false);
  const codiciQui = new Set([
    ...(v.conti || []).map(x => Number(x.c)),
    ...(v.sottovoci || []).flatMap(sv => (sv.conti || []).map(x => Number(x.c))),
  ]);
  const disponibili = contiOrdinati.filter(m => !codiciQui.has(Number(m.codice)));
  const opzioni = forza ? disponibili : disponibili.filter(m => !assegnati[Number(m.codice)]);
  const nNascosti = disponibili.length - opzioni.length;
  const saldiMap = useMemo(() => { const m = {}; contiOrdinati.forEach(c => { m[c.codice] = c.saldo; }); return m; }, [contiOrdinati]);

  return (
    <div style={{ borderLeft: "2px solid var(--rule-2)", paddingLeft: 10, marginBottom: 10 }}>
      <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>

        <input value={v.nome || ""} onChange={e => api.updVoce(p, cl.id, v.id, { nome: e.target.value })}
               style={{ flex: 1, minWidth: 150 }} />
        <button className="btn ghost sm" onClick={() => api.moveVoce(p, cl.id, v.id, -1)}>↑</button>
        <button className="btn ghost sm" onClick={() => api.moveVoce(p, cl.id, v.id, 1)}>↓</button>
        <button className="btn danger sm" onClick={() => api.delVoce(p, cl.id, v.id)}>✕</button>
      </div>

      {v.speciale === "risultato" ? (
        <div style={{ fontSize: 12, color: "var(--accent)", margin: "6px 0 0 4px", fontStyle: "italic" }}>

            {(v.conti || []).map(x => (
              <SBPillConto key={x.c} x={x}

                      titoloRimuovi="Riporta il conto al livello della voce" />
                  ))}
                  {sotto.size === 0 && (
                    <span style={{ fontSize: 11, color: "var(--ink-3)" }}>Nessun conto: sposta qui i conti della voce col menu qui sotto.</span>

                  <select value="" onChange={e => { if (e.target.value) api.spostaContoInSottoVoce(p, cl.id, v.id, e.target.value, sv.id); e.target.value = ""; }}
                          style={{ fontSize: 12, maxWidth: 340 }}>
