// Proposta per il rendiconto diretto: ogni categoria di cassa non ancora assegnata
// va in una sottovoce in base alla sezione che ha nell'anagrafica Categorie
// (entrata / uscita / investimento / interno). Le sottovoci si creano solo se servono.
function proponiCategorieRF(schema, categorieTutte, categorie) {
  const s = JSON.parse(JSON.stringify(schema));
  s.rf = s.rf || schemaDefault().rf;
  const aree = s.rf.aree || [];
  const gia = new Set();
  aree.forEach(a => (a.voci || []).forEach(v => (v.categorie || []).forEach(c => gia.add(c))));
  const sezDi = {}; (categorie || []).forEach(c => { if (c) sezDi[nk(c.nome)] = c.sezione; });
  let nuove = 0;
  const voce = (a, nome) => {
    if (!a) return null;
    a.voci = a.voci || [];
    let v = a.voci.find(x => x.nome === nome);
    if (!v) { v = { id: uid(), codice: String(a.voci.length + 1), nome, categorie: [] }; a.voci.push(v); }
    return v;
  };
  (categorieTutte || []).forEach(c => {
    if (gia.has(c)) return;
    const u = String(c).toUpperCase(), sez = sezDi[nk(c)];
    let dest;
    if (sez === "investimento" || /INVESTIMENT|TITOLI|FONDI|CESPIT|IMMOBILIZZ/.test(u)) dest = voce(aree[1], "Investimenti e disinvestimenti");
    else if (/FINANZIAMENT|PRESTITO|MUTUO|CAPITALE/.test(u)) dest = voce(aree[2], "Prestiti e apporti");
    else if (sez === "entrata") dest = voce(aree[0], "Incassi correnti");
    else if (sez === "uscita") dest = voce(aree[0], "Pagamenti correnti");
    else dest = voce(aree[0], "Altri flussi correnti");
    if (dest) { dest.categorie = [...(dest.categorie || []), c].sort(); nuove++; }
  });
  if (nuove) {
    // incassi prima dei pagamenti, poi rinumero 1..n come fa "↻ Rinumera sottovoci"
    const rank = { "Incassi correnti": 1, "Pagamenti correnti": 2, "Altri flussi correnti": 3 };
    aree.forEach(a => { a.voci = (a.voci || []).map((v, i) => ({ v, i })).sort((x, y) => ((rank[x.v.nome] || 0) - (rank[y.v.nome] || 0)) || (x.i - y.i)).map(x => x.v); });
    rinumeraVociRF(s);
  }
  return s;
}

function PageSchemaBilancio({ scritture: scrittureTutte, conti, categorie, toast }) {
  const onToast = (m, k) => toast && toast(m, k || "success");
  const [tab, setTab] = useState("prospetti");   // sp | ce | rf | rfr | prospetti | controlli
  // periodo: dall'apertura fino alla data scelta (tutte le scritture se vuoto)
  const [alData, setAlData] = useState("");
  const fineMesi = useMemo(() => {
    const set = new Set();
    (scrittureTutte || []).forEach(x => { if (x && x.data && !isApertura(x)) set.add(x.data.slice(0, 7)); });
    return [...set].sort().reverse().map(mk => fineMese(mk));
  }, [scrittureTutte]);
  const scritture = useMemo(() => alData ? (scrittureTutte || []).filter(x => isApertura(x) || !x.data || x.data <= alData) : (scrittureTutte || []),
    [scrittureTutte, alData]);
  const ultimaData = useMemo(() => (scritture || []).reduce((m, x) => (x.data && x.data > m ? x.data : m), ""), [scritture]);
  const stagione = "Situazione al " + fmtDate(alData || ultimaData || todayISO());
  const [schema, setSchema] = useState(null);
  const [esclusi, setEsclusi] = useState([]);
  const [caricato, setCaricato] = useState(false);
  const [salvando, setSalvando] = useState(false);
  const [espansi, setEspansi] = useState({});

  const statoRef = useRef({ schema: null, esclusi: [] });
  const timerRef = useRef(null);
  const pendingRef = useRef(false);
  const scrittoRef = useRef(null);
  statoRef.current = { schema, esclusi };
  const fmt0Euro = (n) => "€ " + fmt(n, 0);

  const contiMap = useMemo(() => {
    const m = {};
    (conti || []).forEach(c => { m[c.codice] = c; });
    return m;
  }, [conti]);

  // mastrini dal libro giornale: tutti i conti del piano, anche a saldo zero,
  // così si possono agganciare allo schema prima che vengano movimentati
  const calcMastrini = (lista) => {
    const m = {};
    (conti || []).forEach(c => { m[c.codice] = { codice: Number(c.codice), nome: c.nome, dare: 0, avere: 0 }; });
    (lista || []).forEach(sc => (sc.righe || []).forEach(r => {
      if (!m[r.c]) m[r.c] = { codice: Number(r.c), nome: (contiMap[r.c] && contiMap[r.c].nome) || ("Conto " + r.c), dare: 0, avere: 0 };
      m[r.c].dare += Number(r.d) || 0; m[r.c].avere += Number(r.a) || 0;
    }));
    return Object.values(m).map(x => ({ ...x, dare: r2(x.dare), avere: r2(x.avere), saldo: r2(x.dare - x.avere),
      categoria: contiMap[x.codice]?.categoria || "", prospetto: contiMap[x.codice]?.prospetto || "" }))
      .sort((a, b) => a.codice - b.codice);
  };
  const mastrini = useMemo(() => calcMastrini(scritture), [scritture, contiMap]);
  // saldi di apertura: solo le scritture di (ri)apertura
  const mastriniIniziali = useMemo(() => calcMastrini((scritture || []).filter(isApertura)), [scritture, contiMap]);

  // categorie delle scritture che muovono la liquidità (per il rendiconto diretto)
  const categorieTutte = useMemo(() => {
    const s = new Set();
    (scrittureTutte || []).forEach(x => {
      if (isApertura(x)) return;
      const liq = (x.righe || []).filter(r => (LIQ_CODES || []).includes(r.c));
      if (!liq.length) return;
      const v = liq.reduce((t, r) => t + (Number(r.d) || 0) - (Number(r.a) || 0), 0);
      if (Math.abs(v) < 0.005) return;
      s.add(catOf(x) || "(senza categoria)");
    });
    return [...s].sort();
  }, [scrittureTutte]);

  // --- caricamento ---
  useEffect(() => {
    if (!firebaseReady) {
      try {
        const raw = localStorage.getItem(SB_LS);
        if (raw) { const parsed = JSON.parse(raw); setSchema(normalizzaSchema(parsed.schema || parsed)); setEsclusi(parsed.esclusi || []); }
        else setSchema(proponiCategorieRF(proponiMappatura(schemaDefault(), conti), categorieTutte, categorie));
      } catch (e) { setSchema(proponiCategorieRF(proponiMappatura(schemaDefault(), conti), categorieTutte, categorie)); }
      setCaricato(true); return;
    }
    const ref = db.ref(SB_PATH);
    const cb = ref.on("value", snap => {
      const v = snap.val();
      // non sovrascrivo mentre l'utente sta scrivendo, ne' sull'eco delle mie scritture
      if (pendingRef.current) return;
      if (v && v.json && v.json === scrittoRef.current) { setCaricato(true); return; }
      if (v && v.json) {
        try {
          const parsed = JSON.parse(v.json);
          setSchema(normalizzaSchema(parsed.schema || parsed));
          setEsclusi(parsed.esclusi || []);
        } catch (e) { setSchema(schemaDefault()); }
      } else {
        // primo accesso: schema di default con i conti già proposti
        setSchema(proponiCategorieRF(proponiMappatura(schemaDefault(), conti), categorieTutte, categorie));
      }
      setCaricato(true);
    }, () => { setSchema(proponiCategorieRF(proponiMappatura(schemaDefault(), conti), categorieTutte, categorie)); setCaricato(true); });
    return () => { ref.off("value", cb); clearTimeout(timerRef.current); };
  }, []);

  const scriviOra = useCallback(async () => {
    clearTimeout(timerRef.current);
    const { schema: sc, esclusi: es } = statoRef.current;
    if (!sc) { pendingRef.current = false; return; }
    const json = JSON.stringify({ schema: sc, esclusi: es });
    setSalvando(true);
    try {
      scrittoRef.current = json;
      if (firebaseReady) await db.ref(SB_PATH).set({ json, aggiornatoIl: new Date().toISOString() });
      else localStorage.setItem(SB_LS, json);
    } catch (e) {
      onToast && onToast("Errore nel salvataggio dello schema", "error");
    }
    pendingRef.current = false;
    setSalvando(false);
  }, []);

  // aggiorna lo stato locale subito (l'input resta reattivo) e salva in differita
  const aggiorna = useCallback((sc, es) => {
    setSchema(sc);
    if (es !== undefined) setEsclusi(es);
    statoRef.current = { schema: sc, esclusi: es !== undefined ? es : statoRef.current.esclusi };
    pendingRef.current = true;
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => scriviOra(), 800);
  }, [scriviOra]);

  const prospetti = useMemo(() => schema ? calcolaProspetti(schema, mastrini) : null, [schema, mastrini]);
  const controlli = useMemo(() => schema ? controlliSchema(schema, mastrini, esclusi) : null, [schema, mastrini, esclusi]);

  // Avvisi di classificazione: non bloccano nulla, segnalano voci che quadrano
  // ma raccontano male i numeri. Lo schema e' salvato su Firebase, quindi una
  // riclassifica va fatta qui a mano: questi avvisi dicono dove guardare.
  const avvisiClassificazione = useMemo(() => {
    if (!schema) return [];
    const out = [];
    const nomeDi = (c) => (contiMap?.[Number(c)]?.nome || `Conto ${c}`).trim();
    // 1) Conto economico: cosa sta dentro la voce delle imposte
    (schema.ce || []).forEach(cl => {
      if (!/impost/i.test(cl.nome || "")) return;
      (cl.voci || []).forEach(v => [
        ...(v.conti || []).map(x => ({ x, dove: v.nome })),
        ...(v.sottovoci || []).flatMap(sv => (sv.conti || []).map(x => ({ x, dove: `${v.nome} · ${sv.nome}` }))),
      ].forEach(({ x }) => {
        const n = nomeDi(x.c).toUpperCase();
        if (/RITENUT/.test(n)) {
          out.push({ grave: true, testo: `${x.c} ${nomeDi(x.c)} è classificato in "${cl.nome} · ${v.nome}". Le ritenute trattenute sui compensi pagati a terzi fanno parte del costo del servizio, non delle imposte.` });
        } else if (!/IMPOST/.test(n)) {
          out.push({ grave: false, testo: `${x.c} ${nomeDi(x.c)} è nella voce delle imposte ma il nome non parla di imposte: verifica la classificazione.` });
        }
      }));
    });
    // 2) Rendiconto: sottovoci senza numero, senza categorie, o col nome segnaposto
    (schema.rf?.aree || []).forEach(a => {
      const voci = a.voci || [];
      const conNumero = voci.filter(v => String(v.codice || "").trim() !== "").length;
      voci.forEach(v => {
        if (conNumero > 0 && String(v.codice || "").trim() === "") {
          out.push({ grave: false, testo: `Rendiconto, area ${a.codice || a.nome}: la sottovoce "${v.nome}" è senza numero mentre le altre ce l'hanno. Usa "↻ Rinumera sottovoci".` });
        }
        if (/^categorie$/i.test((v.nome || "").trim())) {
          out.push({ grave: true, testo: `Rendiconto, area ${a.codice || a.nome}: "${v.nome}" è un nome segnaposto ereditato dalla vecchia migrazione. Rinominala con il flusso che contiene (es. "Mezzi propri - Dividendi").` });
        }
        if (!(v.categorie || []).length) {
          out.push({ tipo: "nota", testo: `Area ${a.codice || a.nome}: "${v.nome}" non ha categorie assegnate, quindi esce a zero nel PDF.` });
        }
        // 3) Categoria di cassa finita sotto una sottovoce che non la descrive
        (v.categorie || []).forEach(c => {
          REGOLE_CAT_RF.forEach(r => {
            if (r.cat.test(String(c).toUpperCase()) && !r.voce.test(v.nome || "")) {
              out.push({ grave: true, testo: `Rendiconto, area ${a.codice || a.nome}: la categoria "${c}" è assegnata a "${v.nome}". Attesa ${r.attesa}.`
                + (r.auto ? "" : " Da spostare a mano: la correzione automatica lascia stare questo caso.") });
            }
          });
        });
      });
    });
    return out.map(a => ({ tipo: "azione", ...a }));
  }, [schema, contiMap]);

  // Le note informative (sottovoci strutturalmente vuote) non sono errori:
  // le tengo separate dagli avvisi, altrimenti il banner resta acceso per
  // sempre su cose che non vanno toccate e si smette di leggerlo.
  const avvisiAzione = useMemo(() => avvisiClassificazione.filter(a => a.tipo === "azione"), [avvisiClassificazione]);
  const avvisiNota   = useMemo(() => avvisiClassificazione.filter(a => a.tipo === "nota"), [avvisiClassificazione]);

  // Dry run della correzione automatica: la UI sa in anticipo quante e quali
  // correzioni verrebbero applicate, così il pulsante compare solo se serve.
  const correzioniSchema = useMemo(() => calcolaCorrezioniSchema(schema, contiMap), [schema, contiMap]);

  const rfDir = useMemo(() => schema ? rendicontoDiretto(schema, scritture) : null, [schema, scritture]);
  const rfRicl = useMemo(() => (schema && prospetti) ? rendicontoRiclassificato(schema, prospetti, mastrini, mastriniIniziali, contiMap) : null,
    [schema, prospetti, mastrini, mastriniIniziali, contiMap]);
  const rfInd = useMemo(() => schema ? rendicontoIndiretto(schema, mastrini, mastriniIniziali, contiMap) : null,
    [schema, mastrini, mastriniIniziali, contiMap]);

  if (!caricato || !schema) return <div className="empty-state">Caricamento schema…</div>;

  // ---------- mutatori ----------
  const clone = () => JSON.parse(JSON.stringify(statoRef.current.schema));
  const api = {
    updClasse: (p, id, patch) => { const s = clone(); const cl = s[p].find(c => c.id === id); if (cl) { Object.assign(cl, patch); aggiorna(s); } },
    delClasse: (p, id) => {
      const s0 = statoRef.current.schema;
      const cl = s0[p].find(c => c.id === id);
      const n = (cl?.voci || []).reduce((a, v) => a + (v.conti || []).length +
        (v.sottovoci || []).reduce((b, sv) => b + (sv.conti || []).length, 0), 0);
      if (!confirm(`Eliminare la macroclasse "${cl?.nome}"?${n ? ` ${n} conti torneranno non assegnati.` : ""}`)) return;
      const s = clone(); s[p] = s[p].filter(c => c.id !== id); aggiorna(s);
    },
    moveClasse: (p, id, dir) => {
      const s = clone(); const i = s[p].findIndex(c => c.id === id); const j = i + dir;
      if (i < 0 || j < 0 || j >= s[p].length) return;
      [s[p][i], s[p][j]] = [s[p][j], s[p][i]]; aggiorna(s);
    },
    addVoce: (p, clId) => { const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      cl.voci = cl.voci || []; cl.voci.push({ id: uid(), codice: "", nome: "Nuova voce", conti: [] }); aggiorna(s); },
    addSottosezione: (p, clId) => { const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      cl.voci = cl.voci || []; cl.voci.push({ id: uid(), tipo: "sottosezione", nome: "Nuova sotto-sezione" }); aggiorna(s); },
    updVoce: (p, clId, vId, patch) => { const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      const v = (cl.voci || []).find(x => x.id === vId); if (!v) return; Object.assign(v, patch); aggiorna(s); },
    delVoce: (p, clId, vId) => { const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      cl.voci = (cl.voci || []).filter(x => x.id !== vId); aggiorna(s); },
    moveVoce: (p, clId, vId, dir) => { const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      const i = cl.voci.findIndex(x => x.id === vId); const j = i + dir;
      if (i < 0 || j < 0 || j >= cl.voci.length) return;
      [cl.voci[i], cl.voci[j]] = [cl.voci[j], cl.voci[i]]; aggiorna(s); },
    // --- sotto-voci: il terzo livello dentro una voce (art. 2424) ---
    // Un contenitore con nome, numero e conti propri, che espone il suo subtotale
    // e confluisce nel totale della voce che lo contiene.
    addSottoVoce: (p, clId, vId) => { const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      const v = (cl.voci || []).find(x => x.id === vId); if (!v) return;
      v.sottovoci = v.sottovoci || [];
      v.sottovoci.push({ id: uid(), codice: String(v.sottovoci.length + 1), nome: "Nuova sotto-voce", conti: [] });
      aggiorna(s); },
    updSottoVoce: (p, clId, vId, svId, patch) => { const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      const v = (cl.voci || []).find(x => x.id === vId); if (!v) return;
      const sv = (v.sottovoci || []).find(x => x.id === svId); if (!sv) return;
      Object.assign(sv, patch); aggiorna(s); },
    delSottoVoce: (p, clId, vId, svId) => { const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      const v = (cl.voci || []).find(x => x.id === vId); if (!v) return;
      const sv = (v.sottovoci || []).find(x => x.id === svId);
      // i conti della sotto-voce non vanno persi: tornano agganciati alla voce
      if (sv && (sv.conti || []).length) {
        v.conti = v.conti || [];
        sv.conti.forEach(x => { if (!v.conti.some(y => Number(y.c) === Number(x.c))) v.conti.push(x); });
      }
      v.sottovoci = (v.sottovoci || []).filter(x => x.id !== svId); aggiorna(s); },
    moveSottoVoce: (p, clId, vId, svId, dir) => { const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      const v = (cl.voci || []).find(x => x.id === vId); if (!v) return;
      const i = (v.sottovoci || []).findIndex(x => x.id === svId); const j = i + dir;
      if (i < 0 || j < 0 || j >= v.sottovoci.length) return;
      [v.sottovoci[i], v.sottovoci[j]] = [v.sottovoci[j], v.sottovoci[i]]; aggiorna(s); },
    // Sposta un conto gia' agganciato alla voce dentro una sua sotto-voce
    // (svId null = riporta il conto al livello della voce).
    spostaContoInSottoVoce: (p, clId, vId, codice, svId) => {
      const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      const v = (cl.voci || []).find(x => x.id === vId); if (!v) return;
      const cod = Number(codice);
      let riga = (v.conti || []).find(x => Number(x.c) === cod);
      (v.sottovoci || []).forEach(sv => { const t = (sv.conti || []).find(x => Number(x.c) === cod); if (t) riga = t; });
      if (!riga) return;
      v.conti = (v.conti || []).filter(x => Number(x.c) !== cod);
      (v.sottovoci || []).forEach(sv => { sv.conti = (sv.conti || []).filter(x => Number(x.c) !== cod); });
      if (svId) {
        const sv = (v.sottovoci || []).find(x => x.id === svId); if (!sv) return;
        sv.conti = sv.conti || []; sv.conti.push(riga);
      } else { v.conti = v.conti || []; v.conti.push(riga); }
      aggiorna(s); },
    // Aggancia un conto nuovo direttamente dentro una sotto-voce, in una sola
    // scrittura (invece di aggiungerlo alla voce e poi spostarlo).
    addContoInSottoVoce: (p, clId, vId, svId, codice, segno) => { if (!codice) return;
      const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      const v = (cl.voci || []).find(x => x.id === vId); if (!v) return;
      const sv = (v.sottovoci || []).find(x => x.id === svId); if (!sv) return;
      const cod = Number(codice);
      const gia = (v.conti || []).some(x => Number(x.c) === cod) ||
                  (v.sottovoci || []).some(q => (q.conti || []).some(x => Number(x.c) === cod));
      if (gia) return;
      sv.conti = sv.conti || [];
      sv.conti.push({ c: cod, s: Number(segno) || 1 }); aggiorna(s); },
    addConto: (p, clId, vId, codice, segno) => { if (!codice) return;
      const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      const v = (cl.voci || []).find(x => x.id === vId); if (!v) return;
      v.conti = v.conti || [];
      if (v.conti.some(x => Number(x.c) === Number(codice))) return;
      v.conti.push({ c: Number(codice), s: Number(segno) || 1 }); aggiorna(s); },
    // updConto/delConto agiscono sul conto ovunque si trovi dentro la voce:
    // agganciato direttamente o dentro una delle sue sotto-voci.
    updConto: (p, clId, vId, codice, segno) => { const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      const v = (cl.voci || []).find(x => x.id === vId); if (!v) return;
      const liste = [v.conti || [], ...(v.sottovoci || []).map(sv => sv.conti || [])];
      const x = liste.flat().find(y => Number(y.c) === Number(codice)); if (!x) return;
      x.s = Number(segno); aggiorna(s); },
    delConto: (p, clId, vId, codice) => { const s = clone(); const cl = s[p].find(c => c.id === clId); if (!cl) return;
      const v = (cl.voci || []).find(x => x.id === vId); if (!v) return;
      v.conti = (v.conti || []).filter(y => Number(y.c) !== Number(codice));
      (v.sottovoci || []).forEach(sv => { sv.conti = (sv.conti || []).filter(y => Number(y.c) !== Number(codice)); });
      aggiorna(s); },
    updArea: (id, patch) => { const s = clone(); const a = s.rf.aree.find(x => x.id === id); if (a) { Object.assign(a, patch); aggiorna(s); } },
    delArea: (id) => { if (!confirm("Eliminare l'area?")) return;
      const s = clone(); s.rf.aree = s.rf.aree.filter(x => x.id !== id); aggiorna(s); },
    moveArea: (id, dir) => { const s = clone(); const i = s.rf.aree.findIndex(x => x.id === id); const j = i + dir;
      if (i < 0 || j < 0 || j >= s.rf.aree.length) return;
      [s.rf.aree[i], s.rf.aree[j]] = [s.rf.aree[j], s.rf.aree[i]]; aggiorna(s); },
    addVoceArea: (areaId) => { const s = clone(); const a = s.rf.aree.find(x => x.id === areaId); if (!a) return;
      a.voci = a.voci || []; a.voci.push({ id: uid(), codice: "", nome: "Nuova sottovoce", categorie: [] }); aggiorna(s); },
    updVoceArea: (areaId, voceId, patch) => { const s = clone(); const a = s.rf.aree.find(x => x.id === areaId); if (!a) return;
      const v = (a.voci || []).find(x => x.id === voceId); if (!v) return; Object.assign(v, patch); aggiorna(s); },
    delVoceArea: (areaId, voceId) => { const s = clone(); const a = s.rf.aree.find(x => x.id === areaId); if (!a) return;
      a.voci = (a.voci || []).filter(x => x.id !== voceId); aggiorna(s); },
    moveVoceArea: (areaId, voceId, dir) => { const s = clone(); const a = s.rf.aree.find(x => x.id === areaId); if (!a) return;
      const i = a.voci.findIndex(x => x.id === voceId); const j = i + dir;
      if (i < 0 || j < 0 || j >= a.voci.length) return;
      [a.voci[i], a.voci[j]] = [a.voci[j], a.voci[i]]; aggiorna(s); },
    addCatVoce: (areaId, voceId, cat) => { if (!cat) return; const s = clone();
      // assegnazione singola: la categoria viene tolta da qualunque altra sottovoce prima di aggiungerla qui
      s.rf.aree.forEach(a => (a.voci || []).forEach(v => { v.categorie = (v.categorie || []).filter(c => c !== cat); }));
      const a = s.rf.aree.find(x => x.id === areaId); if (!a) return;
      const v = (a.voci || []).find(x => x.id === voceId); if (!v) return;
      v.categorie = [...(v.categorie || []), cat].sort(); aggiorna(s); },
    delCatVoce: (areaId, voceId, cat) => { const s = clone(); const a = s.rf.aree.find(x => x.id === areaId); if (!a) return;
      const v = (a.voci || []).find(x => x.id === voceId); if (!v) return;
      v.categorie = (v.categorie || []).filter(c => c !== cat); aggiorna(s); },
    setNatura: (cod, n) => { const s = clone(); s.rf.natura = s.rf.natura || {}; s.rf.natura[String(cod)] = n; aggiorna(s); },
  };

  const contiOrdinati = [...mastrini].sort((a, b) => a.codice - b.codice);
  const assegnateAltrove = new Set();
  (schema.rf?.aree || []).forEach(a => (a.voci || []).forEach(v => (v.categorie || []).forEach(c => assegnateAltrove.add(c))));

  const resetSchema = () => {
    if (!confirm("Ripristinare lo schema di default? Tutte le assegnazioni verranno perse.")) return;
    aggiorna(schemaDefault(), []);
    onToast && onToast("Schema reimpostato");
  };
  const autoMappa = () => {
    const s = proponiCategorieRF(proponiMappatura(statoRef.current.schema, conti), categorieTutte, categorie);
    aggiorna(s);
    onToast && onToast("Mappatura proposta per i conti e le categorie non ancora assegnati");
  };
  const caricaVociConsigliateRF = () => {
    const s = clone();
    const struttura = [
      { codice: "A", voci: ["Incassi da lavoro", "Incassi da famiglia e parenti", "Rimborsi ricevuti", "Incassi diversi",
                             "Spese per lavoro e studio", "Carburante e trasporti", "Commissioni e spese bancarie",
                             "Spese diverse", "Imposte pagate", "Altri pagamenti"] },
      { codice: "B", voci: ["Beni durevoli - Acquisti", "Beni durevoli - Vendite",
                             "Investimenti finanziari - Versamenti", "Investimenti finanziari - Disinvestimenti"] },
      { codice: "C", voci: ["Prestiti ricevuti", "Prestiti rimborsati", "Apporti e prelievi personali"] },
    ];
    s.rf.aree = s.rf.aree || [];
    struttura.forEach((def, i) => {
      let area = s.rf.aree.find(a => a.codice === def.codice) || s.rf.aree[i];
      if (!area) { area = { id: uid(), codice: def.codice, nome: "", voci: [] }; s.rf.aree.push(area); }
      area.voci = area.voci || [];
      def.voci.forEach(nome => {
        if (!area.voci.some(v => v.nome === nome)) area.voci.push({ id: uid(), codice: "", nome, categorie: [] });
      });
    });
    rinumeraVociRF(s);
    aggiorna(s);
    onToast && onToast("Sottovoci consigliate aggiunte e rinumerate: assegna ora le categorie a ciascuna");
  };
  const rinumeraVociRFAzione = () => {
    const s = rinumeraVociRF(clone());
    aggiorna(s);
    onToast && onToast("Sottovoci del rendiconto rinumerate 1..n per ogni area");
  };

  // ---------- Correzione automatica degli avvisi di classificazione ----------
  // Sposta le voci nella casella che le descrive. Nessun importo viene toccato:
  // conti e categorie restano gli stessi, cambia solo dove vengono esposti,
  // quindi totali, risultato e quadrature non si muovono. Una sola scrittura
  // dello schema su Firebase, poi l'app si riallinea da sola.
  const correggiSchemaAutomaticamente = () => {
    const { schema: corretto, azioni } = correzioniSchema;
    if (!azioni.length) {
      onToast && onToast("Niente da correggere: la classificazione è già coerente");
      return;
    }
    if (!confirm(`Applicare ${azioni.length} correzion${azioni.length === 1 ? "e" : "i"} allo schema?\n\n${azioni.join("\n")}\n\nNessun importo viene modificato: cambia solo la voce in cui ciascun saldo viene esposto. Risultato d'esercizio, totali e quadrature restano identici.`)) return;
    aggiorna(corretto);
    onToast && onToast(`${azioni.length} correzion${azioni.length === 1 ? "e applicata" : "i applicate"} allo schema`);
  };
  const escludiConto = (cod) => aggiorna(statoRef.current.schema, [...new Set([...esclusi, Number(cod)])]);
  const reincludiConto = (cod) => aggiorna(statoRef.current.schema, esclusi.filter(x => Number(x) !== Number(cod)));

  // ---------- export PDF (stessa grafica della pagina Export) ----------
  const esportaPDF = () => generaPdfProspettiSchema(prospetti, rfDir, rfInd, stagione);

  // ---------- render dei prospetti ----------
  const rigaConto = (d, indent) => (
    <tr key={d.c} style={{ fontSize: 12, color: "var(--ink-2)" }}>
      <td style={{ paddingLeft: indent }}>
        <span className="mono">{String(d.c).padStart(2, "0")}</span> {d.nome}
        {d.valore < 0 && <span style={{ color: "var(--danger)" }}> (in rettifica)</span>}
      </td>
      <td className="num">{fmtP(d.valore)}</td>
    </tr>
  );
  const rigaVoce = (v) => {
    const sv = v.sottovoci || [];
    const apribile = v.dettaglio.length > 0 || sv.length > 0;
    return (
      <React.Fragment key={v.id}>
        <tr>
          <td style={{ paddingLeft: 26, cursor: apribile ? "pointer" : "default" }}
              onClick={() => apribile && setEspansi(p => ({ ...p, [v.id]: !p[v.id] }))}>
            {apribile && <span style={{ color: "var(--ink-3)", marginRight: 6 }}>{espansi[v.id] ? "▾" : "▸"}</span>}
            {v.codice ? v.codice + ". " : ""}{v.nome}
            {v.speciale === "risultato" && <span style={{ color: "var(--ink-3)", fontSize: 11 }}> (da CE)</span>}
          </td>
          <td className="num">{fmtP(v.valore, 0)}</td>
        </tr>
        {/* le sotto-voci restano sempre visibili col loro subtotale: sono parte
            del prospetto, non un dettaglio da aprire. I conti sotto, invece, si
            mostrano solo quando la voce e' espansa. */}
        {sv.map(x => (
          <React.Fragment key={x.id}>
            <tr style={{ fontSize: 12.5 }}>
              <td style={{ paddingLeft: 44, color: "var(--ink-2)" }}>
                {x.codice ? x.codice + ") " : ""}{x.nome}
              </td>
              <td className="num" style={{ color: "var(--ink-2)" }}>{fmtP(x.valore, 0)}</td>
            </tr>
            {espansi[v.id] && (x.dettaglio || []).map(d => rigaConto(d, 68))}
          </React.Fragment>
        ))}
        {espansi[v.id] && v.dettaglio.map(d => rigaConto(d, 52))}
      </React.Fragment>
    );
  };
  // le "sotto-sezioni" sono voci marcatore (v.tipo === "sottosezione"): compaiono come
  // sottotitolo nell'elenco, senza importo, e non entrano nei totali (calcolaProspetti
  // restituisce loro valore 0 / dettaglio vuoto).
  const righeVociConSottosezioni = (voci) => (voci || []).map(v => (
    v.tipo === "sottosezione" ? (
      <tr key={v.id}>
        <td colSpan={2} style={{ paddingLeft: 20, fontSize: 11, fontWeight: 700, color: "var(--ink-3)",
                                  textTransform: "uppercase", letterSpacing: 0.4, paddingTop: 10 }}>
          {v.nome}
        </td>
      </tr>
    ) : rigaVoce(v)
  ));

  const diffRF = Math.round((rfInd.variazione - rfDir.variazione) * 100) / 100;

  return (
    <div className="sb-page">
      <div className="page-head">
        <div>
          <h2>Schema di Bilancio</h2>
          <div className="sub">
            Composizione dei prospetti civilistici · {stagione}
            {salvando && <span style={{ color: "var(--ink-3)" }}> · salvataggio…</span>}
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          <select className="sb-periodo" value={alData} onChange={e => setAlData(e.target.value)} title="Periodo: dall'apertura fino a questa data">
            <option value="">Situazione attuale (tutte le scritture)</option>
            {fineMesi.map(d => <option key={d} value={d}>Al {fmtDate(d)}</option>)}
          </select>
          <button className="btn ghost" onClick={autoMappa}>Proponi mappatura</button>
          <button className="btn ghost" onClick={resetSchema}>Ripristina default</button>
          <button className="btn accent" onClick={esportaPDF}>↧ PDF prospetti</button>
        </div>
      </div>

      <div className="kpi-grid" style={{ marginBottom: 16 }}>
        <div className="kpi">
          <div className="label">Totale Attivo</div>
          <div className="value">{fmt0Euro(prospetti.totAttivo)}</div>
        </div>
        <div className="kpi">
          <div className="label">Totale Passivo e PN</div>
          <div className="value">{fmt0Euro(prospetti.totPassivo)}</div>
        </div>
        <div className="kpi">
          <div className="label">Risultato d'esercizio</div>
          <div className="value" style={{ color: prospetti.risultato >= 0 ? "var(--accent)" : "var(--danger)" }}>
            {fmt0Euro(prospetti.risultato)}
          </div>
        </div>
        <div className="kpi">
          <div className="label">Quadratura</div>
          <div className="value" style={{ color: Math.abs(prospetti.sbilancio) < 0.01 ? "var(--accent)" : "var(--danger)" }}>
            {Math.abs(prospetti.sbilancio) < 0.01 ? "OK" : fmt0Euro(prospetti.sbilancio)}
          </div>
          <div className="hint">
            {controlli.mancanti.length > 0 && `${controlli.mancanti.length} conti non assegnati`}
            {controlli.mancanti.length > 0 && controlli.doppi.length > 0 && " · "}
            {controlli.doppi.length > 0 && `${controlli.doppi.length} doppi`}
            {controlli.mancanti.length === 0 && controlli.doppi.length === 0 && "Tutti i conti mappati"}
          </div>
        </div>
      </div>

      <div className="sb-tabs">
        {[["prospetti", "Anteprima prospetti"], ["sp", "Struttura SP"], ["ce", "Struttura CE"], ["rf", "Struttura RF"], ["rfr", "RF Riclassificato"],
          ["controlli", `Controlli${controlli.mancanti.length + controlli.doppi.length > 0 ? " ⚠" : ""}`]]
          .map(([k, label]) => (
            <button key={k} className={"btn " + (tab === k ? "" : "ghost")} onClick={() => setTab(k)}>{label}</button>
          ))}
      </div>

      {avvisiAzione.length > 0 && ["sp", "ce", "rf", "prospetti"].includes(tab) && (
        <div style={{ padding: "12px 16px", marginBottom: 16, borderRadius: 8,
                      background: "#fff8e7", border: "1px solid #f0d860", color: "#7a5d00", fontSize: 13 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
            <div style={{ flex: 1, minWidth: 260 }}>
              <strong>Da sistemare ({avvisiAzione.length}).</strong>
              <div style={{ fontSize: 12, marginTop: 4 }}>
                Il bilancio quadra lo stesso: sono voci messe in una casella che non le descrive.
              </div>
            </div>
            {correzioniSchema.azioni.length > 0 && (
              <button className="btn accent" onClick={correggiSchemaAutomaticamente}
                      title={correzioniSchema.azioni.join("\n")}>
                🔧 Correggi automaticamente ({correzioniSchema.azioni.length})
              </button>
            )}
          </div>
          <ul style={{ margin: "8px 0 0", paddingLeft: 18, lineHeight: 1.5 }}>
            {avvisiAzione.map((a, i) => (
              <li key={i} style={{ fontWeight: a.grave ? 600 : 400, marginBottom: 3 }}>{a.testo}</li>
            ))}
          </ul>
          {correzioniSchema.azioni.length < avvisiAzione.length && (
            <div style={{ fontSize: 11.5, marginTop: 8, opacity: 0.85 }}>
              Il pulsante ne sistema {correzioniSchema.azioni.length}: il resto richiede una scelta tua.
            </div>
          )}
        </div>
      )}

      {avvisiAzione.length === 0 && avvisiNota.length > 0 && ["sp", "ce", "rf", "prospetti"].includes(tab) && (
        <details style={{ marginBottom: 16, fontSize: 12.5, color: "var(--ink-2)",
                          background: "var(--accent-soft)", border: "1px solid #c8d8ce", borderRadius: 8, padding: "10px 14px" }}>
          <summary style={{ cursor: "pointer", color: "var(--accent-ink)", fontWeight: 600 }}>
            ✓ Classificazione coerente · {avvisiNota.length} sottovoci vuote per scelta
          </summary>
          <div style={{ fontSize: 12, margin: "8px 0 6px" }}>
            Sono la struttura civilistica del rendiconto: restano a zero finché non c'è un movimento di quel tipo.
            Nessuna azione richiesta. Se sai di non usarle mai, puoi eliminarle qui sotto.
          </div>
          <ul style={{ margin: 0, paddingLeft: 18, lineHeight: 1.5 }}>
            {avvisiNota.map((a, i) => <li key={i} style={{ marginBottom: 2 }}>{a.testo}</li>)}
          </ul>
        </details>
      )}

      {(tab === "sp" || tab === "ce") && (
        <div>
          <div style={{ fontSize: 12.5, color: "var(--ink-2)", marginBottom: 12, lineHeight: 1.55 }}>
            Ogni voce raccoglie uno o più conti. Il pulsante <b>+ / −</b> su ciascun conto decide se il saldo
            entra col <b>segno naturale</b> o <b>invertito</b>: i fondi ammortamento vanno agganciati alla stessa
            voce del cespite col segno naturale, perché avendo saldo avere si deducono da soli e la voce espone il netto.
            Un conto già assegnato altrove non compare più nell'elenco "+ aggiungi conto…": per inserirlo comunque
            una seconda volta spunta <b>Forza doppio</b> accanto al menu della voce.
          </div>
          {schema[tab].map(cl => (
            <SBEditorClasse key={cl.id} p={tab} cl={cl} api={api}
                            contiMap={contiMap} contiOrdinati={contiOrdinati} assegnati={controlli.assegnati} />
          ))}
          <button className="btn" onClick={() => {
            const s = clone();
            s[tab].push(tab === "sp"
              ? { id: uid(), codice: "", nome: "Nuova macroclasse", lato: "attivo", voci: [] }
              : { id: uid(), codice: "", nome: "Nuova macroclasse", segno: 1, voci: [] });
            aggiorna(s);
          }}>+ Macroclasse</button>
        </div>
      )}

      {tab === "rf" && (
        <div>
          <div style={{ fontSize: 12.5, color: "var(--ink-2)", marginBottom: 12, lineHeight: 1.55 }}>
            Il <b>metodo diretto</b> classifica i flussi di cassa per categoria di movimento: ogni area può
            avere più <b>sottovoci</b> (come le macroclassi di SP/CE), e ogni sottovoce raccoglie una o più
            categorie di movimento — così eviti di riversare tutte le categorie in blocco sotto le 3 aree
            principali. Il <b>metodo indiretto</b> parte dal risultato e usa le variazioni dei saldi
            patrimoniali, per cui ha bisogno di sapere la <b>natura</b> di ciascun conto. Le due strade
            arrivano alla stessa variazione di liquidità: se non coincidono per area, una categoria è
            classificata male.
          </div>

          {(schema.rf?.aree || []).map(a => (
            <SBEditorArea key={a.id} area={a} api={api}
                          categorieTutte={categorieTutte} assegnateAltrove={assegnateAltrove} />
          ))}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button className="btn" onClick={() => {
              const s = clone(); s.rf.aree.push({ id: uid(), codice: "", nome: "Nuova area", voci: [] }); aggiorna(s);
            }}>+ Area</button>
            <button className="btn ghost" onClick={caricaVociConsigliateRF} title="Aggiunge alle 3 aree le sottovoci tipiche di una contabilità personale, senza toccare quelle già presenti">
              + Carica sottovoci consigliate
            </button>
            <button className="btn ghost" onClick={rinumeraVociRFAzione} title="Assegna i numeri 1..n alle sottovoci di ogni area, nell'ordine in cui sono elencate: nessuna voce resta senza numero nel PDF">
              ↻ Rinumera sottovoci
            </button>
          </div>

          {rfDir.nonAssegnate.length > 0 && (
            <div className="card" style={{ marginTop: 16, borderLeft: "3px solid var(--danger)" }}>
              <div className="card-title">Categorie non assegnate ({rfDir.nonAssegnate.length})</div>
              <div style={{ fontSize: 12, color: "var(--ink-2)", margin: "8px 0" }}>
                Confluiscono per default nella prima area. Assegnale esplicitamente per un rendiconto corretto.
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {rfDir.nonAssegnate.map(c => (
                  <span key={c} style={{ fontSize: 12, background: "#fbecec", border: "1px solid var(--rule-2)",
                                         borderRadius: 20, padding: "3px 8px" }}>{c}</span>
                ))}
              </div>
            </div>
          )}

          {Math.abs(rfDir.differenzaNascosta) > 0.005 && (
            <div className="card" style={{ marginTop: 16, borderLeft: "3px solid var(--danger)" }}>
              <div className="card-title">Differenza sui conti di liquidità ({fmt(rfDir.differenzaNascosta)})</div>
              <div style={{ fontSize: 12, color: "var(--ink-2)", margin: "8px 0" }}>
                La variazione delle disponibilità liquide calcolata per categoria non coincide con quella dei conti
                di liquidità. La differenza è esposta nella prima area così le Disponibilità liquide finali restano
                corrette: di solito dipende da una scrittura di apertura con data sbagliata.
              </div>
            </div>
          )}

          <div className="card" style={{ marginTop: 16 }}>
            <div className="card-title">Natura dei conti (metodo indiretto)</div>
            <div style={{ fontSize: 12, color: "var(--ink-2)", margin: "8px 0" }}>
              Serve a separare il costo storico delle immobilizzazioni (flusso di investimento) dai fondi
              ammortamento (rettifica non monetaria che torna nella gestione operativa).
            </div>
            <table style={{ width: "100%" }}>
              <thead><tr><th>Cod.</th><th>Conto</th><th className="num">Saldo</th><th>Natura</th></tr></thead>
              <tbody>
                {contiOrdinati.filter(m => Math.abs(m.saldo) > 0.005).map(m => (
                  <tr key={m.codice}>
                    <td className="mono">{String(m.codice).padStart(2, "0")}</td>
                    <td>{(m.nome || "").trim()}</td>
                    <td className="num">{fmtP(m.saldo)}</td>
                    <td>
                      <select value={(schema.rf?.natura || {})[String(m.codice)] || naturaAuto(contiMap[m.codice])}
                              onChange={e => api.setNatura(m.codice, e.target.value)}
                              style={{ fontSize: 12, width: "100%", maxWidth: 240 }}>
                        {SB_NATURE.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
                      </select>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab === "rfr" && <SBRfRiclassificato R={rfRicl} />}

      {tab === "prospetti" && (
        <div style={{ display: "grid", gap: 18 }}>
          <div className="card">
            <div className="card-title">Stato Patrimoniale</div>
            {["attivo", "passivo"].map(lato => (
              <div key={lato} style={{ marginTop: 14 }}>
                <div style={{ fontFamily: "'Fraunces',serif", fontSize: 15, marginBottom: 6 }}>
                  {lato === "attivo" ? "ATTIVO" : "PASSIVO E PATRIMONIO NETTO"}
                </div>
                <table style={{ width: "100%" }}>
                  <tbody>
                    {prospetti.sp.filter(c => c.lato === lato).map(cl => (
                      <React.Fragment key={cl.id}>
                        <tr style={{ background: "var(--panel-2)" }}>
                          <td style={{ fontWeight: 700 }}>{cl.codice ? cl.codice + ") " : ""}{cl.nome}</td>
                          <td className="num" style={{ fontWeight: 700 }}>{fmtP(cl.totale, 0)}</td>
                        </tr>
                        {righeVociConSottosezioni(cl.voci)}
                      </React.Fragment>
                    ))}
                    <tr style={{ borderTop: "2px solid var(--ink)" }}>
                      <td style={{ fontFamily: "'Fraunces',serif", fontSize: 14 }}>
                        {lato === "attivo" ? "TOTALE ATTIVO" : "TOTALE PASSIVO E PN"}
                      </td>
                      <td className="num" style={{ fontWeight: 700, fontSize: 14 }}>
                        {fmtP((lato === "attivo" ? prospetti.totAttivo : prospetti.totPassivo), 0)}
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            ))}
            {Math.abs(prospetti.sbilancio) >= 0.01 && (
              <div style={{ marginTop: 10, color: "var(--danger)", fontSize: 13 }}>
                ⚠ Sbilancio di {fmt0Euro(prospetti.sbilancio)} tra attivo e passivo. Vedi la scheda Controlli.
              </div>
            )}
          </div>

          <div className="card">
            <div className="card-title">Conto Economico</div>
            <table style={{ width: "100%", marginTop: 10 }}>
              <tbody>
                {prospetti.ce.map(cl => (
                  <React.Fragment key={cl.id}>
                    <tr style={{ background: "var(--panel-2)" }}>
                      <td style={{ fontWeight: 700 }}>
                        {cl.codice ? cl.codice + ") " : ""}{cl.nome}
                        <span style={{ color: "var(--ink-3)", fontWeight: 400, fontSize: 11 }}> {cl.segno >= 0 ? "(+)" : "(−)"}</span>
                      </td>
                      <td className="num" style={{ fontWeight: 700 }}>{fmtP(cl.totale, 0)}</td>
                    </tr>
                    {righeVociConSottosezioni(cl.voci)}
                  </React.Fragment>
                ))}
                <tr style={{ borderTop: "2px solid var(--ink)" }}>
                  <td style={{ fontFamily: "'Fraunces',serif", fontSize: 14 }}>RISULTATO D'ESERCIZIO</td>
                  <td className="num" style={{ fontWeight: 700, fontSize: 14, color: prospetti.risultato >= 0 ? "var(--accent)" : "var(--danger)" }}>
                    {fmtP(prospetti.risultato, 0)}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div className="card">
            <div className="card-title">Rendiconto Finanziario · metodo diretto</div>
            <table style={{ width: "100%", marginTop: 10 }}>
              <tbody>
                {rfDir.aree.map(a => (
                  <React.Fragment key={a.id}>
                    <tr style={{ background: "var(--panel-2)" }}>
                      <td style={{ fontWeight: 700 }}>{a.codice ? a.codice + ") " : ""}{a.nome}</td>
                      <td className="num" style={{ fontWeight: 700 }}>{fmtP(a.totale, 0)}</td>
                    </tr>
                    {(a.voci || []).map(v => (
                      <React.Fragment key={v.id}>
                        <tr>
                          <td style={{ paddingLeft: 18, fontWeight: 600, fontStyle: v.virtuale ? "italic" : "normal",
                                       color: v.virtuale ? "var(--danger)" : "inherit" }}>
                            {v.codice ? v.codice + ". " : ""}{v.nome}
                          </td>
                          <td className="num" style={{ fontWeight: 600 }}>{fmtP(v.totale, 0)}</td>
                        </tr>
                        {(v.righe || []).map(r => (
                          <tr key={r.cat}>
                            <td style={{ paddingLeft: 34, fontSize: 12.5, color: "var(--ink-2)" }}>{r.cat}</td>
                            <td className="num" style={{ fontSize: 12.5, color: r.val < 0 ? "var(--danger)" : "var(--ink-2)" }}>{fmtP(r.val, 0)}</td>
                          </tr>
                        ))}
                      </React.Fragment>
                    ))}
                    {(a.voci || []).length === 0 && (
                      <tr><td style={{ paddingLeft: 26, color: "var(--ink-3)", fontSize: 12 }}>Nessuna sottovoce</td><td className="num">—</td></tr>
                    )}
                  </React.Fragment>
                ))}
                <tr style={{ borderTop: "2px solid var(--ink)" }}>
                  <td style={{ fontFamily: "'Fraunces',serif", fontSize: 14 }}>VARIAZIONE DISPONIBILITÀ LIQUIDE</td>

const invB64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const invUnb64u = s => { s=String(s).replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; };
const invRnd = n => crypto.getRandomValues(new Uint8Array(n));
async function invHash(pin, salt){
  const d=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+'|'+pin));
  return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('');

const invBioOk = () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);

async function invPrezzoBI(codice){

const invGruppo = p => (p && p.gruppo) || (Number(p&&p.conto)===77?'Fondi Azimut':(Number(p&&p.conto)===11?'Fondi BPER':'Altri'));
const INV_COL = ['#1f4f8f','#2f7d4f','#b7791f','#7b4fa0','#c0433f','#2a8b9c','#6b7280','#a3542c','#4c7cc4','#8fae3d'];
const INV_MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const invLbl = d => { if(!d) return ''; const [y,m,g]=d.split('-').map(Number);
  const fineMese=new Date(Date.UTC(y,m,0)).getUTCDate()===g;
  return fineMese ? INV_MESI[m-1]+' '+String(y).slice(2) : g+' '+INV_MESI[m-1]; };
/* date del grafico: fine di ogni mese dal primo movimento a oggi + le date dei valori inseriti */
function invDates(movs, vals){
  const oggi=todayISO(); const ds=new Set();
  const dd=[...movs.map(m=>m.data),...vals.map(v=>v.data)].filter(Boolean).sort();
  if(!dd.length) return [oggi];
  let [y,m]=dd[0].slice(0,7).split('-').map(Number);
  for(let i=0;i<240;i++){
    const fine=new Date(Date.UTC(y,m,0)).toISOString().slice(0,10);
    ds.add(fine>oggi?oggi:fine); if(fine>=oggi) break;
    m++; if(m>12){ m=1; y++; }
  }
  vals.forEach(v=>{ if(v.data<=oggi) ds.add(v.data); });
  return [...ds].sort();
}
/* per ogni data: versato cumulato e valore (ultimo valore inserito + versamenti successivi, altrimenti il versato) */
function invSerie(movs, vals, dates, cut){
  const mv=[...movs].sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const vv=[...vals].sort((a,b)=>a.data.localeCompare(b.data));
  return dates.map(d=>{
    const vers=r2(mv.filter(m=>m.data<=d).reduce((s,m)=>s+m.imp,0));
    const lv=vv.filter(v=>v.data<=d).pop();
    // dopo l'ultimo valore inserito si aggiungono solo i versamenti veri successivi (non l'allineamento al costo di carico)
    const val=lv ? r2((Number(lv.valore)||0)+mv.filter(m=>!m.adj&&m.data>lv.data&&(!cut||m.data>cut)&&m.data<=d).reduce((s,m)=>s+m.imp,0)) : vers;
    return {d,vers,val};
  });
}
