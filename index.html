const anMappa = (campi) => { const m = {}; campi.forEach(c => { m[anKey(c.nome)] = c.nome; }); return m; };

// ---------- lettura di numeri e date da file ----------
function anNumero(v) {
  if (typeof v === "number") return isFinite(v) ? v : null;
  if (v instanceof Date || v === null || v === undefined) return null;
  let s = String(v).replace(/[€\s ]/g, "");
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.includes(",") && s.includes(".")) {
    if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
  } else if (s.includes(",")) {
    if ((s.match(/,/g) || []).length > 1) return null;
    s = s.replace(",", ".");
  } else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return null;
  const n = Number(s);
  return isFinite(n) ? (neg ? -n : n) : null;
}
function anDataISO(v) {
  if (v instanceof Date) {
    if (isNaN(v)) return null;
    const t = v.getTime() - v.getTimezoneOffset() * 60000;
    return new Date(Math.round(t / 86400000) * 86400000).toISOString().slice(0, 10);
  }
  if (typeof v !== "string") return null;
  const s = v.trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  let y, mo, d;
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else {
    m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})$/.exec(s);
    if (!m) return null;
    d = +m[1]; mo = +m[2]; y = +m[3]; if (y < 100) y += 2000;
  }
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}
function anParseCSV(testo) {
  const txt = String(testo || "").replace(/^﻿/, "");
  const prima = txt.split(/\r?\n/)[0] || "";
  const conta = (ch) => prima.split(ch).length - 1;
  const sep = [";", ",", "\t"].sort((a, b) => conta(b) - conta(a))[0];
  const righe = [];
  let riga = [], campo = "", inQ = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (inQ) {
      if (c === '"') { if (txt[i + 1] === '"') { campo += '"'; i++; } else inQ = false; }
      else campo += c;
    } else if (c === '"') inQ = true;
    else if (c === sep) { riga.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && txt[i + 1] === "\n") i++;
      riga.push(campo); righe.push(riga); riga = []; campo = "";
    } else campo += c;
  }
  if (campo !== "" || riga.length) { riga.push(campo); righe.push(riga); }
  return righe;
}
function anTipoColonna(valori) {
  const pieni = valori.filter(v => v !== "" && v !== null && v !== undefined);
  if (!pieni.length) return "testo";
  if (pieni.every(v => anDataISO(v) !== null)) return "data";
  const num = pieni.filter(v => anNumero(v) !== null).length;
  return num / pieni.length >= 0.9 ? "numero" : "testo";
}

// ---------- costruzione delle fonti ----------
const anNomeConto = (cod) => (cod === null || cod === undefined || cod === "") ? ""
  : `${String(cod).padStart(2, "0")} · ${String((contoByCode[cod] && contoByCode[cod].nome) || ("Conto " + cod)).trim()}`;
const AN_SEZ_LBL = { entrata: "Entrate", uscita: "Uscite", investimento: "Investimenti", interno: "Interne (fuori flusso)" };
const AN_ORIGINE = { manuale: "Manuale", seed: "Libro giornale iniziale", import: "Import", importata: "Import" };

/* Anni presenti nelle scritture (per i chip della dashboard) */
function anAnniDisponibili(scritture) {
  const s = new Set();
  (scritture || []).forEach(x => { const a = anAnnoDa(x && x.data); if (a) s.add(a); });
  return [...s].sort();
}

function anCostruisciFonti({ scritture, cespiti, budgets, categorie }, tabelle, anni) {
  const mov = [], scr = [], cesp = [], bud = [];
  const annoOk = (a) => !anni || !anni.length || !a || anni.includes(a);
  const catSez = {}; (categorie || []).forEach(c => { if (c) catSez[nk(c.nome)] = c.sezione; });
  const liq = LIQ_CODES || [];
  (scritture || []).forEach(s => {
    if (!s) return;
    const data = s.data || "";
    const anno = anAnnoDa(data);
    if (!annoOk(anno)) return;
    const righe = s.righe || [];
    const ap = /apertur/i.test(s.descr || "");
    const cat = catOf(s) || "";
    const base = { "Anno": anno, "Data": data, "Anno-mese": data.slice(0, 7), "Mese": anMeseDa(data) };
    // --- righe del libro giornale ---
    righe.forEach(r => {
      const c = contoByCode[r.c] || {};
      const dare = Number(r.d) || 0, avere = Number(r.a) || 0;
      scr.push({ ...base, "Conto": anNomeConto(r.c), "Categoria conto": c.categoria || "", "Prospetto": c.prospetto || "",
        "Categoria": cat, "Descrizione": s.descr || "", "Tipo scrittura": anCap(s.tipo === "liquidita" ? "liquidità" : (s.tipo || "")),
        "Apertura": ap ? "Sì" : "No", "Dare": dare, "Avere": avere, "Saldo (Dare − Avere)": dare - avere, "Saldo (Avere − Dare)": avere - dare });
    });
    // --- movimento di cassa (stessa logica del Rendiconto finanziario) ---
    const liqLines = righe.filter(r => liq.includes(r.c));
    if (!liqLines.length) return;
    const dIn = r2(liqLines.reduce((x, r) => x + (r.d || 0), 0));
    const aOut = r2(liqLines.reduce((x, r) => x + (r.a || 0), 0));
    const giro = s.tipo === "giroconto" || (liqLines.length === righe.length && righe.length > 1);
    const netto = Math.abs(r2(dIn - aOut));
    const importo = giro ? dIn : netto;
    const inflow = dIn >= aOut;
    const sez = catSez[nk(cat)] || null;
    const cassa = !ap && !giro && sez !== "interno" && netto > 0;
    const section = sez === "investimento" ? "investimento" : (sez === "entrata" ? "entrata" : (sez === "uscita" ? "uscita" : (inflow ? "entrata" : "uscita")));
    const entr = cassa && section === "entrata" ? netto : 0;

  let etichette = [...g.keys()];
  etichette.forEach(et => {
    const rr = g.get(et);
    if (usaSerie) { const g2 = anGruppi(rr, w.dim2); valori[et] = serieNomi.map(s => g2.has(s) ? anAggrega(g2.get(s), m0) : 0); }
    else valori[et] = [anAggrega(rr, m0)];
  });
  const tot = (et) => valori[et].reduce((a, b) => a + b, 0);
  if (w.nascondiZeri !== false) etichette = etichette.filter(et => valori[et].some(v => Math.abs(v) > 1e-7));
  const ord = w.ordine && w.ordine !== "auto" ? w.ordine
    : (["mese", "data"].includes(tipoDim) || /stagione|anno|mese|data/i.test(w.dim) || w.tipo === "linee" ? "etichetta" : "desc");
  if (ord === "etichetta") etichette = anOrdinaVal(etichette, tipoDim);
  else etichette.sort((a, b) => ord === "desc" ? tot(b) - tot(a) : tot(a) - tot(b));
  if (w.limite > 0) etichette = etichette.slice(0, w.limite);
  return { etichette, serie: serieNomi.map((nome, i) => ({ nome, valori: etichette.map(et => valori[et][i]) })) };
}

// Dati di un oggetto come tabella semplice (per Excel e PDF)
function anTabellare(w, dati, fonte) {
  if (!dati || dati.errore) return { intestazioni: ["Nota"], righe: [[dati ? dati.errore : "Nessun dato"]] };
  const m0 = (w.misure || [])[0];
  if (w.tipo === "kpi") {
    const r = [[anEtichettaMisura(m0) || "Valore", dati.valore]];
    (dati.perStag || []).forEach(x => r.push(["Anno " + x.s, x.v]));
    return { intestazioni: ["Misura", "Valore"], righe: r };
  }
  if (w.tipo === "filtro") return { intestazioni: [w.dim, "Righe", "Stato"], righe: dati.valori.map(x => [x.v, x.n, x.stato === "sel" ? "Selezionato" : x.stato === "poss" ? "Possibile" : "Escluso"]) };
  if (w.tipo === "tabella") {
    const conPerc = !!w.percTot && dati.mis.length > 0;
    const t0 = conPerc ? dati.totale[0] : 0;
    const q = (v) => Math.abs(t0) > 1e-9 ? v / t0 : null;
    const r = dati.rows.map(x => [...x.vals, ...x.mis, ...(conPerc ? [q(x.mis[0])] : [])]);
    if (dati.mis.length && dati.dims.length) r.push(["Totale", ...dati.dims.slice(1).map(() => ""), ...dati.totale, ...(conPerc ? [Math.abs(t0) > 1e-9 ? 1 : null] : [])]);
    const intest = [...dati.dims, ...dati.mis.map(anEtichettaMisura), ...(conPerc ? ["% sul totale"] : [])];
    return { intestazioni: intest, righe: r, quota: conPerc ? [intest.length - 1] : [] };
  }
  if (w.tipo === "pivot") {
    const cols = dati.colonne || dati.colVals.map(cv => ({ t: "v", cv }));
    const riga = (get, tot) => {
      const out = cols.map(c => {
        if (c.t === "v") return get(c.cv);
        const va = get(c.a), vb = get(c.b);
        return c.t === "d" ? vb - va : anPerc(va, vb);
      });
      if (dati.mostraTotale !== false) out.push(tot);
      return out;
    };
    const r = dati.rowVals.map(rv => [rv, ...riga(cv => dati.celle.get(rv + "\u0001" + cv) || 0, dati.totR.get(rv) || 0)]);
    r.push(["Totale", ...riga(cv => dati.totC.get(cv) || 0, dati.tot)]);
    const intest = [`${w.dim} \\ ${w.dim2}`, ...cols.map(c => c.t === "v" ? c.cv : anEtichettaCmp(c))];
    if (dati.mostraTotale !== false) intest.push("Totale");
    const perc = cols.map((c, i) => c.t === "p" ? i + 1 : -1).filter(i => i >= 0);
    return { intestazioni: intest, righe: r, perc };
  }
  return { intestazioni: [w.dim, ...dati.serie.map(s => s.nome)], righe: dati.etichette.map((et, i) => [et, ...dati.serie.map(s => s.valori[i])]) };
}

// ---------- grafico (Chart.js) ----------
function AnGrafico({ w, dati, formato, onEtichetta, registra }) {
  const ref = useRef(null);
  const cbRef = useRef(onEtichetta);
  cbRef.current = onEtichetta;
  useEffect(() => {
    if (!ref.current || !window.Chart) return;
    const tipo = w.tipo === "torta" ? "doughnut" : w.tipo === "linee" ? "line" : "bar";
    const multi = dati.serie.length > 1;
    const orizz = w.tipo === "barreO";
    const datasets = dati.serie.map((s, i) => {
      const col = multi ? AN_PALETTE[i % AN_PALETTE.length] : (w.colore || AN_PALETTE[0]);
      if (tipo === "doughnut") return { label: s.nome, data: s.valori, backgroundColor: dati.etichette.map((_, j) => AN_PALETTE[j % AN_PALETTE.length]), borderColor: "#fff", borderWidth: 1 };
      if (tipo === "line") return { label: s.nome, data: s.valori, borderColor: col, backgroundColor: col + "22", fill: !multi, tension: 0.25, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2 };
      return { label: s.nome, data: s.valori, backgroundColor: col, borderRadius: 3, maxBarThickness: 46 };
    });
    const tronca = function (v) { const l = String(this.getLabelForValue(v)); return l.length > 18 ? l.slice(0, 17) + "…" : l; };
    const asseV = { beginAtZero: true, ticks: { font: { size: 10 }, callback: (v) => anCompatto(v) }, grid: { color: "#e9eef5" } };
    const asseC = { ticks: { font: { size: 10 }, autoSkip: true, maxRotation: 45, callback: tronca }, grid: { display: false } };
    const chart = new window.Chart(ref.current.getContext("2d"), {
      type: tipo,
      data: { labels: dati.etichette, datasets },
      options: {
        responsive: true, maintainAspectRatio: false, animation: { duration: 200 },
        indexAxis: orizz ? "y" : "x",
        interaction: { mode: tipo === "line" ? "index" : "nearest", intersect: tipo !== "line" },
        onClick: (evt, els) => { if (els && els.length && cbRef.current) cbRef.current(dati.etichette[els[0].index]); },
        onHover: (evt, els) => { const t = evt && evt.native && evt.native.target; if (t) t.style.cursor = els && els.length ? "pointer" : "default"; },
        plugins: {
          legend: { display: multi || tipo === "doughnut", position: "bottom", labels: { font: { size: 11 }, boxWidth: 12, padding: 8 } },
          tooltip: { callbacks: { label: (ctx) => {
            const v = tipo === "doughnut" ? ctx.parsed : (orizz ? ctx.parsed.x : ctx.parsed.y);
            const totD = tipo === "doughnut" ? (ctx.dataset.data || []).reduce((a, b) => a + (Number(b) || 0), 0) : 0;
            return `${(multi || tipo === "doughnut") ? (tipo === "doughnut" ? ctx.label : ctx.dataset.label) + ": " : ""}${anFormatta(v, formato)}${tipo === "doughnut" ? " · " + anPct(v, totD) : ""}`;
          } } },
        },
        scales: tipo === "doughnut" ? {} : (orizz ? { x: asseV, y: asseC } : { x: asseC, y: asseV }),
      },
    });
    if (registra) registra(w.id, chart);
    return () => { if (registra) registra(w.id, null); chart.destroy(); };
  }, [w, dati, formato]);
  return <canvas ref={ref} />;
}

// ---------- un oggetto della dashboard ----------
function AnWidget({ w, fonte, selezioni, onSeleziona, modifica, strumenti, registra, drag, onRidimensiona }) {
  const [ridim, setRidim] = useState(null);   // {w, h} mentre trascini l'angolo
  const ridimRef = useRef(false);
  const iniziaRidim = (e) => {
    e.preventDefault(); e.stopPropagation();
    const el = e.currentTarget.closest(".an-w"); const grid = el && el.parentElement; if (!grid) return;
    const gap = parseFloat(getComputedStyle(grid).columnGap) || 12;
    const colW = (grid.clientWidth + gap) / 12;
    const r = el.getBoundingClientRect(); const x0 = e.clientX, y0 = e.clientY;
    const w0 = w.w || 6, h0 = w.h || 2;
    let cur = { w: w0, h: h0 };
    ridimRef.current = true;
    const muovi = (ev) => {
      const span = Math.round((r.width + (ev.clientX - x0) + gap) / colW);
      const hPx = r.height + (ev.clientY - y0);
      const h = Object.entries(AN_ALTEZZE_PX).reduce((b, [k, px]) => Math.abs(px - hPx) < Math.abs(AN_ALTEZZE_PX[b] - hPx) ? Number(k) : b, h0);
      cur = { w: Math.max(2, Math.min(12, span)), h };
      setRidim(cur);
    };
    const fine = () => {
      window.removeEventListener("pointermove", muovi); window.removeEventListener("pointerup", fine);
      ridimRef.current = false; setRidim(null);
      if ((cur.w !== w0 || cur.h !== h0) && onRidimensiona) onRidimensiona(cur);
    };
    window.addEventListener("pointermove", muovi); window.addEventListener("pointerup", fine);
  };
  const dati = useMemo(() => anDatiWidget(w, fonte, selezioni), [w, fonte, selezioni]);
  const [cerca, setCerca] = useState("");
  const m0 = (w.misure || [])[0];
  const formato = anFormatoMisura(m0, fonte, w.formato);
  const titolo = w.titolo || anTitoloAuto(w);
  let corpo;
  if (dati.errore) corpo = <div className="an-vuoto">{dati.errore}</div>;
  else if (w.tipo === "kpi") {
    corpo = (
      <div>
        <div className="an-kpi-val" style={w.colore ? { color: w.colore } : {}}>{anFormatta(dati.valore, formato)}</div>

            ))}
          </div>
        )}
      </div>
    );
  } else if (w.tipo === "filtro") {
    const lista = cerca ? dati.valori.filter(x => x.v.toLowerCase().includes(cerca.toLowerCase())) : dati.valori;
    corpo = (
      <div className="an-filtro">
        {dati.valori.length > 8 && <input className="an-cerca" placeholder="Cerca…" value={cerca} onChange={e => setCerca(e.target.value)} />}
        {lista.map(x => (
          <div key={x.v} className={"an-filtro-item " + x.stato} onClick={() => onSeleziona(w.dim, x.v)}>
            <span>{x.v}</span><span className="an-filtro-n">{x.n || ""}</span>
          </div>
        ))}
        {!lista.length && <div className="an-vuoto">Nessun valore</div>}

  } else if (w.tipo === "tabella") {
    corpo = !dati.rows.length ? <div className="an-vuoto">Nessun dato con le selezioni attuali</div> : (
      <table className="an-tbl">
        <thead><tr>{dati.dims.map(d => <th key={d}>{d}</th>)}{dati.mis.map((m, i) => <th key={i} className="n">{anEtichettaMisura(m)}</th>)}{w.percTot && dati.mis.length > 0 && <th className="n">% sul totale</th>}</tr></thead>
        <tbody>

                  <span className="an-quota-txt">{anPct(r.mis[0], dati.totale[0])}</span>

          {dati.mis.length > 0 && dati.dims.length > 0 && dati.rows.length > 1 && (

  } else if (w.tipo === "pivot") {
    const inverti = !!(w.confronto || {}).inverti;

      <table className="an-tbl">
        <thead><tr>
          <th>{w.dim}</th>
          {dati.colonne.map((c, i) => c.t === "v"
            ? <th key={i} className="n cl" onClick={() => onSeleziona(w.dim2, c.cv)}>{c.cv}</th>
            : <th key={i} className="n an-cmp" title={anEtichettaCmp(c)}>{anEtichettaCmpBreve(c, w)}</th>)}
          {dati.mostraTotale && <th className="n">Totale</th>}

        <tbody>
          {dati.rowVals.map(rv => (

              <td className="cl" onClick={() => onSeleziona(w.dim, rv)}>{rv}</td>

                const get = (cv) => dati.celle.get(rv + "\u0001" + cv) || 0;
                if (c.t === "v") {
                  const v = get(c.cv);
                  const base = w.percPivot === "colonna" ? (dati.totC.get(c.cv) || 0) : w.percPivot === "riga" ? (dati.totR.get(rv) || 0) : dati.tot;

            </tr>
          ))}
          <tr className="tot">
            <td>Totale</td>

              if (c.t === "v") return <td key={i} className="n">{anFormatta(get(c.cv), formato)}{w.percPivot && w.percPivot !== "colonna" ? <span className="an-pct">{anPct(get(c.cv), dati.tot)}</span> : null}</td>;
              const va = get(c.a), vb = get(c.b), d = vb - va;
              if (c.t === "d") return <td key={i} className={"n an-cmp" + anClsDelta(d, inverti)}>{anFmtDelta(d, formato)}</td>;
              const pc = anPerc(va, vb);
              return <td key={i} className={"n an-cmp" + (pc === null ? "" : anClsDelta(d, inverti))}>{anFmtPerc(pc)}</td>;
            })}
            {dati.mostraTotale && <td className="n">{anFormatta(dati.tot, formato)}</td>}
          </tr>
        </tbody>
      </table>
    );
  } else {
    corpo = !dati.etichette.length ? <div className="an-vuoto">Nessun dato con le selezioni attuali</div> : (
      <div className="an-chart">
        <AnGrafico w={w} dati={dati} formato={formato} registra={registra} onEtichetta={(et) => onSeleziona(w.dim, et)} />

  } : {};
  return (
    <div className={`an-w an-w${wv} an-h${hv}${w.tipo === "kpi" ? " an-kpi" : ""}${modifica && drag ? " " + (drag.classe || "") : ""}${ridim ? " an-ridim" : ""}`} {...dnd}>

        <span className="an-w-title" title={titolo}>{titolo}</span>
        {modifica && strumenti}
      </div>
      <div className={"an-w-body" + (AN_GRAFICI.includes(w.tipo) ? " an-w-body-chart" : "")}>{corpo}</div>
    </div>
  );
}

                  <select value={d.fonte} onChange={e => cambiaFonte(e.target.value)}>
                    {Object.values(fonti).map(f => <option key={f.id} value={f.id}>{f.importata ? "📄 " : ""}{f.nome}</option>)}
                  </select>
                </div>
              </div>
              <div className="an-field"><label>Titolo</label>
                <input type="text" value={d.titolo || ""} placeholder={anTitoloAuto({ ...d, misure })} onChange={e => set({ titolo: e.target.value })} />
              </div>

              {(isGraf || d.tipo === "pivot" || d.tipo === "filtro") && (
                <div className="an-row">
                  <div className="an-field"><label>{d.tipo === "filtro" ? "Campo" : d.tipo === "pivot" ? "Righe" : "Dimensione"}</label>
                    <CampoSel value={d.dim} onChange={v => set({ dim: v })} vuoto="— scegli —" />
                  </div>
                  {(d.tipo === "pivot" || (isGraf && d.tipo !== "torta")) && (
                    <div className="an-field"><label>{d.tipo === "pivot" ? "Colonne" : "Serie (facoltativa)"}</label>
                      <CampoSel value={d.dim2} onChange={v => set({ dim2: v })} vuoto={d.tipo === "pivot" ? "— scegli —" : "— nessuna —"} />
                    </div>
                  )}
                </div>
              )}

              {d.tipo === "tabella" && (
                <div className="an-field"><label>Dimensioni (righe)</label>
                  {[0, 1, 2].map(i => (
                    <div key={i} style={{ marginBottom: 6 }}>
                      <CampoSel value={(d.dims || [])[i]} vuoto={i === 0 ? "— nessuna —" : "— aggiungi —"}
                        onChange={v => { const arr = [...(d.dims || [])]; arr[i] = v; set({ dims: arr.filter(Boolean) }); }} />
                    </div>
                  )).slice(0, Math.min(3, (d.dims || []).filter(Boolean).length + 1))}
                </div>
              )}

              {d.tipo !== "filtro" && (
                <div className="an-field"><label>{d.tipo === "tabella" ? "Misure" : "Misura"}</label>
                  {(d.tipo === "tabella" ? misure : misure.slice(0, 1)).map((m, i) => (
                    <MisuraSel key={i} m={m} i={i} rimuovi={d.tipo === "tabella" && misure.length > 1 ? () => set({ misure: misure.filter((_, j) => j !== i) }) : null} />
                  ))}
                  {d.tipo === "tabella" && misure.length < 5 && (
                    <button type="button" className="btn ghost sm" onClick={() => set({ misure: [...misure, { campo: numerici[0] ? numerici[0].nome : "", agg: numerici[0] ? "somma" : "conteggio" }] })}>+ Misura</button>
                  )}
                </div>
              )}

              {d.tipo !== "kpi" && d.tipo !== "filtro" && (
                <div className="an-row">
                  <div className="an-field"><label>Ordina</label>
                    <select value={d.ordine || "auto"} onChange={e => set({ ordine: e.target.value })}>
                      <option value="auto">Automatico</option><option value="etichetta">Per etichetta</option>
                      <option value="desc">Valore decrescente</option><option value="asc">Valore crescente</option>
                      {confOn && <option value="delta_desc">Per Δ decrescente (ultimo confronto)</option>}
                      {confOn && <option value="delta_asc">Per Δ crescente (ultimo confronto)</option>}
                    </select>
                  </div>
                  <div className="an-field"><label>Mostra solo i primi</label>
                    <input type="number" min="0" value={d.limite || ""} placeholder="tutti" onChange={e => set({ limite: Math.max(0, parseInt(e.target.value) || 0) })} />
                  </div>
                </div>
              )}

              {d.tipo !== "filtro" && (
                <div className="an-row">
                  <div className="an-field"><label>Formato numeri</label>
                    <select value={d.formato || "auto"} onChange={e => set({ formato: e.target.value })}>
                      <option value="auto">Automatico</option><option value="euro">Euro</option><option value="numero">Numero</option>
                    </select>
                  </div>
                  {d.tipo !== "kpi" && (
                    <div className="an-field"><label>Valori a zero</label>
                      <select value={d.nascondiZeri === false ? "mostra" : "nascondi"} onChange={e => set({ nascondiZeri: e.target.value !== "mostra" })}>
                        <option value="nascondi">Nascondi</option><option value="mostra">Mostra</option>
                      </select>
                    </div>
                  )}
                </div>
              )}

              {d.tipo === "tabella" && (
                <label className="an-check">
                  <input type="checkbox" checked={!!d.percTot} onChange={e => set({ percTot: e.target.checked })} />
                  Aggiungi la colonna "% sul totale" (sulla prima misura)
                </label>
              )}

              {d.tipo === "kpi" && (
                <label className="an-check">
                  <input type="checkbox" checked={d.perStagione !== false} onChange={e => set({ perStagione: e.target.checked })} />
                  Mostra il dettaglio per anno
                </label>
              )}

              {(d.tipo === "kpi" || ((d.tipo === "barre" || d.tipo === "barreO" || d.tipo === "linee") && !d.dim2)) && (
                <div className="an-field"><label>Colore</label>
                  <div className="an-row" style={{ flexWrap: "wrap", gap: 6 }}>
                    <span className={"an-swatch an-swatch-auto" + (!d.colore ? " on" : "")} onClick={() => set({ colore: "" })} title="Automatico">A</span>
                    {AN_PALETTE.map(c => <span key={c} className={"an-swatch" + (d.colore === c ? " on" : "")} style={{ background: c }} onClick={() => set({ colore: c })} />)}
                  </div>
                </div>
              )}

              {d.tipo === "pivot" && (() => {
                const c = d.confronto || {};
                const setC = (patch) => set({ confronto: { ...c, ...patch } });
                const cols = fonte && d.dim2 ? anOrdinaVal([...new Set(anFiltra(fonte, d.filtri, {}, null).map(r => anVal(r[d.dim2])))], anTipoCampo(fonte, d.dim2)).slice(0, 300) : [];
                const modo = c.modo || "nessuno";
                const ColSel = ({ value, onChange, vuoto }) => (
                  <select value={value || ""} onChange={e => onChange(e.target.value)}>
                    <option value="">{vuoto}</option>
                    {cols.map(v => <option key={v} value={v}>{v}</option>)}
                  </select>
                );
                return (
                  <div className="an-field an-filtro-fisso"><label>Confronto tra colonne (Δ e Δ %)</label>
                    <select value={modo} onChange={e => setC({ modo: e.target.value })}>
                      <option value="nessuno">Nessun confronto</option>
                      <option value="precedente">Ogni colonna rispetto alla precedente</option>
                      <option value="base">Ogni colonna rispetto a una colonna base</option>
                      <option value="coppia">Due colonne a scelta (A → B)</option>
                    </select>
                    {!d.dim2 && modo !== "nessuno" && <div className="an-nota">Scegli prima il campo delle colonne.</div>}
                    {modo === "base" && (
                      <div className="an-field" style={{ marginTop: 8 }}><label>Colonna base</label>
                        <ColSel value={c.base} vuoto="— prima colonna —" onChange={v => setC({ base: v })} />
                      </div>
                    )}
                    {modo === "coppia" && (
                      <>
                        <div className="an-row" style={{ marginTop: 8 }}>
                          <div className="an-field"><label>A (di partenza)</label><ColSel value={c.a} vuoto="— prima colonna —" onChange={v => setC({ a: v })} /></div>
                          <div className="an-field"><label>B (da confrontare)</label><ColSel value={c.b} vuoto="— ultima colonna —" onChange={v => setC({ b: v })} /></div>
                        </div>
                        <label className="an-check">
                          <input type="checkbox" checked={!!c.soloCoppia} onChange={e => setC({ soloCoppia: e.target.checked })} />
                          Mostra solo le colonne A e B
                        </label>
                      </>
                    )}
                    {modo !== "nessuno" && (
                      <>
                        <div className="an-field" style={{ marginTop: 8 }}><label>Mostra</label>
                          <select value={c.mostra || "entrambi"} onChange={e => setC({ mostra: e.target.value })}>
                            <option value="entrambi">Δ e Δ %</option><option value="diff">Solo Δ (differenza)</option><option value="perc">Solo Δ %</option>
                          </select>
                        </div>
                        <label className="an-check">
                          <input type="checkbox" checked={!!c.inverti} onChange={e => setC({ inverti: e.target.checked })} />
                          Un aumento è un peggioramento (es. costi): aumenti in rosso
                        </label>
                      </>
                    )}
                    <label className="an-check">
                      <input type="checkbox" checked={!!d.nascondiTotale} onChange={e => set({ nascondiTotale: e.target.checked })} />
                      Nascondi la colonna Totale
                    </label>
                    <div className="an-field" style={{ marginTop: 4 }}><label>Peso % di ogni cella</label>
                      <select value={d.percPivot || ""} onChange={e => set({ percPivot: e.target.value })}>
                        <option value="">Non mostrare</option>
                        <option value="colonna">% sul totale della colonna (es. voce sul totale del mese)</option>
                        <option value="riga">% sul totale della riga (es. mese sul totale della voce)</option>
                        <option value="totale">% sul totale generale</option>
                      </select>
                    </div>
                    <div className="an-nota">Δ = B − A · Δ % = (B − A) / |A|. Se A è zero la percentuale non si calcola (—). Per scegliere quali mesi mostrare usa un filtro fisso sul campo delle colonne.</div>
                  </div>
                );
              })()}

              <div className="an-field"><label>Filtri fissi dell'oggetto</label>
                {(d.filtri || []).map((f, i) => (
                  <div key={i} className="an-filtro-fisso">
                    <div className="an-row">
                      <CampoSel value={f.campo} vuoto="— campo —" onChange={v => { const arr = [...d.filtri]; arr[i] = { campo: v, valori: [] }; set({ filtri: arr }); setCercaF(x => ({ ...x, [i]: "" })); }} />
                      <button type="button" className="btn ghost sm" style={{ flex: "0 0 auto" }} onClick={() => { set({ filtri: d.filtri.filter((_, j) => j !== i) }); setCercaF({}); }}>✕</button>
                    </div>
                    {f.campo && (() => {
                      const tutti = valoriDi(f.campo);
                      const sel = f.valori || [];
                      const q = anNorm(cercaF[i] || "");
                      const visibili = q ? tutti.filter(v => anNorm(v).includes(q)) : tutti;
                      // i valori già scelti restano sempre in cima, anche se non corrispondono alla ricerca
                      const lista = [...sel.filter(v => tutti.includes(v)), ...visibili.filter(v => !sel.includes(v))];
                      const setValori = (vv) => { const arr = [...d.filtri]; arr[i] = { ...f, valori: vv }; set({ filtri: arr }); };
                      return (
                        <>
                          {tutti.length > 8 && (
                            <div className="an-row" style={{ marginTop: 6, alignItems: "center" }}>
                              <input className="an-cerca" style={{ marginBottom: 0 }} placeholder={`Cerca tra ${tutti.length} valori…`}
                                value={cercaF[i] || ""} onChange={e => setCercaF(x => ({ ...x, [i]: e.target.value }))}
                                onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); const nuovi = visibili.filter(v => !sel.includes(v)); if (q && nuovi.length === 1) { setValori([...sel, nuovi[0]]); setCercaF(x => ({ ...x, [i]: "" })); } } }} />
                              {q && visibili.some(v => !sel.includes(v)) && (
                                <button type="button" className="btn ghost sm" style={{ flex: "0 0 auto" }}
                                  onClick={() => setValori([...sel, ...visibili.filter(v => !sel.includes(v))])}>+ tutti i trovati</button>
                              )}
                              {sel.length > 0 && (
                                <button type="button" className="btn ghost sm" style={{ flex: "0 0 auto" }} onClick={() => setValori([])}>Azzera ({sel.length})</button>
                              )}
                            </div>
                          )}
                          <div className="an-valori">
                            {lista.map(v => {
                              const on = sel.includes(v);
                              return <span key={v} className={"an-chip" + (on ? " on" : "")}
                                onClick={() => setValori(on ? sel.filter(x => x !== v) : [...sel, v])}>{v}</span>;
                            })}
                            {!lista.length && <span className="an-nota">Nessun valore trovato</span>}
                          </div>
                        </>
                      );
                    })()}
                  </div>
                ))}
                <button type="button" className="btn ghost sm" onClick={() => set({ filtri: [...(d.filtri || []), { campo: "", valori: [] }] })}>+ Filtro fisso</button>
                <div className="an-nota">Valgono solo per questo oggetto, sempre, in aggiunta alle selezioni della dashboard.</div>
              </div>

              <div className="an-row">
                <div className="an-field"><label>Larghezza</label>
                  <select value={d.w} onChange={e => set({ w: Number(e.target.value) })}>{AN_LARGHEZZE.map(([k, l]) => <option key={k} value={k}>{l}</option>)}</select>
                </div>
                <div className="an-field"><label>Altezza</label>
                  <select value={d.h} onChange={e => set({ h: Number(e.target.value) })}>{AN_ALTEZZE.map(([k, l]) => <option key={k} value={k}>{l}</option>)}</select>
                </div>
              </div>
            </div>
            <div>
              <div className="an-nota" style={{ marginBottom: 6 }}>Anteprima con le selezioni attuali</div>
              <div className="an-grid an-grid-anteprima">
                <AnWidget w={{ ...anteprima, w: 12 }} fonte={fonte} selezioni={selezioni} onSeleziona={() => {}} />
              </div>
            </div>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn ghost" onClick={onChiudi}>Annulla</button>
          <button className="btn accent" onClick={() => { const { __nuovo, ...pulito } = { ...d, misure }; onSalva(pulito); }}>Salva oggetto</button>
        </div>
      </div>
    </div>
  );
}

// ---------- import di una tabella ----------
function AnImport({ esistente, onChiudi, onToast }) {
  const [fogli, setFogli] = useState(null);
  const [foglio, setFoglio] = useState("");
  const [rigaInt, setRigaInt] = useState(1);
  const [nome, setNome] = useState(esistente ? esistente.nome : "");
  const [nomeFile, setNomeFile] = useState("");
  const [tipi, setTipi] = useState({});
  const [salvando, setSalvando] = useState(false);

  const leggi = async (file) => {
    if (!file) return;
    try {
      const ext = (file.name.split(".").pop() || "").toLowerCase();
      let out = {};
      if (ext === "csv" || ext === "txt") out = { "CSV": anParseCSV(await file.text()) };
      else {
        if (typeof XLSX === "undefined") { onToast("Lettura Excel non disponibile", "error"); return; }
        const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
        wb.SheetNames.forEach(n => { out[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "" }); });
      }
      const primo = Object.keys(out).find(k => (out[k] || []).length) || Object.keys(out)[0];
      setFogli(out); setFoglio(primo); setRigaInt(1); setTipi({}); setNomeFile(file.name);
      if (!nome) setNome(file.name.replace(/\.[^.]+$/, ""));
    } catch (e) { onToast("File non leggibile: " + (e.message || e), "error"); }
  };

  const struttura = useMemo(() => {
    if (!fogli || !fogli[foglio]) return null;
    const aoa = fogli[foglio];
    const hi = Math.max(0, rigaInt - 1);
    const head = aoa[hi] || [];
    const corpo = aoa.slice(hi + 1).filter(r => r && r.some(v => v !== "" && v !== null && v !== undefined));
    const nCol = Math.max(head.length, ...corpo.slice(0, 200).map(r => r.length), 0);
    const visti = {};
    const colonne = [];
    for (let i = 0; i < nCol; i++) {
      let n = String(head[i] === undefined || head[i] === null ? "" : (head[i] instanceof Date ? anDataISO(head[i]) : head[i])).trim() || `Colonna ${i + 1}`;
      const base = n; let k = 2;
      while (visti[anKey(n)]) n = `${base} (${k++})`;
      visti[anKey(n)] = true;
      const valori = corpo.map(r => r[i]);
      if (valori.every(v => v === "" || v === null || v === undefined) && !String(head[i] || "").trim()) continue;
      colonne.push({ i, nome: n, rilevato: anTipoColonna(valori) });
    }
    return { colonne, corpo };
  }, [fogli, foglio, rigaInt]);

  const salva = async () => {
    if (!struttura || !struttura.colonne.length) return;
    if (!nome.trim()) return alert("Dai un nome alla tabella");
    if (struttura.corpo.length > 50000) return alert("La tabella supera le 50.000 righe: è troppo grande per essere salvata qui.");
    const colonne = struttura.colonne.map(c => ({ nome: c.nome, tipo: tipi[c.nome] || c.rilevato }));
    const righe = struttura.corpo.map(r => struttura.colonne.map((c, j) => {
      const v = r[c.i]; const tipo = colonne[j].tipo;
      if (v === "" || v === null || v === undefined) return "";
      if (tipo === "numero") { const n = anNumero(v); return n === null ? "" : n; }
      if (tipo === "data") return anDataISO(v) || "";
      return v instanceof Date ? (anDataISO(v) || "") : String(v).trim();
    }));
    setSalvando(true);
    try {
      const payload = anPulisci({ nome: nome.trim(), colonne, righe, nRighe: righe.length, file: nomeFile, importataIl: new Date().toISOString() });
      if (esistente) await anDb.set(`analisi/tabelle/${esistente.id}`, payload);
      else await anDb.push("analisi/tabelle", payload);
      onToast(`Tabella "${nome.trim()}" salvata: ${righe.length} righe`);
      onChiudi();
    } catch (e) {
      onToast("Salvataggio non riuscito: " + (e.message || e), "error");
      setSalvando(false);
    }
  };

  return (
    <div className="modal-bg" onClick={onChiudi}>
      <div className="modal" style={{ maxWidth: 920 }} onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3>{esistente ? `Sostituisci i dati di "${esistente.nome}"` : "Importa una tabella"}</h3>
          <button className="btn ghost sm" onClick={onChiudi}>✕</button>
        </div>
        <div className="modal-body">
          <div className="an-field"><label>File Excel o CSV</label>
            <input type="file" accept=".xlsx,.xls,.xlsm,.csv,.txt" onChange={e => leggi(e.target.files && e.target.files[0])} />
          </div>
          {fogli && (
            <>
              <div className="an-row">
                <div className="an-field"><label>Nome della tabella</label>
                  <input type="text" value={nome} onChange={e => setNome(e.target.value)} disabled={!!esistente} />
                </div>
                {Object.keys(fogli).length > 1 && (
                  <div className="an-field"><label>Foglio</label>
                    <select value={foglio} onChange={e => { setFoglio(e.target.value); setTipi({}); }}>{Object.keys(fogli).map(k => <option key={k} value={k}>{k}</option>)}</select>
                  </div>
                )}
                <div className="an-field"><label>Riga delle intestazioni</label>
                  <input type="number" min="1" value={rigaInt} onChange={e => { setRigaInt(Math.max(1, parseInt(e.target.value) || 1)); setTipi({}); }} />
                </div>
              </div>
              {struttura && struttura.colonne.length > 0 ? (
                <>
                  <div className="an-nota" style={{ margin: "4px 0 8px" }}>
                    {struttura.corpo.length} righe, {struttura.colonne.length} colonne. Controlla il tipo di ogni colonna: le colonne numero diventano misure (somme, medie…), le altre servono per raggruppare e filtrare.
                    Se una colonna ha lo stesso nome di un campo dell'app (es. Anno, Mese, Categoria, Conto) le selezioni la collegano ai dati contabili.
                  </div>
                  <div className="an-tbl-wrap">
                    <table className="an-tbl">
                      <thead>
                        <tr>{struttura.colonne.map(c => <th key={c.i}>{c.nome}</th>)}</tr>
                        <tr>{struttura.colonne.map(c => (
                          <th key={c.i} style={{ fontWeight: 400 }}>
                            <select className="an-mini" value={tipi[c.nome] || c.rilevato} onChange={e => setTipi(t => ({ ...t, [c.nome]: e.target.value }))}>
                              <option value="testo">Testo</option><option value="numero">Numero</option><option value="data">Data</option>
                            </select>
                          </th>
                        ))}</tr>
                      </thead>
                      <tbody>
                        {struttura.corpo.slice(0, 8).map((r, i) => (
                          <tr key={i}>{struttura.colonne.map(c => { const v = r[c.i]; return <td key={c.i}>{v instanceof Date ? anDataISO(v) : String(v === undefined || v === null ? "" : v)}</td>; })}</tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </>
              ) : <div className="an-vuoto">Nessuna colonna trovata: controlla la riga delle intestazioni.</div>}
            </>
          )}
        </div>
        <div className="modal-foot">
          <button className="btn ghost" onClick={onChiudi}>Annulla</button>
          <button className="btn accent" disabled={!struttura || !struttura.colonne.length || salvando} onClick={salva}>{salvando ? "Salvataggio…" : "Salva tabella"}</button>
        </div>
      </div>
    </div>
  );
}

// ---------- dashboard di esempio ----------
function anDashboardEsempio(nome, anni) {
  const W = (o) => ({ id: anNuovoId(), titolo: "", fonte: "mov", dim: "", dim2: "", dims: [], filtri: [], ordine: "auto", limite: 0, formato: "auto", colore: "", nascondiZeri: true, perStagione: true, ...anDefaultPerTipo(o.tipo), ...o });
  return {
    nome, anni,
    widgets: [
      W({ tipo: "kpi", titolo: "Entrate", misure: [{ campo: "Entrate", agg: "somma" }], colore: "#2f7d4f" }),
      W({ tipo: "kpi", titolo: "Uscite", misure: [{ campo: "Uscite", agg: "somma" }], colore: "#c0433f" }),
      W({ tipo: "kpi", titolo: "Flusso netto", misure: [{ campo: "Flusso netto", agg: "somma" }] }),
      W({ tipo: "kpi", titolo: "Movimenti di cassa", misure: [{ agg: "conteggio" }], filtri: [{ campo: "Movimento di cassa", valori: ["Sì"] }], formato: "numero" }),
      W({ tipo: "linee", titolo: "Uscite per mese, anni a confronto", dim: "Mese", dim2: "Anno", misure: [{ campo: "Uscite", agg: "somma" }], w: 8, h: 2 }),
      W({ tipo: "filtro", titolo: "Conto liquidità", dim: "Conto liquidità" }),
      W({ tipo: "barreO", titolo: "Uscite per categoria", dim: "Categoria", dim2: "Anno", misure: [{ campo: "Uscite", agg: "somma" }], limite: 10, w: 6, h: 3 }),
      W({ tipo: "torta", titolo: "Entrate per categoria", dim: "Categoria", misure: [{ campo: "Entrate", agg: "somma" }], w: 6, h: 3 }),
      W({ tipo: "pivot", titolo: "Flusso netto per categoria e mese", dim: "Categoria", dim2: "Anno-mese", misure: [{ campo: "Flusso netto", agg: "somma" }], w: 12, h: 3 }),

// ============================================================
// PAGINA: SCHEMA DI BILANCIO (prospetti civilistici)
// Separa il piano dei conti GESTIONALE (per registrare) dallo
// SCHEMA DI BILANCIO (per esporre). Ogni voce di schema raccoglie
// uno o piu' conti, ciascuno con segno +1 (naturale) o -1 (invertito).
// Comprende Stato Patrimoniale, Conto Economico e Rendiconto
// Finanziario a tre aree (metodo diretto e indiretto).
// Salvataggio: schemaBilancio/json su Firebase (stringa JSON, per evitare
// le conversioni array->oggetto di Realtime Database), oppure in locale.
// Porting dal gestionale futsal: qui non ci sono stagioni, il periodo è
// dall'apertura alla data scelta ("Situazione al").
// ============================================================

const SB_PATH = "schemaBilancio";
const SB_LS = "contabilita_personale_schema_v1";
const fmt = (n, dec = 2) => (n === null || n === undefined || isNaN(n)) ? "—" : numIT(n, dec);
const fmtP = (n, dec = 2) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const x = Number(n);
  const s = numIT(Math.abs(x), dec);
  return (x < 0 && Math.abs(x) >= Math.pow(10, -dec) / 2) ? "(" + s + ")" : s;
};
const sbSlug = (s) => String(s || "").replace(/[^\w\-]+/g, "_").replace(/_+/g, "_").replace(/^_|_$/g, "");

const SB_NATURE = [
  ["liquidita",        "Disponibilita' liquide"],
  ["circolante",       "Capitale circolante (crediti/debiti)"],
  ["immobilizzazioni", "Immobilizzazioni (costo storico)"],
  ["fondo",            "Fondi ammortamento (non monetari)"],
  ["patrimonio",       "Patrimonio netto e finanziamenti"],
  ["economico",        "Conto economico"],
];
