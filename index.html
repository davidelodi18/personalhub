/* ============================================================
   PAGINA: SNAPSHOT MENSILE  (saldo conti liquidi a fine mese)
   ============================================================ */
function PageSnapshot({scritture}){
  const snap = useMemo(()=>{
    const mset=new Set();
    scritture.forEach(s=>{ const k=rfMonthKey(s.data); if(k) mset.add(k); });
    const mesi=[...mset].sort();
    const perConto={};
    LIQ_CODES.forEach(cod=>{
      const delta={};
      scritture.forEach(s=>{ const k=rfMonthKey(s.data); if(!k) return;
        const d=s.righe.filter(r=>r.c===cod).reduce((x,r)=>x+(r.d||0)-(r.a||0),0);
        if(d) delta[k]=r2((delta[k]||0)+d);
      });
      let cum=0; const bal={}, varz={};
      mesi.forEach(k=>{ const prev=cum; cum=r2(cum+(delta[k]||0)); bal[k]=cum; varz[k]=r2(cum-prev); });
      perConto[cod]={bal,varz};
    });
    const totBal={}, totVar={};
    mesi.forEach(k=>{ totBal[k]=r2(LIQ_CODES.reduce((s,c)=>s+(perConto[c].bal[k]||0),0)); totVar[k]=r2(LIQ_CODES.reduce((s,c)=>s+(perConto[c].varz[k]||0),0)); });
    return {mesi,perConto,totBal,totVar};
  },[scritture]);

  const [mostraVar,setMostraVar]=useState(false);
  const {mesi,perConto,totBal,totVar}=snap;
  const ultimo = mesi[mesi.length-1];

  return (
    <div>
      <PageHead title="Snapshot mensile" sub="Situazione dei conti liquidi alla fine di ogni mese">
        <button className={'btn '+(mostraVar?'accent':'ghost')} onClick={()=>setMostraVar(v=>!v)}>{mostraVar?'Mostra saldi':'Mostra variazioni'}</button>
      </PageHead>

      {ultimo &&
        <div className="kpi-grid">
          {LIQ_CODES.map(cod=>(
            <Kpi key={cod} label={contoByCode[cod].nome} value={eur(perConto[cod].bal[ultimo]||0)} hint={`a fine ${rfMonthLabel(ultimo)}`}/>
          ))}
          <Kpi accent label="Totale liquidità" value={eur(totBal[ultimo]||0)} hint={`a fine ${rfMonthLabel(ultimo)}`}/>
        </div>}

      <div className="tbl-wrap">
        <table className="tbl rf-matrix">
          <thead><tr><th className="rf-voce">Conto</th>{mesi.map(k=><th key={k} className="num">{rfMonthLabel(k)}</th>)}</tr></thead>
          <tbody>
            {LIQ_CODES.map(cod=>(
              <tr key={cod} className="rf-row">
                <td className="rf-voce">{contoByCode[cod].nome}</td>
                {mesi.map(k=>{ const v=mostraVar?perConto[cod].varz[k]:perConto[cod].bal[k];
                  return <td key={k} className={'num '+(mostraVar&&v<0?'neg':mostraVar&&v>0?'pos':'')}>{mostraVar&&v>0?'+':''}{num2(v||0)}</td>; })}
              </tr>
            ))}
            <tr className="rf-tot strong">
              <td className="rf-voce">Totale liquidità</td>
              {mesi.map(k=>{ const v=mostraVar?totVar[k]:totBal[k];
                return <td key={k} className={'num '+(mostraVar&&v<0?'neg':mostraVar&&v>0?'pos':'')}>{mostraVar&&v>0?'+':''}{num2(v||0)}</td>; })}
            </tr>
          </tbody>
        </table>
      </div>
      <div style={{fontSize:12,color:'var(--ink-3)',marginTop:10,fontStyle:'italic'}}>
        Saldi contabili di fine mese ricavati dal libro giornale (cumulati). “Mostra variazioni” evidenzia la differenza rispetto al mese precedente.
      </div>
    </div>
  );
}

/* ============================================================
   PAGINA: CHIUSURA MENSILE  (report, sola lettura)
   ============================================================ */
function naturaCE(c){
  const e=(c.eccedenza||'').toUpperCase().trim();
  if(e==='DARE/AVERE') return null;
  if(e.indexOf('AVERE')===0) return 'R';
  if(e.indexOf('DARE')===0) return 'C';
  return null;
}

/* Motore di calcolo della chiusura: liquidità, conto economico, stato
   patrimoniale e rendiconto finanziario per il mese `mk`, in modalità
   'mensile' (solo il mese) o 'progressivo' (da inizio anno fino a `mk`).
   È usato sia per il rendering a video sia per gli export, così restano
   sempre allineati. */
function buildChiusura(scritture, categorie, mk, mode){
  if(!mk) return null;
  const year = mk.slice(0,4);
  const yearStart = year+'-01';
  const isProg = mode==='progressivo';
  const inFlow = k => isProg ? (k>=yearStart && k<=mk) : (k===mk);
  const before = k => isProg ? (k<yearStart) : (k<mk);

  /* 1) Liquidità — roll-forward (apertura + entrate − uscite = saldo finale) */
  const liq = LIQ_CODES.map(cod=>{
    let opening=0, entrate=0, uscite=0;
    scritture.forEach(s=>{ const k=rfMonthKey(s.data); if(!k) return;
      s.righe.forEach(r=>{ if(r.c!==cod) return;
        if(before(k)) opening += (r.d||0)-(r.a||0);
        else if(inFlow(k)){ entrate += (r.d||0); uscite += (r.a||0); }
      });
    });
    opening=r2(opening); entrate=r2(entrate); uscite=r2(uscite);
    return {cod, nome:contoByCode[cod].nome, opening, entrate, uscite, closing:r2(opening+entrate-uscite)};
  });
  const liqTot={
    opening:r2(liq.reduce((s,x)=>s+x.opening,0)),
    entrate:r2(liq.reduce((s,x)=>s+x.entrate,0)),
    uscite:r2(liq.reduce((s,x)=>s+x.uscite,0)),
    closing:r2(liq.reduce((s,x)=>s+x.closing,0)),
  };

  /* movimenti del periodo aggregati per conto (per il conto economico) */
  const movByCod={};
  scritture.forEach(s=>{ if(!inFlow(rfMonthKey(s.data))) return;
    s.righe.forEach(r=>{ if(!movByCod[r.c]) movByCod[r.c]={dare:0,avere:0}; movByCod[r.c].dare+=(r.d||0); movByCod[r.c].avere+=(r.a||0); });
  });

  /* 2) Conto economico del periodo */
  const ricavi=[], costi=[];
  CONTI.forEach(c=>{ if(c.prospetto!=='CE') return; const m=movByCod[c.codice]; if(!m) return;
    const dare=r2(m.dare), avere=r2(m.avere); if(!dare && !avere) return;
    let nat=naturaCE(c), imp;
    if(nat==='R') imp=r2(avere-dare);
    else if(nat==='C') imp=r2(dare-avere);
    else { const net=r2(avere-dare); if(net>=0){nat='R'; imp=net;} else {nat='C'; imp=r2(-net);} }
    if(Math.abs(imp)<0.005) return;
    (nat==='R'?ricavi:costi).push({cod:c.codice,nome:c.nome,imp});
  });
  ricavi.sort((a,b)=>b.imp-a.imp); costi.sort((a,b)=>b.imp-a.imp);
  const totRicavi=r2(ricavi.reduce((s,x)=>s+x.imp,0));
  const totCosti=r2(costi.reduce((s,x)=>s+x.imp,0));
  const risultato=r2(totRicavi-totCosti);

  /* 3) Stato patrimoniale — fotografia a fine mese (saldi cumulati k<=mk).
     Il patrimonio è uno stock: NON dipende da mensile/progressivo. */
  const sal={}; CONTI.forEach(c=>{ sal[c.codice]={dare:0,avere:0}; });
  scritture.forEach(s=>{ const k=rfMonthKey(s.data); if(!k || k>mk) return;
    s.righe.forEach(r=>{ if(!sal[r.c]) sal[r.c]={dare:0,avere:0}; sal[r.c].dare+=(r.d||0); sal[r.c].avere+=(r.a||0); });
  });
  const saldoOf=cod=>{ const s=sal[cod]||{dare:0,avere:0}; return r2((s.dare||0)-(s.avere||0)); };
  const rowsCat=cat=>CONTI.filter(c=>c.categoria===cat).map(c=>({cod:c.codice,nome:c.nome,saldo:saldoOf(c.codice)})).filter(r=>Math.abs(r.saldo)>0.005);
  const sumCat=cat=>r2(CONTI.filter(c=>c.categoria===cat).reduce((s,c)=>s+saldoOf(c.codice),0));
  const immMat=sumCat('IMM. MATERIALI'), immFin=sumCat('IMM. FINANZIARIE'), disp=sumCat('DISP. LIQUIDE'), fondi=sumCat('RETTIFICA ATTIVO');
  const attivo=r2(immMat+immFin+disp+fondi);
  const pnSaldo=sumCat('PATRIMONIO NETTO');
  const ricaviCum=r2(CONTI.filter(c=>c.categoria==='RICAVI').reduce((s,c)=>s-saldoOf(c.codice),0));
  const costiCum=r2(CONTI.filter(c=>c.categoria==='COSTI').reduce((s,c)=>s+saldoOf(c.codice),0));
  const risEserc=r2(ricaviCum-costiCum);
  const pn=r2(-pnSaldo);
  const totPassivoNetto=r2(pn+risEserc);
  const sp={
    immMat:rowsCat('IMM. MATERIALI'), immFin:rowsCat('IMM. FINANZIARIE'),
    fondi:rowsCat('RETTIFICA ATTIVO'), disp:rowsCat('DISP. LIQUIDE'),
    totImmMat:immMat, totImmFin:immFin, totFondi:fondi, totDisp:disp, attivo,
    pnRows:rowsCat('PATRIMONIO NETTO').map(r=>({...r,saldo:r2(-r.saldo)})),
    pn, risEserc, totPassivoNetto,
    sbilancio:r2(attivo-totPassivoNetto)
  };

  /* 4) Rendiconto finanziario del periodo (riconciliato con la cassa) */
  const rfFull=buildRendiconto(scritture,categorie);
  const periodMonths=rfFull.mesi.filter(inFlow);
  const sumRows=rows=>rows.map(r=>({nome:r.nome,imp:r2(periodMonths.reduce((s,k)=>s+(r.perMese[k]||0),0))})).filter(r=>Math.abs(r.imp)>0.005).sort((a,b)=>b.imp-a.imp);
  const rfEnt=sumRows(rfFull.rows.entrata);
  const rfUsc=sumRows(rfFull.rows.uscita);
  const rfInv=sumRows(rfFull.rows.investimento);
  const totEnt=r2(rfEnt.reduce((s,x)=>s+x.imp,0));
  const totUsc=r2(rfUsc.reduce((s,x)=>s+x.imp,0));
  const totInv=r2(rfInv.reduce((s,x)=>s+x.imp,0));
  const flussoOper=r2(totEnt-totUsc-totInv);
  const rfIni=liqTot.opening;
  const rfFin=liqTot.closing;
  const altri=r2(rfFin-rfIni-flussoOper);   // giroconti / apertura / movimenti non operativi
  const rf={ini:rfIni, ent:rfEnt, usc:rfUsc, inv:rfInv, totEnt, totUsc, totInv, flussoOper, altri, fin:rfFin};

  return {mk, year, mode, isProg, liq, liqTot, ricavi, costi, totRicavi, totCosti, risultato, sp, rf};
}

/* ============================================================
   PAGINA: CHIUSURA MENSILE  (report, sola lettura)
   ============================================================ */
function PageChiusura({scritture, categorie, toast}){
  const mesi = useMemo(()=>{
    const set=new Set();
    scritture.forEach(s=>{ const k=rfMonthKey(s.data); if(k) set.add(k); });
    return [...set].sort();
  },[scritture]);
  const [mese,setMese]=useState('');
  const [mode,setMode]=useState('mensile');
  const mk = mese || mesi[mesi.length-1] || '';
  const meseNome = k => k ? rfMonthLabel(k)+' '+k.slice(0,4) : '';
  const periodoLabel = mode==='progressivo'
    ? (mk ? 'Gen–'+rfMonthLabel(mk)+' '+mk.slice(0,4) : '')
    : meseNome(mk);

  const rep = useMemo(()=>buildChiusura(scritture,categorie,mk,mode),[scritture,categorie,mk,mode]);

  /* ---------- EXPORT ---------- */
  function slug(){ return (mode==='progressivo'?'Progressivo':'Mensile')+'_'+(mk||''); }

  function liqAoA(){
    const o=[['LIQUIDITÀ — '+periodoLabel,'','','',''],['Conto','Saldo iniziale','Entrate','Uscite','Saldo finale']];
    rep.liq.forEach(x=>o.push([x.nome,x.opening,x.entrate,x.uscite,x.closing]));
    o.push(['TOTALE LIQUIDITÀ',rep.liqTot.opening,rep.liqTot.entrate,rep.liqTot.uscite,rep.liqTot.closing]);
    return o;
  }
  function ceAoA(){
    const o=[['CONTO ECONOMICO — '+periodoLabel,''],['Voce','€']];
    o.push(['RICAVI','']); rep.ricavi.forEach(x=>o.push(['   '+x.nome,x.imp]));
    o.push(['Totale ricavi',rep.totRicavi]);
    o.push(['COSTI','']); rep.costi.forEach(x=>o.push(['   '+x.nome,x.imp]));
    o.push(['Totale costi',rep.totCosti]);
    o.push(['RISULTATO DEL PERIODO',rep.risultato]);
    return o;
  }
  function spAoA(){
    const d=rep.sp; const o=[['STATO PATRIMONIALE — al '+meseNome(mk),''],['Voce','€']];
    o.push(['ATTIVO','']);
    o.push(['Immobilizzazioni materiali','']); d.immMat.forEach(r=>o.push(['   '+r.nome,r.saldo]));
    o.push(['Immobilizzazioni finanziarie','']); d.immFin.forEach(r=>o.push(['   '+r.nome,r.saldo]));
    o.push(['Fondi ammortamento (−)','']); d.fondi.forEach(r=>o.push(['   '+r.nome,r.saldo]));
    o.push(['Disponibilità liquide','']); d.disp.forEach(r=>o.push(['   '+r.nome,r.saldo]));
    o.push(['TOTALE ATTIVO',d.attivo]);
    o.push(['PASSIVO E NETTO','']);
    o.push(['Patrimonio netto','']); d.pnRows.forEach(r=>o.push(['   '+r.nome,r.saldo]));
    o.push(["Risultato d'esercizio (progressivo)",d.risEserc]);
    o.push(['TOTALE PASSIVO E NETTO',d.totPassivoNetto]);
    if(Math.abs(d.sbilancio)>0.005) o.push(['Sbilancio da verificare',d.sbilancio]);
    return o;
  }
  function rfAoA(){
    const d=rep.rf; const o=[['RENDICONTO FINANZIARIO — '+periodoLabel,''],['Voce','€']];
    o.push(['Disponibilità iniziali',d.ini]);
    o.push(['ENTRATE OPERATIVE',d.totEnt]); d.ent.forEach(r=>o.push(['   '+r.nome,r.imp]));
    o.push(['USCITE OPERATIVE',d.totUsc]); d.usc.forEach(r=>o.push(['   '+r.nome,r.imp]));
    if(d.inv.length){ o.push(['INVESTIMENTI',d.totInv]); d.inv.forEach(r=>o.push(['   '+r.nome,r.imp])); }
    o.push(['Flusso operativo / investimenti',d.flussoOper]);
    if(Math.abs(d.altri)>0.005) o.push(['Giroconti e movimenti non operativi',d.altri]);
    o.push(['DISPONIBILITÀ FINALI',d.fin]);
    return o;
  }

  function exportExcel(){
    if(!window.XLSX){ toast('Libreria Excel non caricata','error'); return; }
    const wb=XLSX.utils.book_new();
    const add=(name,aoa)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),name);
    const riep=[
      ['CHIUSURA — '+(mode==='progressivo'?'progressivo (da inizio anno)':'mensile')],
      ['Periodo',periodoLabel],
      ['Generato il',new Date().toLocaleDateString('it-IT')],
      [],
      ['Indicatore','€'],
      ['Entrate liquidità',rep.liqTot.entrate],
      ['Uscite liquidità',rep.liqTot.uscite],
      ['Δ Liquidità',r2(rep.liqTot.closing-rep.liqTot.opening)],
      ['Liquidità a fine periodo',rep.liqTot.closing],
      ['Risultato economico del periodo',rep.risultato],
      ['Totale attivo (a fine mese)',rep.sp.attivo],
    ];
    add('Riepilogo',riep);
    add('Liquidità',liqAoA());
    add('Conto Economico',ceAoA());
    add('Stato Patrimoniale',spAoA());
    add('Rendiconto',rfAoA());
    XLSX.writeFile(wb,'Chiusura_'+slug()+'.xlsx');
    toast('Export Excel completato','success');
  }

  function exportPDF(){
    if(!window.jspdf){ toast('Libreria PDF non caricata','error'); return; }
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const cx=doc.internal.pageSize.getWidth()/2;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('CHIUSURA CONTABILE',cx,18,{align:'center'});
    doc.setFontSize(11); doc.setFont('helvetica','normal');
    doc.text((mode==='progressivo'?'Progressivo da inizio anno — ':'Mensile — ')+periodoLabel,cx,25,{align:'center'});
    doc.setFontSize(9); doc.setTextColor(120);
    doc.text('Generato il '+new Date().toLocaleDateString('it-IT'),cx,31,{align:'center'});
    doc.setTextColor(0);

    const HEAD=[31,79,143], TOT=[225,233,228], SUB=[240,238,233];
    const isBold=t=>/^(TOTALE|RISULTATO|DISPONIBILITÀ FINALI|ATTIVO|PASSIVO E NETTO|ENTRATE|USCITE|INVESTIMENTI)/.test(t)||/Flusso operativo/.test(t);
    const isSub=t=>/^(RICAVI|COSTI|Immobilizzazioni|Fondi|Disponibilità liquide|Patrimonio netto)$/.test(t);

    // Liquidità (5 colonne)
    const liqBody=rep.liq.map(x=>[x.nome,num2(x.opening),x.entrate?'+'+num2(x.entrate):num2(0),x.uscite?'−'+num2(x.uscite):num2(0),num2(x.closing)]);
    liqBody.push([{content:'TOTALE LIQUIDITÀ',styles:{fontStyle:'bold'}},{content:num2(rep.liqTot.opening),styles:{fontStyle:'bold'}},{content:'+'+num2(rep.liqTot.entrate),styles:{fontStyle:'bold'}},{content:'−'+num2(rep.liqTot.uscite),styles:{fontStyle:'bold'}},{content:num2(rep.liqTot.closing),styles:{fontStyle:'bold'}}]);
    doc.autoTable({startY:37,head:[['Liquidità — '+periodoLabel,'Saldo iniz.','Entrate','Uscite','Saldo fin.']],body:liqBody,
      styles:{fontSize:8,cellPadding:1.5},headStyles:{fillColor:HEAD},columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}}});

    // helper per i prospetti a 2 colonne
    const finTable=(aoa,startY)=>{
      const body=aoa.slice(2).map(r=>{
        const label=r[0], val=r[1], hasVal=(typeof val==='number');
        const st = isBold(label)?{fontStyle:'bold',fillColor:TOT}:(isSub(label)?{fontStyle:'bold',fillColor:SUB}:{});
        return [{content:label,styles:st},{content:hasVal?num2(val):'',styles:{...st,halign:'right'}}];
      });
      doc.autoTable({startY,head:[[aoa[0][0],'€']],body,styles:{fontSize:8.5,cellPadding:1.6},headStyles:{fillColor:HEAD},columnStyles:{1:{halign:'right',cellWidth:38}}});
      return doc.lastAutoTable.finalY;
    };

    let y=doc.lastAutoTable.finalY+8;
    y=finTable(ceAoA(),y)+8;
    if(y>250){ doc.addPage(); y=20; }
    y=finTable(spAoA(),y)+8;
    if(y>250){ doc.addPage(); y=20; }
    finTable(rfAoA(),y);

    doc.save('Chiusura_'+slug()+'.pdf');
    toast('PDF generato','success');
  }

  if(!mk) return (<div><PageHead title="Chiusura mensile" sub="Fotografia contabile del mese"/><div className="empty-state">Nessun dato disponibile.</div></div>);

  const {liq,liqTot,ricavi,costi,totRicavi,totCosti,risultato,sp,rf}=rep;
  const deltaLiq=r2(liqTot.closing-liqTot.opening);

  return (
    <div>

          {[...mesi].reverse().map(k=><option key={k} value={k}>{meseNome(k)}</option>)}
        </select>
        <button className="btn ghost" onClick={exportPDF}>↓ PDF</button>
        <button className="btn accent" onClick={exportExcel}>↓ Excel</button>
      </PageHead>

      <div className="kpi-grid">
        <Kpi label="Entrate liquidità" value={eur(liqTot.entrate)} hint={periodoLabel}/>
        <Kpi label="Uscite liquidità" value={eur(liqTot.uscite)} hint={periodoLabel}/>
        <Kpi label="Δ Liquidità" value={eur(deltaLiq)} neg={deltaLiq<0} hint={mode==='progressivo'?'rispetto a inizio anno':'rispetto a fine mese prec.'}/>
        <Kpi accent label="Risultato economico" value={eur(risultato)} neg={risultato<0} hint={risultato>=0?'utile del periodo':'perdita del periodo'}/>
      </div>

      <div className="serif" style={{fontSize:18,margin:'26px 0 10px'}}>Liquidità — {mode==='progressivo'?'movimenti da inizio anno':'movimenti del mese'}</div>
      <div className="tbl-wrap">

          <tbody>
            {liq.map(x=>(
              <tr key={x.cod}>
                <td>{x.nome}</td>
                <td className="num">{num2(x.opening)}</td>
                <td className="num pos">{x.entrate?'+'+num2(x.entrate):num2(0)}</td>
                <td className="num neg">{x.uscite?'−'+num2(x.uscite):num2(0)}</td>

            <td className="num pos">{liqTot.entrate?'+'+num2(liqTot.entrate):num2(0)}</td>
            <td className="num neg">{liqTot.uscite?'−'+num2(liqTot.uscite):num2(0)}</td>

      <div className="serif" style={{fontSize:18,margin:'26px 0 10px'}}>Rendiconto finanziario — {mode==='progressivo'?'progressivo':'del mese'}</div>

            {rf.inv.length>0 && <tr><td style={{fontWeight:700,paddingTop:8}}>Investimenti</td><td className="num neg">{num2(rf.totInv)}</td></tr>}

            <tr className="rf-tot strong"><td>Disponibilità finali</td><td className="num">{num2(rf.fin)}</td></tr>
          </tbody>
        </table>
      </div>

      <div style={{fontSize:12,color:'var(--ink-3)',marginTop:14,fontStyle:'italic'}}>
        Report ricalcolato in tempo reale dal libro giornale — nessun dato viene scritto. In modalità <b>mensile</b> i flussi (liquidità, conto economico, rendiconto) coprono solo il mese selezionato; in <b>progressivo</b> vanno da gennaio al mese scelto. Lo <b>stato patrimoniale</b> è sempre una fotografia dei saldi a fine mese e non dipende dalla modalità. Nel rendiconto la riga «giroconti e movimenti non operativi» riconcilia il flusso operativo con la variazione effettiva di cassa.
      </div>
    </div>
  );
}

function PageCespiti({cespiti,setCespiti,toast}){
  const [edit,setEdit]=useState(null); // oggetto in editing o 'new'
  const blank={nome:'',classe:'II. IMMOBILIZZAZIONI MATERIALI',annoIni:new Date().getFullYear(),costoStorico:0,aliquota:0.2,quotaEs:0,fondo:0,note:''};
  const [form,setForm]=useState(blank);

  const vn = c => r2((c.costoStorico||0)-(c.fondo||0));
  const totCS=r2(cespiti.reduce((s,c)=>s+(c.costoStorico||0),0));
  const totFondo=r2(cespiti.reduce((s,c)=>s+(c.fondo||0),0));
  const totVN=r2(cespiti.reduce((s,c)=>s+vn(c),0));

  function openNew(){ setForm(blank); setEdit('new'); }
  function openEdit(c){ setForm({...c}); setEdit(c.id); }
  function save(){
    if(!form.nome){toast('Nome obbligatorio','error');return;}
    const f={...form,costoStorico:parseFloat(form.costoStorico)||0,aliquota:parseFloat(form.aliquota)||0,quotaEs:parseFloat(form.quotaEs)||0,fondo:parseFloat(form.fondo)||0,annoIni:parseInt(form.annoIni)||null};
    if(edit==='new') setCespiti([...cespiti,{...f,id:uid()}]);
    else setCespiti(cespiti.map(c=>c.id===edit?{...f,id:edit}:c));
    setEdit(null); toast('Cespite salvato','success');
  }
  function del(id){ if(window.confirm('Eliminare il cespite?')){ setCespiti(cespiti.filter(c=>c.id!==id)); toast('Cespite eliminato','success'); } }

  return (
    <div>
      <PageHead title="Cespiti" sub="Libro dei beni ammortizzabili">
        <button className="btn accent" onClick={openNew}>+ Nuovo cespite</button>
      </PageHead>
      <div className="kpi-grid">
        <Kpi label="Costo storico totale" value={eur(totCS)}/>
        <Kpi label="Fondo ammortamento" value={eur(totFondo)}/>
        <Kpi accent label="Valore netto contabile" value={eur(totVN)}/>
      </div>
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr><th>Cespite</th><th>Classe</th><th className="num">Anno</th><th className="num">Costo storico</th><th className="num">Aliquota</th><th className="num">Quota es.</th><th className="num">Fondo</th><th className="num">Valore netto</th><th></th></tr></thead>
          <tbody>
            {cespiti.map(c=>(
              <tr key={c.id}>
                <td><b>{c.nome}</b>{c.note&&<div style={{fontSize:11,color:'var(--ink-3)'}}>{c.note}</div>}</td>
                <td style={{fontSize:11}}>{c.classe}</td>
                <td className="num">{c.annoIni}</td>
                <td className="num">{num2(c.costoStorico)}</td>
                <td className="num">{((c.aliquota||0)*100).toFixed(0)}%</td>
                <td className="num">{num2(c.quotaEs)}</td>
                <td className="num">{num2(c.fondo)}</td>
                <td className="num">{num2(vn(c))}</td>
                <td><div style={{display:'flex',gap:4}}><button className="btn ghost sm" onClick={()=>openEdit(c)}>✎</button><button className="btn danger sm" onClick={()=>del(c.id)}>✕</button></div></td>
              </tr>
            ))}
          </tbody>
          <tfoot><tr><td colSpan="3" style={{fontWeight:600}}>Totali</td><td className="num" style={{fontWeight:600}}>{num2(totCS)}</td><td colSpan="2"></td><td className="num" style={{fontWeight:600}}>{num2(totFondo)}</td><td className="num" style={{fontWeight:600}}>{num2(totVN)}</td><td></td></tr></tfoot>
        </table>
      </div>

      {edit!==null && <div className="modal-bg" onClick={e=>{if(e.target.className==='modal-bg')setEdit(null);}}>
        <div className="modal">
          <div className="modal-head"><h3>{edit==='new'?'Nuovo cespite':'Modifica cespite'}</h3><button className="btn ghost sm" onClick={()=>setEdit(null)}>✕</button></div>
          <div className="modal-body"><div className="form-grid">
            <div className="form-row"><label>Nome</label><input type="text" value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})}/></div>
            <div className="form-row"><label>Classe</label><input type="text" value={form.classe} onChange={e=>setForm({...form,classe:e.target.value})}/></div>
            <div className="form-row"><label>Anno inizio</label><input type="number" value={form.annoIni} onChange={e=>setForm({...form,annoIni:e.target.value})}/></div>
            <div className="form-row"><label>Costo storico</label><input type="number" step="0.01" value={form.costoStorico} onChange={e=>setForm({...form,costoStorico:e.target.value})}/></div>
            <div className="form-row"><label>Aliquota (es. 0,20)</label><input type="number" step="0.01" value={form.aliquota} onChange={e=>setForm({...form,aliquota:e.target.value})}/></div>
            <div className="form-row"><label>Quota esercizio</label><input type="number" step="0.01" value={form.quotaEs} onChange={e=>setForm({...form,quotaEs:e.target.value})}/></div>
            <div className="form-row"><label>Fondo ammortamento</label><input type="number" step="0.01" value={form.fondo} onChange={e=>setForm({...form,fondo:e.target.value})}/></div>
            <div className="form-row"><label>Note</label><input type="text" value={form.note} onChange={e=>setForm({...form,note:e.target.value})}/></div>
          </div></div>
          <div className="modal-foot"><button className="btn ghost" onClick={()=>setEdit(null)}>Annulla</button><button className="btn accent" onClick={save}>Salva</button></div>
        </div>
      </div>}
    </div>
  );
}

/* mappa conti di ammortamento per "classe" normalizzata */
/* Firebase non accetta . # $ / [ ] nelle chiavi: le codifichiamo (es. "SPESE C/C") */
const FB_KEY_ESC={'/':'%2F','#':'%23','$':'%24','[':'%5B',']':'%5D','.':'%2E'};
function mappaToFB(m){ const o={}; Object.entries(m||{}).forEach(([k,v])=>{ o[String(k).replace(/%/g,'%25').replace(/[\/#$\[\].]/g,ch=>FB_KEY_ESC[ch])]=v; }); return o; }
function mappaFromFB(m){ const o={}; Object.entries(m||{}).forEach(([k,v])=>{ let kk=k; try{ kk=decodeURIComponent(k); }catch(e){} o[kk]=v; }); return o; }
function normKey(s){ return String(s||'').toUpperCase().replace(/\./g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim(); }
let AMM_COST = {}, AMM_FONDO = {};
function rebuildAmmMaps(){
  AMM_COST = {}; AMM_FONDO = {};
  CONTI.forEach(c=>{
    const up=c.nome.toUpperCase();
    if(c.categoria==='COSTI' && up.startsWith('AMMORTAMENTO')) AMM_COST[normKey(up.replace(/^AMMORTAMENTO/,''))]=c.codice;
    if(c.categoria==='RETTIFICA ATTIVO' && /^F\.?\s*AMMORTAMENTO/.test(up)) AMM_FONDO[normKey(up.replace(/^F\.?\s*AMMORTAMENTO/,''))]=c.codice;
  });
}
rebuildAmmMaps();

function PageAmmortamenti({cespiti, onAdd, updateCespiti, toast}){
  const [anno,setAnno]=useState(new Date().getFullYear());
  const piano = cespiti.map(c=>{
    const quotaTeorica = r2((c.costoStorico||0)*(c.aliquota||0));
    const vn = r2((c.costoStorico||0)-(c.fondo||0));
    const quota = r2(Math.min(quotaTeorica, Math.max(vn,0)));   // non oltre il residuo
    const annoFine = (c.aliquota>0 && c.annoIni) ? c.annoIni + Math.ceil(1/c.aliquota) - 1 : null;
    const residuo = vn>0.005;
    const k = normKey(c.classe);
    return {...c, quota, vn, annoFine, residuo, costCode:AMM_COST[k], fondoCode:AMM_FONDO[k]};
  });
  const totQuota=r2(piano.reduce((s,p)=>s+(p.residuo?p.quota:0),0));
  const totVN=r2(piano.reduce((s,p)=>s+p.vn,0));

  // anteprima scrittura: solo cespiti con quota>0 e conti collegati
  const daAmmortare = piano.filter(p=>p.residuo && p.quota>0.005);
  const collegati = daAmmortare.filter(p=>p.costCode && p.fondoCode);
  const scollegati = daAmmortare.filter(p=>!p.costCode || !p.fondoCode);
  const quotaScrittura = r2(collegati.reduce((s,p)=>s+p.quota,0));

  function generaScrittura(){
    if(collegati.length===0){ toast('Nessun cespite ammortizzabile collegato','error'); return; }
    if(!window.confirm(`Registrare l'ammortamento ${anno} per ${eur(quotaScrittura)} e aggiornare i fondi dei ${collegati.length} cespiti collegati?`)) return;
    // aggrega per conto (più cespiti possono condividere gli stessi conti)
    const dare={}, avere={};
    collegati.forEach(p=>{ dare[p.costCode]=r2((dare[p.costCode]||0)+p.quota); avere[p.fondoCode]=r2((avere[p.fondoCode]||0)+p.quota); });
    const righe=[ ...Object.entries(dare).map(([c,d])=>({c:parseInt(c),d,a:0})),
                  ...Object.entries(avere).map(([c,a])=>({c:parseInt(c),d:0,a})) ];
    onAdd({id:uid(),data:`${anno}-12-31`,descr:`Ammortamento esercizio ${anno}`,righe,origine:'manuale',tipo:'contabile'});
    // aggiorna i fondi sui cespiti collegati
    const ids=new Set(collegati.map(p=>p.id));
    updateCespiti(cespiti.map(c=>{
      if(!ids.has(c.id)) return c;
      const p=collegati.find(x=>x.id===c.id);
      return {...c, fondo:r2((c.fondo||0)+p.quota)};
    }));
    toast('Scrittura di ammortamento registrata','success');
  }

  return (
    <div>
      <PageHead title="Piano di Ammortamento" sub="Quote d'esercizio e valore residuo"/>

      <div className="card" style={{marginBottom:22}}>
        <div className="card-title">Genera scrittura di ammortamento di fine anno</div>
        <div style={{display:'flex',gap:14,alignItems:'flex-end',flexWrap:'wrap'}}>
          <div className="form-row" style={{maxWidth:140}}>
            <label>Esercizio</label>
            <input type="number" value={anno} onChange={e=>setAnno(parseInt(e.target.value)||anno)}/>
          </div>
          <div style={{flex:1,minWidth:220,background:'var(--panel-2)',borderRadius:6,padding:'10px 14px',fontSize:13,color:'var(--ink-2)'}}>
            Quota da registrare: <b>{eur(quotaScrittura)}</b> · cespiti collegati: <b>{collegati.length}</b>
            {scollegati.length>0 && <div style={{color:'var(--warn)',marginTop:4,fontSize:12}}>⚠ {scollegati.length} senza conto collegato (esclusi): {scollegati.map(p=>p.nome).join(', ')}</div>}
          </div>
          <button className="btn accent" onClick={generaScrittura} disabled={collegati.length===0}>Registra 31/12/{anno}</button>
        </div>
        {collegati.length>0 && <div className="tbl-wrap" style={{marginTop:14}}>
          <table className="tbl">
            <thead><tr><th>Cespite</th><th>Conto costo (Dare)</th><th>Fondo (Avere)</th><th className="num">Quota</th></tr></thead>
            <tbody>
              {collegati.map(p=>(
                <tr key={p.id}><td>{p.nome}</td><td style={{fontSize:12}}>{contoByCode[p.costCode].nome}</td>
                  <td style={{fontSize:12}}>{contoByCode[p.fondoCode].nome}</td><td className="num">{num2(p.quota)}</td></tr>
              ))}
            </tbody>
            <tfoot><tr><td colSpan="3" style={{fontWeight:600}}>Totale</td><td className="num" style={{fontWeight:600}}>{num2(quotaScrittura)}</td></tr></tfoot>
          </table>
        </div>}
      </div>

      <div className="kpi-grid">
        <Kpi accent label="Quota ammortamento esercizio" value={eur(totQuota)} hint="Beni ancora da ammortizzare"/>
        <Kpi label="Valore netto residuo" value={eur(totVN)}/>
        <Kpi label="N. cespiti" value={piano.length}/>
      </div>
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr><th>Cespite</th><th className="num">Costo storico</th><th className="num">Aliquota</th><th className="num">Quota annua</th><th className="num">Fondo</th><th className="num">Valore netto</th><th>Stato</th></tr></thead>
          <tbody>
            {piano.map(p=>(
              <tr key={p.id}>
                <td><b>{p.nome}</b>{p.annoFine&&<div style={{fontSize:11,color:'var(--ink-3)'}}>{p.annoIni}–{p.annoFine}</div>}</td>
                <td className="num">{num2(p.costoStorico)}</td>
                <td className="num">{((p.aliquota||0)*100).toFixed(0)}%</td>
                <td className="num">{num2(p.quota)}</td>
                <td className="num">{num2(p.fondo)}</td>
                <td className="num">{num2(p.vn)}</td>
                <td>{p.residuo?<span className="pill entrata">in ammortamento</span>:<span className="pill">completato</span>}</td>
              </tr>
            ))}
          </tbody>
          <tfoot><tr><td style={{fontWeight:600}}>Totali</td><td colSpan="2"></td><td className="num" style={{fontWeight:600}}>{num2(totQuota)}</td><td></td><td className="num" style={{fontWeight:600}}>{num2(totVN)}</td><td></td></tr></tfoot>
        </table>
      </div>
      <div style={{fontSize:12,color:'var(--ink-3)',marginTop:10,fontStyle:'italic'}}>Quota annua = costo storico × aliquota. Periodo stimato in base all'aliquota a quote costanti.</div>
    </div>
  );
}

/* ============================================================
   PAGINA: CONTI LIQUIDITÀ
   Aggiunta / rimozione dei conti di liquidità (categoria DISP. LIQUIDE):
   ogni conto creato qui compare automaticamente in Dashboard, Nuova
   scrittura, Snapshot, Rendiconto e Movimenti.
   ============================================================ */
const impNum = v => {
  let s=String(v==null?'':v).trim().replace(/[^\d.,-]/g,'');
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');   // formato italiano 1.234,56
  const n=parseFloat(s);
  return isNaN(n)?0:n;
};

function PageLiquidita({saldi, scritture, conti, setConti, saldiIni, setSaldiIni, toast}){
  const list = (conti && conti.length) ? conti : CONTI;
  const liq = list.filter(c=>c.categoria==='DISP. LIQUIDE').sort((a,b)=>a.codice-b.codice);
  const altri = list.filter(c=>c.categoria!=='DISP. LIQUIDE').sort((a,b)=>a.nome.localeCompare(b.nome,'it'));
  const [modo,setModo]=useState('nuovo');        // nuovo | collega
  const [nome,setNome]=useState('');
  const [ini,setIni]=useState('');
  const [collega,setCollega]=useState('');
  const [edit,setEdit]=useState(null);           // {codice, nome, ini}
  const [scoll,setScoll]=useState(null);         // {codice, cat}
  const [drill,setDrill]=useState(null);         // conto di cui mostrare i movimenti
  /* categorie di Stato Patrimoniale valide come destinazione dello scollega */
  const catSP = Array.from(new Set(list.filter(c=>c.prospetto==='SP' && c.categoria && c.categoria!=='DISP. LIQUIDE').map(c=>c.categoria))).sort();

  const nMov = cod => {
    let n=0;
    (scritture||[]).forEach(s=>{ if((s.righe||[]).some(r=>r.c===cod)) n++; });
    return n + MOVIMENTI.filter(m=>m.cod===cod).length;
  };

  const righe = liq.map(c=>({
    ...c,
    ini: r2(saldiIni[c.codice]||0),
    contabile: saldi[c.codice] ? saldi[c.codice].saldo : 0,
    reale: saldoRealeConto(c.codice, scritture),
    mov: nMov(c.codice),
  }));
  const totIni=r2(righe.reduce((s,x)=>s+x.ini,0));
  const totReale=r2(righe.reduce((s,x)=>s+x.reale,0));

  function aggiungi(){
    const n=(nome||'').trim().toUpperCase();
    if(!n){ toast&&toast('Inserisci il nome del conto','error'); return; }
    if(list.some(c=>String(c.nome||'').toUpperCase()===n)){ toast&&toast('Esiste già un conto con questo nome','error'); return; }
    const codice=list.reduce((m,c)=>Math.max(m,c.codice||0),0)+1;
    const nuovo={codice,nome:n,prospetto:'SP',categoria:'DISP. LIQUIDE',eccedenza:'DARE/AVERE'};
    setConti([...list,nuovo].sort((a,b)=>a.codice-b.codice));
    const v=r2(impNum(ini));
    if(v!==0) setSaldiIni({...saldiIni,[codice]:v});
    setNome(''); setIni('');
    toast&&toast(`Conto “${n}” creato e aggiunto alla liquidità`,'success');
  }

  /* converte un conto già presente nel piano dei conti in conto di liquidità */
  function collegaEsistente(){
    const cod=parseInt(collega,10);
    const c=list.find(x=>x.codice===cod);
    if(!c){ toast&&toast('Seleziona un conto dal piano dei conti','error'); return; }
    const mov=nMov(cod);
    const msg=mov>0
      ? `“${c.nome}” ha ${mov} moviment${mov===1?'o':'i'} già registrat${mov===1?'o':'i'}: verranno riclassificati come liquidità (categoria ${c.categoria} → DISP. LIQUIDE). Procedere?`
      : `Collegare “${c.nome}” ai conti di liquidità? La categoria passa da ${c.categoria} a DISP. LIQUIDE.`;
    if(!window.confirm(msg)) return;
    setConti(list.map(x=>x.codice===cod?{...x,categoria:'DISP. LIQUIDE',prospetto:'SP',eccedenza:'DARE/AVERE'}:x));
    const v=r2(impNum(ini));
    if(v!==0) setSaldiIni({...saldiIni,[cod]:v});
    setCollega(''); setIni('');
    toast&&toast(`“${c.nome}” collegato alla liquidità`,'success');
  }

  /* toglie il conto dalla liquidità senza eliminarlo dal piano dei conti */
  function confermaScollega(){
    if(!scoll) return;
    const c=list.find(x=>x.codice===scoll.codice);
    if(!c) { setScoll(null); return; }
    setConti(list.map(x=>x.codice===scoll.codice?{...x,categoria:scoll.cat}:x));
    const s={...saldiIni}; delete s[scoll.codice]; setSaldiIni(s);
    setScoll(null);
    toast&&toast(`“${c.nome}” spostato in ${scoll.cat}`,'success');
  }

  function elimina(c){
    const mov=nMov(c.codice);
    if(mov>0){ toast&&toast(`Impossibile eliminare: il conto ha ${mov} moviment${mov===1?'o':'i'}`,'error'); return; }
    if(!window.confirm(`Eliminare definitivamente il conto ${c.nome} dal piano dei conti?`)) return;
    setConti(list.filter(x=>x.codice!==c.codice));
    const s={...saldiIni}; delete s[c.codice]; setSaldiIni(s);
    toast&&toast('Conto eliminato','success');
  }

  function salvaEdit(){
    if(!edit) return;
    const n=(edit.nome||'').trim().toUpperCase();
    if(!n){ toast&&toast('Il nome non può essere vuoto','error'); return; }
    if(list.some(c=>c.codice!==edit.codice && String(c.nome||'').toUpperCase()===n)){ toast&&toast('Nome già usato da un altro conto','error'); return; }
    setConti(list.map(c=>c.codice===edit.codice?{...c,nome:n}:c));
    setSaldiIni({...saldiIni,[edit.codice]:r2(impNum(edit.ini))});
    setEdit(null);
    toast&&toast('Conto aggiornato','success');
  }

  return (
    <div>
      <PageHead title="Conti Liquidità" sub="Conti che compongono le disponibilità: cassa, conti correnti, carte prepagate"/>
      {drill!=null && <DrillCassa cod={drill} scritture={scritture} onClose={()=>setDrill(null)}/>}

      <div className="card" style={{marginBottom:18}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14,flexWrap:'wrap'}}>
          <div className="card-title" style={{margin:0}}>Aggiungi conto di liquidità</div>
          <div className="tipo-switch" style={{gridTemplateColumns:'1fr 1fr',maxWidth:320,marginLeft:'auto'}}>
            <button className={modo==='nuovo'?'active':''} onClick={()=>setModo('nuovo')}>Crea da zero</button>
            <button className={modo==='collega'?'active':''} onClick={()=>setModo('collega')}>Collega esistente</button>
          </div>
        </div>

        {modo==='nuovo' ? (
          <div className="form-inline">
            <div className="fld wide">
              <label>Nome conto <span className="req">*</span></label>
              <input type="text" value={nome} onChange={e=>setNome(e.target.value)}
                placeholder="ES. SATISPAY, REVOLUT, CASSA CONTANTI"
                onKeyDown={e=>{if(e.key==='Enter')aggiungi();}}/>
            </div>
            <div className="fld">
              <label>Saldo iniziale</label>
              <input type="text" inputMode="decimal" value={ini} onChange={e=>setIni(e.target.value)}
                placeholder="0,00" onKeyDown={e=>{if(e.key==='Enter')aggiungi();}}/>
            </div>
            <div className="actions"><button className="btn accent" onClick={aggiungi}>+ Crea conto</button></div>
          </div>
        ) : (
          <div className="form-inline">
            <div className="fld wide">
              <label>Conto dal piano dei conti <span className="req">*</span></label>
              <select value={collega} onChange={e=>setCollega(e.target.value)}>
                <option value="">— seleziona un conto —</option>
                {altri.map(c=><option key={c.codice} value={c.codice}>{c.codice} · {c.nome} ({c.categoria})</option>)}
              </select>
            </div>
            <div className="fld">
              <label>Saldo iniziale</label>
              <input type="text" inputMode="decimal" value={ini} onChange={e=>setIni(e.target.value)} placeholder="0,00"/>
            </div>
            <div className="actions"><button className="btn accent" onClick={collegaEsistente} disabled={!collega}>↔ Collega</button></div>
          </div>
        )}

        <div style={{fontSize:12,color:'var(--ink-3)',marginTop:12,fontStyle:'italic'}}>
          {modo==='nuovo'
            ? 'Il codice viene assegnato automaticamente. Il conto compare subito in Dashboard, Nuova scrittura, Snapshot e Rendiconto.'
            : 'Il conto selezionato viene riclassificato in DISP. LIQUIDE mantenendo codice, nome e movimenti già registrati.'}
        </div>
      </div>

      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr>
            <th style={{width:50}}>Cod</th><th>Conto</th>
            <th className="num">Saldo iniziale</th><th className="num">Saldo contabile</th><th className="num">Saldo reale</th>
            <th className="num" style={{width:70}}>Movim.</th><th style={{width:110}}></th>
          </tr></thead>
          <tbody>
            {righe.length===0 && <tr><td colSpan="7" className="empty-state">Nessun conto di liquidità</td></tr>}
            {righe.map(c=>{
              const inEdit = edit && edit.codice===c.codice;
              const inScoll = scoll && scoll.codice===c.codice;
              if(inScoll) return <tr key={c.codice} className="row-edit">
                <td className="mono">{c.codice}</td>
                <td colSpan="4" style={{fontSize:12.5}}>
                  Togli <b>{c.nome}</b> dalla liquidità e spostalo in:{' '}
                  <select value={scoll.cat} onChange={e=>setScoll(x=>({...x,cat:e.target.value}))} style={{width:'auto',display:'inline-block',marginLeft:6}}>
                    {catSP.map(k=><option key={k} value={k}>{k}</option>)}
                  </select>
                  <div style={{color:'var(--ink-3)',fontStyle:'italic',marginTop:5}}>Il conto resta nel piano dei conti con i suoi movimenti, ma esce da dashboard, rendiconto e snapshot.</div>
                </td>
                <td colSpan="2" style={{textAlign:'center',whiteSpace:'nowrap'}}>
                  <button className="btn accent sm" onClick={confermaScollega}>Conferma</button>
                  <button className="btn ghost sm" onClick={()=>setScoll(null)} style={{marginLeft:4}}>✕</button>
                </td>
              </tr>;
              return <tr key={c.codice} className={inEdit?'row-edit':''}>
                <td className="mono">{c.codice}</td>
                <td>{inEdit
                  ? <input type="text" value={edit.nome} onChange={e=>setEdit(x=>({...x,nome:e.target.value}))}
                      onKeyDown={e=>{if(e.key==='Enter')salvaEdit(); if(e.key==='Escape')setEdit(null);}} style={{width:'100%'}} autoFocus/>
                  : <b onClick={()=>setDrill(c.codice)} style={{cursor:'pointer',textDecoration:'underline dotted'}} title="Vedi i movimenti">{c.nome}</b>}</td>
                <td className="num">{inEdit
                  ? <input type="text" inputMode="decimal" value={edit.ini} onChange={e=>setEdit(x=>({...x,ini:e.target.value}))}
                      onKeyDown={e=>{if(e.key==='Enter')salvaEdit(); if(e.key==='Escape')setEdit(null);}} style={{width:100,textAlign:'right'}}/>
                  : <span className={c.ini<0?'neg':''}>{num2(c.ini)}</span>}</td>
                <td className={'num '+(c.contabile<0?'neg':'')}>{num2(c.contabile)}</td>
                <td className={'num '+(c.reale<0?'neg':'')} style={{fontWeight:600}}>{num2(c.reale)}</td>
                <td className="num" style={{fontSize:12,color:'var(--accent)',cursor:'pointer'}} onClick={()=>setDrill(c.codice)} title="Vedi i movimenti">{c.mov} →</td>
                <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                  {inEdit ? <>
                    <button className="btn accent sm" onClick={salvaEdit}>Salva</button>
                    <button className="btn ghost sm" onClick={()=>setEdit(null)} style={{marginLeft:4}}>✕</button>
                  </> : <>
                    <button onClick={()=>setEdit({codice:c.codice,nome:c.nome,ini:num2(c.ini)})}
                      title="Modifica nome e saldo iniziale"
                      style={{background:'transparent',border:'none',color:'var(--ink-3)',fontSize:14,padding:'2px 5px',cursor:'pointer'}}>✎</button>
                    <button onClick={()=>{setEdit(null);setScoll({codice:c.codice,cat:catSP[0]||'IMM. FINANZIARIE'});}} title="Togli dalla liquidità (il conto resta nel piano dei conti)"
                      style={{background:'transparent',border:'none',color:'var(--ink-3)',fontSize:14,padding:'2px 5px',cursor:'pointer'}}>⇱</button>
                    <button onClick={()=>elimina(c)} disabled={c.mov>0}
                      title={c.mov>0?'Conto con movimenti: non eliminabile':'Elimina dal piano dei conti'}
                      style={{background:'transparent',border:'none',color:c.mov>0?'var(--rule-2)':'var(--danger)',fontSize:15,lineHeight:1,padding:'2px 5px',cursor:c.mov>0?'not-allowed':'pointer'}}>✕</button>
                  </>}
                </td>
              </tr>;
            })}
          </tbody>
          <tfoot><tr>
            <td></td><td style={{fontWeight:700}}>Totale</td>
            <td className="num" style={{fontWeight:700}}>{num2(totIni)}</td>
            <td></td>
            <td className={'num '+(totReale<0?'neg':'')} style={{fontWeight:700}}>{num2(totReale)}</td>
            <td colSpan="2"></td>
          </tr></tfoot>
        </table>
      </div>
      <div style={{fontSize:12,color:'var(--ink-3)',marginTop:10,fontStyle:'italic'}}>
        ✎ modifica nome e saldo iniziale · ⇱ toglie il conto dalla liquidità lasciandolo nel piano dei conti · ✕ elimina (solo conti senza movimenti).
      </div>
    </div>
  );
}

/* ============================================================
   PAGINA: PIANO DEI CONTI
   ============================================================ */
function PagePianoConti({saldi, conti, setConti, toast}){
  const list = (conti && conti.length) ? conti : CONTI;
  const [q,setQ]=useState('');
  const [fProsp,setFProsp]=useState('');
  const [fCat,setFCat]=useState('');
  const [showAdd,setShowAdd]=useState(false);
  const nextCod = list.reduce((m,c)=>Math.max(m,c.codice||0),0)+1;
  const [form,setForm]=useState({codice:nextCod,nome:'',prospetto:'SP',categoria:'',eccedenza:'DARE'});
  const [edit,setEdit]=useState(null);   // {codice, nome, prospetto, categoria, eccedenza}
  const cats = Array.from(new Set(list.map(c=>c.categoria).filter(Boolean))).sort();

  const rows=list.filter(c=>
    (!q || c.nome.toLowerCase().includes(q.toLowerCase()) || String(c.codice)===q) &&
    (!fProsp || c.prospetto.startsWith(fProsp)) &&
    (!fCat || c.categoria===fCat)
  );

  const usato = cod => { const s=saldi[cod]; return !!(s&&(s.dare!==0||s.avere!==0)); };

  function aggiungi(){
    const nome=(form.nome||'').trim();
    const codice=parseInt(form.codice,10);
    if(!nome){ toast&&toast('Inserisci il nome del conto','error'); return; }
    if(!codice||codice<1){ toast&&toast('Codice non valido','error'); return; }
    if(list.some(c=>c.codice===codice)){ toast&&toast('Codice già esistente','error'); return; }
    if(list.some(c=>c.nome.toUpperCase()===nome.toUpperCase())){ toast&&toast('Esiste già un conto con questo nome','error'); return; }
    const categoria=(form.categoria||'').trim().toUpperCase()||'—';
    const nuovo={codice,nome:nome.toUpperCase(),prospetto:form.prospetto,categoria,eccedenza:form.eccedenza};
    setConti([...list,nuovo].sort((a,b)=>a.codice-b.codice));
    toast&&toast('Conto aggiunto','success');
    setForm({codice:codice+1,nome:'',prospetto:form.prospetto,categoria:form.categoria,eccedenza:'DARE'});
  }

  function elimina(c){
    if(usato(c.codice)){ toast&&toast('Impossibile eliminare: il conto ha movimenti','error'); return; }
    if(!window.confirm(`Eliminare il conto ${c.codice} · ${c.nome}?`)) return;
    setConti(list.filter(x=>x.codice!==c.codice));
    toast&&toast('Conto eliminato','success');
  }

  function apriEdit(c){ setShowAdd(false); setEdit({codice:c.codice,nome:c.nome,prospetto:c.prospetto,categoria:c.categoria,eccedenza:c.eccedenza}); }

  function salvaEdit(){
    if(!edit) return;
    const nome=(edit.nome||'').trim().toUpperCase();
    if(!nome){ toast&&toast('Il nome non può essere vuoto','error'); return; }
    if(list.some(c=>c.codice!==edit.codice && c.nome.toUpperCase()===nome)){ toast&&toast('Nome già usato da un altro conto','error'); return; }
    const categoria=(edit.categoria||'').trim().toUpperCase()||'—';
    const prec=list.find(c=>c.codice===edit.codice);
    if(prec && prec.categoria!==categoria && usato(edit.codice)){
      if(!window.confirm(`Il conto ha movimenti registrati. Cambiando categoria da ${prec.categoria} a ${categoria} i saldi verranno riclassificati nei prospetti. Procedere?`)) return;
    }
    setConti(list.map(c=>c.codice===edit.codice?{...c,nome,prospetto:edit.prospetto,categoria,eccedenza:edit.eccedenza}:c));
    setEdit(null);
    toast&&toast('Conto aggiornato','success');
  }

  return (
    <div>
      <PageHead title="Piano dei Conti" sub={`${list.length} conti · ${cats.length} categorie`}/>
      <div className="filters">
        <input type="text" placeholder="Cerca per nome o codice…" value={q} onChange={e=>setQ(e.target.value)}/>
        <span className="label">Prospetto</span>
        <select value={fProsp} onChange={e=>setFProsp(e.target.value)}><option value="">Tutti</option><option value="SP">Stato Patrimoniale</option><option value="CE">Conto Economico</option></select>
        <span className="label">Categoria</span>
        <select value={fCat} onChange={e=>setFCat(e.target.value)}>
          <option value="">Tutte</option>
          {cats.map(k=><option key={k} value={k}>{k}</option>)}
        </select>
        <div style={{flex:1}}></div>
        <button className="btn accent sm" onClick={()=>{setEdit(null);setShowAdd(s=>!s);}}>{showAdd?'Chiudi':'+ Nuovo conto'}</button>
      </div>

      {showAdd && <div className="card" style={{marginBottom:18}}>
        <div className="card-title" style={{marginBottom:14}}>Nuovo conto</div>
        <div className="form-inline">
          <div className="fld" style={{maxWidth:110}}>
            <label>Codice</label>
            <input type="number" value={form.codice} onChange={e=>setForm(f=>({...f,codice:e.target.value}))}/>
          </div>
          <div className="fld wide">
            <label>Nome conto <span className="req">*</span></label>
            <input type="text" value={form.nome} onChange={e=>setForm(f=>({...f,nome:e.target.value}))}
              placeholder="ES. SPESE VIAGGIO" onKeyDown={e=>{if(e.key==='Enter')aggiungi();}}/>
          </div>
          <div className="fld">
            <label>Prospetto</label>
            <select value={form.prospetto} onChange={e=>setForm(f=>({...f,prospetto:e.target.value}))}><option>SP</option><option>CE</option><option>CE/SP</option></select>
          </div>
          <div className="fld wide">
            <label>Categoria</label>
            <input list="pc-cat-list" value={form.categoria} onChange={e=>setForm(f=>({...f,categoria:e.target.value}))} placeholder="ES. COSTI"/>
            <datalist id="pc-cat-list">{cats.map(k=><option key={k} value={k}/>)}</datalist>
          </div>
          <div className="fld">
            <label>Eccedenza</label>
            <select value={form.eccedenza} onChange={e=>setForm(f=>({...f,eccedenza:e.target.value}))}><option>DARE</option><option>AVERE</option><option>DARE/AVERE</option></select>
          </div>
          <div className="actions">
            <button className="btn accent" onClick={aggiungi}>+ Aggiungi</button>
            <button className="btn ghost" onClick={()=>setShowAdd(false)}>Annulla</button>
          </div>
        </div>
        <div style={{fontSize:12,color:'var(--ink-3)',marginTop:12,fontStyle:'italic'}}>
          Categoria <b>DISP. LIQUIDE</b> = conto di liquidità: entra in dashboard, rendiconto e snapshot. Per quelli conviene usare la pagina Conti Liquidità, che imposta tutto e gestisce il saldo iniziale.
        </div>
      </div>}

      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr>
            <th style={{width:50}}>Cod</th><th>Conto</th><th style={{width:90}}>Prospetto</th><th>Categoria</th>
            <th style={{width:110}}>Eccedenza</th><th className="num">Saldo</th><th style={{width:80}}></th>
          </tr></thead>
          <tbody>
            {rows.length===0 && <tr><td colSpan="7" className="empty-state">Nessun conto corrisponde ai filtri</td></tr>}
            {rows.sort((a,b)=>a.codice-b.codice).map(c=>{
              const s=saldi[c.codice];
              const inUse=usato(c.codice);
              const inEdit = edit && edit.codice===c.codice;
              if(inEdit) return <tr key={c.codice} className="row-edit">
                <td className="mono">{c.codice}</td>
                <td><input type="text" value={edit.nome} onChange={e=>setEdit(x=>({...x,nome:e.target.value}))}
                  onKeyDown={e=>{if(e.key==='Enter')salvaEdit(); if(e.key==='Escape')setEdit(null);}} style={{width:'100%'}} autoFocus/></td>
                <td><select value={edit.prospetto} onChange={e=>setEdit(x=>({...x,prospetto:e.target.value}))}><option>SP</option><option>CE</option><option>CE/SP</option></select></td>
                <td><input list="pc-cat-list-edit" value={edit.categoria} onChange={e=>setEdit(x=>({...x,categoria:e.target.value}))} style={{width:'100%'}}/>
                  <datalist id="pc-cat-list-edit">{cats.map(k=><option key={k} value={k}/>)}</datalist></td>
                <td><select value={edit.eccedenza} onChange={e=>setEdit(x=>({...x,eccedenza:e.target.value}))}><option>DARE</option><option>AVERE</option><option>DARE/AVERE</option></select></td>
                <td className={'num '+(s&&s.saldo<0?'neg':'')}>{s&&(s.dare!==0||s.avere!==0)?num2(s.saldo):'—'}</td>
                <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                  <button className="btn accent sm" onClick={salvaEdit}>Salva</button>
                  <button className="btn ghost sm" onClick={()=>setEdit(null)} style={{marginLeft:4}}>✕</button>
                </td>
              </tr>;
              return <tr key={c.codice}>
                <td className="mono">{c.codice}</td><td><b>{c.nome}</b></td>
                <td><span className="pill">{c.prospetto}</span></td>
                <td style={{fontSize:12}}>{c.categoria}</td>
                <td style={{fontSize:12,color:'var(--ink-3)'}}>{c.eccedenza}</td>
                <td className={'num '+(s&&s.saldo<0?'neg':'')}>{s&&(s.dare!==0||s.avere!==0)?num2(s.saldo):'—'}</td>
                <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                  <button onClick={()=>apriEdit(c)} title="Modifica conto"
                    style={{background:'transparent',border:'none',color:'var(--ink-3)',fontSize:14,padding:'2px 6px',cursor:'pointer'}}>✎</button>
                  <button onClick={()=>elimina(c)} disabled={inUse}
                    title={inUse?'Conto con movimenti: non eliminabile':'Elimina conto'}
                    style={{background:'transparent',border:'none',color:inUse?'var(--rule-2)':'var(--danger)',fontSize:15,lineHeight:1,padding:'2px 6px',cursor:inUse?'not-allowed':'pointer'}}>✕</button>
                </td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
      <div style={{fontSize:12,color:'var(--ink-3)',marginTop:10,fontStyle:'italic'}}>
        ✎ modifica nome, prospetto, categoria ed eccedenza · ✕ elimina (solo conti senza movimenti). Il codice non è modificabile perché è il riferimento usato dalle scritture già registrate. Tutte le modifiche vengono salvate automaticamente.
      </div>
    </div>
  );
}

/* ============================================================
   PAGINA: EXPORT
   ============================================================ */
function PageExport({scritture, cespiti, saldi, categorie, toast}){
  const spce = ()=>{
    const saldoOf=c=>(saldi[c.codice]||{saldo:0}).saldo;
    const rc=cat=>CONTI.filter(c=>c.categoria===cat).map(c=>({nome:c.nome,saldo:saldoOf(c)})).filter(r=>Math.abs(r.saldo)>0.001);
    const ss=cat=>r2(CONTI.filter(c=>c.categoria===cat).reduce((s,c)=>s+saldoOf(c),0));
    const immMat=ss('IMM. MATERIALI'),immFin=ss('IMM. FINANZIARIE'),disp=ss('DISP. LIQUIDE'),fondi=ss('RETTIFICA ATTIVO');
    const attivo=r2(immMat+immFin+disp+fondi);
    const pn=ss('PATRIMONIO NETTO');
    const ricavi=r2(CONTI.filter(c=>c.categoria==='RICAVI').reduce((s,c)=>s-saldoOf(c),0));
    const costi=r2(CONTI.filter(c=>c.categoria==='COSTI').reduce((s,c)=>s+saldoOf(c),0));
    const risultato=r2(ricavi-costi);
    return {rc,immMat,immFin,disp,fondi,attivo,pn,passivoNetto:r2(-pn),ricavi,costi,risultato};
  };
  const spAoA = ()=>{
    const d=spce(); const o=[['STATO PATRIMONIALE','€']];
    o.push(['ATTIVO — Immobilizzazioni materiali','']); d.rc('IMM. MATERIALI').forEach(r=>o.push(['   '+r.nome,r.saldo]));
    o.push(['Immobilizzazioni finanziarie','']); d.rc('IMM. FINANZIARIE').forEach(r=>o.push(['   '+r.nome,r.saldo]));
    o.push(['Fondi ammortamento (−)','']); d.rc('RETTIFICA ATTIVO').forEach(r=>o.push(['   '+r.nome,r.saldo]));
    o.push(['Disponibilità liquide','']); d.rc('DISP. LIQUIDE').forEach(r=>o.push(['   '+r.nome,r.saldo]));
    o.push(['TOTALE ATTIVO',d.attivo]);
    o.push(['PASSIVO E NETTO — Patrimonio netto','']); d.rc('PATRIMONIO NETTO').forEach(r=>o.push(['   '+r.nome,r2(-r.saldo)]));
    o.push(["Risultato d'esercizio",d.risultato]);
    o.push(['TOTALE PASSIVO E NETTO',r2(d.passivoNetto+d.risultato)]);
    return o;
  };
  const ceAoA = ()=>{
    const d=spce(); const o=[['CONTO ECONOMICO','€']];
    o.push(['RICAVI','']); d.rc('RICAVI').forEach(r=>o.push(['   '+r.nome,r2(-r.saldo)]));
    o.push(['TOTALE RICAVI',d.ricavi]);
    o.push(['COSTI','']); d.rc('COSTI').forEach(r=>o.push(['   '+r.nome,r.saldo]));
    o.push(['TOTALE COSTI',d.costi]);
    o.push(["RISULTATO D'ESERCIZIO",d.risultato]);
    return o;
  };

  function buildWorkbook(){
    const wb=XLSX.utils.book_new();
    const add=(name,aoa)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),name);

    // Libro Giornale
    const gj=[['Data','Descrizione','Codice','Conto','Dare','Avere']];
    [...scritture].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).forEach(s=>s.righe.forEach((r,i)=>
      gj.push([i===0?s.data:'',i===0?s.descr:'',r.c,contoByCode[r.c]?.nome||'',r.d||'',r.a||''])));
    add('Libro Giornale',gj);

    // Movimenti (tutti)
    const mv=[['Data','Descrizione','Conto','Tipo','Dare','Avere']];
    [...scritture].sort((a,b)=>(b.data||'').localeCompare(a.data||'')).forEach(s=>s.righe.forEach(r=>
      mv.push([s.data,s.descr,contoByCode[r.c]?.nome||'',s.tipo,r.d||'',r.a||''])));
    add('Movimenti',mv);

    // Movimenti cassa importati
    const cs=[['Mese','Conto','Causale','Categoria','Metodo','Tipo','Importo']];
    MOVIMENTI.forEach(m=>cs.push([m.mese,m.conto,m.motivo,m.cat,m.metodo,m.tipo==='E'?'Entrata':'Uscita',m.imp]));
    add('Movimenti Cassa',cs);

    // Pivot / Bilancio di verifica
    const pv=[['Codice','Conto','Prospetto','Categoria','Dare','Avere','Saldo']];
    let td=0,ta=0;
    CONTI.forEach(c=>{const s=saldi[c.codice]||{dare:0,avere:0,saldo:0}; if(s.dare||s.avere){ pv.push([c.codice,c.nome,c.prospetto,c.categoria,s.dare,s.avere,s.saldo]); td+=s.dare; ta+=s.avere; }});
    pv.push(['','','','TOTALE',r2(td),r2(ta),r2(td-ta)]);
    add('Bilancio di Verifica',pv);

    // Rendiconto (mesi in colonna) — da scritture+categorie
    const rf=buildRendiconto(scritture,categorie);
    const rfHead=['Voce',...rf.mesi.map(rfMonthLabel),'Totale'];
    const rfRows=[['Disponibilità iniziali',...rf.mesi.map(k=>rf.dispIni[k]),rf.colTot.dispIni]];
    const pushSez=(label,tot,colT,rows)=>{ rfRows.push([label,...rf.mesi.map(k=>tot[k]||0),colT]); rows.forEach(r=>rfRows.push(['  '+r.nome,...rf.mesi.map(k=>r.perMese[k]||0),r.tot])); };
    pushSez('Entrate operative',rf.totEnt,rf.colTot.totEnt,rf.rows.entrata);
    pushSez('Uscite operative',rf.totUsc,rf.colTot.totUsc,rf.rows.uscita);
    if(rf.rows.investimento.length) pushSez('Investimenti',rf.totInv,rf.colTot.totInv,rf.rows.investimento);
    rfRows.push(['Flusso del periodo',...rf.mesi.map(k=>rf.flusso[k]),rf.colTot.flusso]);
    rfRows.push(['Disponibilità finali',...rf.mesi.map(k=>rf.dispFin[k]),rf.colTot.dispFin]);
    add('Rendiconto',[rfHead,...rfRows]);

    // Cespiti
    const ce=[['Cespite','Classe','Anno','Costo storico','Aliquota','Quota es.','Fondo','Valore netto']];
    cespiti.forEach(c=>ce.push([c.nome,c.classe,c.annoIni,c.costoStorico,c.aliquota,c.quotaEs,c.fondo,r2((c.costoStorico||0)-(c.fondo||0))]));
    add('Cespiti',ce);

    // Piano dei conti
    const pc=[['Codice','Nome','Prospetto','Categoria','Eccedenza']];
    CONTI.forEach(c=>pc.push([c.codice,c.nome,c.prospetto,c.categoria,c.eccedenza]));
    add('Piano dei Conti',pc);

    // Stato Patrimoniale e Conto Economico
    add('Stato Patrimoniale',spAoA());
    add('Conto Economico',ceAoA());

    return wb;
  }
  function exportExcel(){
    if(!window.XLSX){ toast('Libreria non caricata','error'); return; }
    XLSX.writeFile(buildWorkbook(),`Contabilita_${todayISO()}.xlsx`);
    toast('Export Excel completato','success');
  }
  function exportJson(){
    const data={scritture,cespiti,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`backup_contabilita_${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
    toast('Backup JSON scaricato','success');
  }

  // ---------- PDF ----------
  function pdfHeader(doc,titolo){
    const cx=doc.internal.pageSize.getWidth()/2;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('CONTABILITÀ PERSONALE',cx,18,{align:'center'});
    doc.setFontSize(11); doc.setFont('helvetica','normal');
    doc.text(titolo,cx,25,{align:'center'});
    doc.setFontSize(9); doc.setTextColor(120);
    doc.text(`Generato il ${new Date().toLocaleDateString('it-IT')}`,cx,31,{align:'center'});
    doc.setTextColor(0);
  }
  function finTable(doc,aoa,startY){
    const body=aoa.slice(1).map(r=>{
      const isHead=r[1]===''; const isTot=/^TOTALE|^RISULTATO/.test(r[0]);
      const st = isTot?{fontStyle:'bold',fillColor:[225,233,228]}:(isHead?{fontStyle:'bold',fillColor:[240,238,233]}:{});
      return [{content:r[0],styles:st},{content:(typeof r[1]==='number'?num2(r[1]):''),styles:{...st,halign:'right'}}];
    });
    doc.autoTable({startY,head:[[aoa[0][0],aoa[0][1]]],body,styles:{fontSize:9,cellPadding:1.6},headStyles:{fillColor:[31,79,143]},columnStyles:{1:{halign:'right',cellWidth:40}}});
    return doc.lastAutoTable.finalY;
  }
  function drawBilancioVerifica(doc){
    pdfHeader(doc,'Bilancio di Verifica');
    let td=0,ta=0; const rows=[];
    CONTI.forEach(c=>{const s=saldi[c.codice]||{dare:0,avere:0,saldo:0}; if(s.dare||s.avere){
      td+=s.dare; ta+=s.avere;
      rows.push([String(c.codice).padStart(2,'0'),c.nome,c.categoria,s.dare?num2(s.dare):'',s.avere?num2(s.avere):'',num2(Math.abs(s.saldo))+(s.saldo<0?' A':s.saldo>0?' D':'')]);
    }});
    rows.push([{content:'TOTALI',colSpan:3,styles:{fontStyle:'bold'}},{content:num2(r2(td)),styles:{fontStyle:'bold'}},{content:num2(r2(ta)),styles:{fontStyle:'bold'}},'']);
    doc.autoTable({startY:36,head:[['Cod','Conto','Categoria','Dare','Avere','Saldo']],body:rows,
      styles:{fontSize:8,cellPadding:1.5},headStyles:{fillColor:[31,79,143]},columnStyles:{3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}}});
  }
  function drawSPCE(doc){
    pdfHeader(doc,'Stato Patrimoniale e Conto Economico');
    let y=finTable(doc,spAoA(),36)+10;
    if(y>235){ doc.addPage(); y=20; }
    finTable(doc,ceAoA(),y);
  }
  function drawRendiconto(doc){
    pdfHeader(doc,'Rendiconto Finanziario');
    const rf=buildRendiconto(scritture,categorie);
    const body=[];
    body.push(['Disponibilità iniziali',...rf.mesi.map(k=>num2(rf.dispIni[k])),num2(rf.colTot.dispIni)]);
    const pushSez=(label,tot,colT,rows)=>{ body.push([{content:label,styles:{fontStyle:'bold',fillColor:[238,238,233]}},...rf.mesi.map(k=>({content:num2(tot[k]||0),styles:{fontStyle:'bold'}})),{content:num2(colT),styles:{fontStyle:'bold'}}]); rows.forEach(r=>body.push(['   '+r.nome,...rf.mesi.map(k=>num2(r.perMese[k]||0)),num2(r.tot)])); };
    pushSez('Entrate operative',rf.totEnt,rf.colTot.totEnt,rf.rows.entrata);
    pushSez('Uscite operative',rf.totUsc,rf.colTot.totUsc,rf.rows.uscita);
    if(rf.rows.investimento.length) pushSez('Investimenti',rf.totInv,rf.colTot.totInv,rf.rows.investimento);
    body.push([{content:'Flusso del periodo',styles:{fontStyle:'bold'}},...rf.mesi.map(k=>({content:num2(rf.flusso[k]),styles:{fontStyle:'bold'}})),{content:num2(rf.colTot.flusso),styles:{fontStyle:'bold'}}]);
    body.push([{content:'Disponibilità finali',styles:{fontStyle:'bold'}},...rf.mesi.map(k=>({content:num2(rf.dispFin[k]),styles:{fontStyle:'bold'}})),{content:num2(rf.colTot.dispFin),styles:{fontStyle:'bold'}}]);
    const halign={}; rf.mesi.forEach((_,i)=>halign[i+1]={halign:'right'}); halign[rf.mesi.length+1]={halign:'right'};
    doc.autoTable({startY:36,head:[['Voce',...rf.mesi.map(rfMonthLabel),'Totale']],body,styles:{fontSize:8,cellPadding:1.5},headStyles:{fillColor:[31,79,143]},columnStyles:halign});
  }
  function drawGiornale(doc){
    pdfHeader(doc,'Libro Giornale');
    const body=[];
    [...scritture].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).forEach(s=>{
      body.push([{content:`${fmtDate(s.data)} — ${s.descr}`,colSpan:3,styles:{fontStyle:'bold',fillColor:[240,238,233]}}]);
      s.righe.forEach(r=>body.push([(r.d>0?'':'    ')+ (contoByCode[r.c]?.nome||('#'+r.c)), r.d>0?num2(r.d):'', r.a>0?num2(r.a):'']));
    });
    doc.autoTable({startY:36,head:[['Conto','Dare','Avere']],body,styles:{fontSize:8,cellPadding:1.4},headStyles:{fillColor:[31,79,143]},columnStyles:{1:{halign:'right'},2:{halign:'right'}}});
  }
  function drawCespiti(doc){
    pdfHeader(doc,'Cespiti e Ammortamenti');
    const body=cespiti.map(c=>[c.nome,c.classe||'',num2(c.costoStorico||0),((c.aliquota||0)*100).toFixed(0)+'%',num2(r2((c.costoStorico||0)*(c.aliquota||0))),num2(c.fondo||0),num2(r2((c.costoStorico||0)-(c.fondo||0)))]);
    doc.autoTable({startY:36,head:[['Cespite','Classe','Costo storico','Aliq.','Quota','Fondo','Valore netto']],body,styles:{fontSize:8,cellPadding:1.5},headStyles:{fillColor:[31,79,143]},columnStyles:{2:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}}});
  }
  function newDoc(landscape){ const {jsPDF}=window.jspdf; return new jsPDF({orientation:landscape?'landscape':'portrait',unit:'mm',format:'a4'}); }
  function exportBilancioPDF(){ if(!window.jspdf){toast('Libreria PDF non caricata','error');return;} const doc=newDoc(); drawBilancioVerifica(doc); doc.save(`Bilancio_di_Verifica_${todayISO()}.pdf`); toast('PDF generato','success'); }
  function exportSPCEPDF(){ if(!window.jspdf){toast('Libreria PDF non caricata','error');return;} const doc=newDoc(); drawSPCE(doc); doc.save(`Bilancio_SP_CE_${todayISO()}.pdf`); toast('PDF generato','success'); }
  function exportRendicontoPDF(){ if(!window.jspdf){toast('Libreria PDF non caricata','error');return;} const doc=newDoc(true); drawRendiconto(doc); doc.save(`Rendiconto_${todayISO()}.pdf`); toast('PDF generato','success'); }
  function exportGiornalePDF(){ if(!window.jspdf){toast('Libreria PDF non caricata','error');return;} const doc=newDoc(); drawGiornale(doc); doc.save(`Libro_Giornale_${todayISO()}.pdf`); toast('PDF generato','success'); }
  function exportPacchettoPDF(){
    if(!window.jspdf){toast('Libreria PDF non caricata','error');return;}
    const doc=newDoc();
    doc.setFont('helvetica','bold'); doc.setFontSize(26); doc.text('CONTABILITÀ PERSONALE',105,90,{align:'center'});
    doc.setFontSize(13); doc.setFont('helvetica','normal'); doc.text('Pacchetto completo dei prospetti',105,103,{align:'center'});
    doc.setFontSize(10); doc.setTextColor(120); doc.text(`Generato il ${new Date().toLocaleDateString('it-IT')}`,105,113,{align:'center'}); doc.setTextColor(0);
    doc.addPage(); drawBilancioVerifica(doc);
    doc.addPage(); drawSPCE(doc);
    doc.addPage('a4','landscape'); drawRendiconto(doc);
    doc.addPage('a4','portrait'); drawGiornale(doc);
    doc.addPage(); drawCespiti(doc);
    doc.save(`Pacchetto_completo_${todayISO()}.pdf`); toast('Pacchetto PDF generato','success');
  }

  const Card=({title,desc,sheets,btn,onClick,gold})=>(
    <div className="card" style={{display:'flex',flexDirection:'column',gap:10}}>
      <div className="card-title serif" style={{fontSize:16}}>{title}</div>
      <div style={{color:'var(--ink-2)',fontSize:13,flex:1}}>{desc}</div>
      {sheets && <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{sheets.map(s=><span key={s} className="pill">{s}</span>)}</div>}
      <button className={'btn '+(gold?'':'accent')} style={gold?{background:'var(--gold)',borderColor:'var(--gold)',alignSelf:'flex-start'}:{alignSelf:'flex-start'}} onClick={onClick}>{btn}</button>
    </div>
  );

  return (
    <div>
      <PageHead title="Export" sub="Scarica i dati della contabilità"/>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:16}}>
        <Card title="Esporta in Excel"
          desc="Cartella .xlsx con tutti i prospetti, pronta da aprire o ricaricare nel tuo foglio di lavoro."
          sheets={['Libro Giornale','Movimenti','Bilancio di Verifica','Stato Patrimoniale','Conto Economico','Rendiconto','Cespiti','Piano dei Conti']}
          btn="↓ Scarica Excel" onClick={exportExcel}/>
        <Card title="Backup dati (JSON)"
          desc="Copia di sicurezza di scritture e cespiti. Utile da conservare prima di modifiche importanti."
          btn="↓ Scarica backup" onClick={exportJson} gold/>

        <div className="card" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div className="card-title serif" style={{fontSize:16}}>Esporta in PDF</div>
          <div style={{color:'var(--ink-2)',fontSize:13,flex:1}}>Documenti stampabili dei prospetti principali, pronti da archiviare o condividere.</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            <button className="btn" onClick={exportBilancioPDF}>Bilancio di Verifica</button>
            <button className="btn" onClick={exportSPCEPDF}>Stato Patrim. + Conto Econ.</button>
            <button className="btn" onClick={exportRendicontoPDF}>Rendiconto</button>
            <button className="btn" onClick={exportGiornalePDF}>Libro Giornale</button>
          </div>
        </div>

        <div className="card" style={{display:'flex',flexDirection:'column',gap:10,borderColor:'var(--accent)',background:'var(--accent-soft)'}}>
          <div className="card-title serif" style={{fontSize:16}}>Pacchetto completo</div>
          <div style={{color:'var(--ink-2)',fontSize:13,flex:1}}>Un unico PDF con tutti i prospetti: bilancio di verifica, stato patrimoniale, conto economico, rendiconto finanziario, libro giornale e cespiti.</div>
          <button className="btn accent" style={{alignSelf:'flex-start'}} onClick={exportPacchettoPDF}>↓ Scarica pacchetto PDF</button>
        </div>
      </div>
    </div>
  );
}


/* ============================================================
   PAGINA: IMPORT  (estratto conto -> scritture)
   Formato standard atteso (intestazioni, ordine libero):
   Data | Conto | Tipo | Categoria | Descrizione | Importo
   ============================================================ */
let LIQ_ALIAS = {};
function rebuildLiqAlias(){ const m={}; CONTI.filter(c=>c.categoria==='DISP. LIQUIDE').forEach(c=>{ m[normKey(c.nome)]=c.codice; }); m['PREPAGATA']=9; m['BPER']=1; m['CONTO']=1; LIQ_ALIAS=m; }
rebuildLiqAlias();
function resolveLiq(v){ const k=normKey(v); if(LIQ_ALIAS[k]!=null) return LIQ_ALIAS[k]; for(const a in LIQ_ALIAS){ if(k.includes(a)||a.includes(k)) return LIQ_ALIAS[a]; } return ''; }
function parseDataCell(v){
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*86400*1000)); return isNaN(d)?'':d.toISOString().slice(0,10); }
  const s=String(v||'').trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let[_,d,mo,y]=m; if(y.length===2)y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(m){ return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`; }
  return '';
}
/* --- Strumento: trova ed elimina le scritture duplicate in un periodo --- */
function PulisciDuplicati({scritture, onDeleteMany, toast}){
  const y=new Date().getFullYear();
  const [da,setDa]=useState(`${y}-09-01`);
  const [a,setA]=useState(`${y}-09-15`);
  const [res,setRes]=useState(null);
  const [open,setOpen]=useState(false);
  const impOf=s=>r2((s.righe||[]).reduce((t,r)=>t+(r.d||0),0));

  function cerca(){
    const inRange=(scritture||[]).filter(s=>s.data && s.data>=da && s.data<=a);
    const map=new Map();
    inRange.forEach(s=>{ const k=scrKey(s); if(!map.has(k)) map.set(k,[]); map.get(k).push(s); });
    const gruppi=[...map.values()].filter(v=>v.length>1)
      .map(v=>{ const ord=[...v].sort((x,z)=>String(x.id).localeCompare(String(z.id))); return {tieni:ord[0], doppi:ord.slice(1)}; })
      .sort((g1,g2)=>String(g1.tieni.data).localeCompare(String(g2.tieni.data)));
    const nDel=gruppi.reduce((s,g)=>s+g.doppi.length,0);
    setRes({gruppi,nDel,tot:inRange.length});
    if(!gruppi.length) toast('Nessun duplicato trovato nel periodo','success');
  }
  function elimina(){
    if(!res||!res.nDel) return;
    const ids=[]; res.gruppi.forEach(g=>g.doppi.forEach(d=>ids.push(d.id)));
    if(!window.confirm(`Eliminare ${ids.length} scritture duplicate dal ${fmtDate(da)} al ${fmtDate(a)}?\nDi ogni movimento ripetuto resta una sola copia. L'operazione non è reversibile.`)) return;
    onDeleteMany(ids);
    toast(`${ids.length} duplicati eliminati`,'success');
    setRes(null);
  }

  return (
    <div className="card" style={{marginTop:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,flexWrap:'wrap'}}>
        <div>
          <div className="card-title" style={{marginBottom:2}}>Pulizia duplicati</div>
          <div style={{fontSize:12.5,color:'var(--ink-2)'}}>Cerca le scritture ripetute (stessa data, descrizione, conti e importo) in un periodo e lascia una sola copia.</div>
        </div>
        <button className="btn ghost" onClick={()=>{setOpen(o=>!o); setRes(null);}}>{open?'Chiudi':'Apri strumento'}</button>
      </div>

      {open && <div style={{marginTop:14}}>
        <div style={{display:'flex',gap:10,alignItems:'flex-end',flexWrap:'wrap'}}>
          <div className="form-row" style={{margin:0}}><label>Dal</label><input type="date" value={da} onChange={e=>{setDa(e.target.value); setRes(null);}}/></div>
          <div className="form-row" style={{margin:0}}><label>Al</label><input type="date" value={a} onChange={e=>{setA(e.target.value); setRes(null);}}/></div>
          <button className="btn" onClick={cerca}>Cerca duplicati</button>
          {res && res.nDel>0 && <button className="btn danger" onClick={elimina}>🗑 Elimina {res.nDel} duplicat{res.nDel===1?'o':'i'}</button>}
        </div>

        {res && <div style={{marginTop:12}}>
          <div style={{fontSize:13,color:'var(--ink-2)',marginBottom:8}}>
            {res.tot} scritture nel periodo · <b>{res.gruppi.length}</b> movimenti ripetuti · <b style={{color:res.nDel?'var(--danger)':'inherit'}}>{res.nDel}</b> copie in eccesso da eliminare
          </div>
          {res.gruppi.length>0 && <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr><th style={{width:100}}>Data</th><th>Descrizione</th><th>Categoria</th><th className="num">Importo</th><th className="num">Copie</th><th className="num">Da eliminare</th></tr></thead>
              <tbody>
                {res.gruppi.map((g,i)=>(
                  <tr key={i}>
                    <td>{fmtDate(g.tieni.data)}</td>
                    <td>{g.tieni.descr}</td>
                    <td>{g.tieni.cat||'—'}</td>
                    <td className="num">{num2(impOf(g.tieni))}</td>
                    <td className="num">{g.doppi.length+1}</td>
                    <td className="num" style={{color:'var(--danger)'}}>{g.doppi.length}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>}
        </div>}
        <div style={{fontSize:12,color:'var(--ink-3)',marginTop:10,fontStyle:'italic'}}>Suggerimento: scarica prima un backup JSON dalla pagina Export.</div>
      </div>}
    </div>
  );
}

function PageImport({onAddMany, mappa, setMappa, categorie, setCategorie, toast, scritture, onDeleteMany}){
  const [rows,setRows]=useState([]);
  const [fileName,setFileName]=useState('');
  const [sheets,setSheets]=useState([]);
  const [wbRef,setWbRef]=useState(null);
  const [nuovaCat,setNuovaCat]=useState(null);   // {rowIndex, nome, sezione}
  const [importing,setImporting]=useState(false); // blocca il doppio click sul tasto Importa
  const busyRef=useRef(false);
  const fileRef=useRef(null);

  // nk(nome) -> nome esatto in anagrafica, per riconoscere le categorie del file
  const catEsistenti={}; const catSezioni={};
  (categorie||[]).forEach(c=>{ if(c&&c.nome){ catEsistenti[nk(c.nome)]=c.nome; catSezioni[nk(c.nome)]=c.sezione; } });

  /* sezioni ammesse per una riga: entrata → Entrate, uscita → Uscite/Investimenti,
     giroconto tra conti di liquidità → Interne */
  const sezioniDi = r => LIQ_CODES.includes(r.contro) ? ['interno'] : (r.tipo==='E' ? ['entrata'] : ['uscita','investimento']);
  const sezDefaultDi = r => LIQ_CODES.includes(r.contro) ? 'interno' : (r.tipo==='E' ? 'entrata' : 'uscita');

  function detect(headers){
    const H=headers.map(h=>normKey(h));
    const find=cands=>{ for(let i=0;i<H.length;i++){ if(cands.some(c=>{const cc=c.toUpperCase(); return H[i]===cc||H[i].includes(cc);})) return i; } return -1; };
    return {
      data:find(['data','date','giorno','valuta']),
      conto:find(['conto','metodo','c c','account']),
      tipo:find(['tipo','segno','entrata uscita','dare avere']),
      cat:find(['categoria','category']),
      descr:find(['descrizione','causale','motivo','operazione','dettaglio']),
      importo:find(['importo','amount','valore','euro']),
    };
  }
  function parseSheet(wb, name){
    try{
      const ws=wb.Sheets[name];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
      if(aoa.length<2){ toast('Foglio vuoto o senza dati','error'); setRows([]); return; }
      const hdr=aoa[0]; const col=detect(hdr);
      if(col.importo<0||col.data<0){ toast('Nel foglio mancano le colonne Data e/o Importo','error'); setRows([]); return; }
      const out=[];
      for(let i=1;i<aoa.length;i++){
        const r=aoa[i]; if(!r||r.every(c=>c===''||c==null)) continue;
        const raw=r[col.importo];
        let imp;
        if(typeof raw==='number'){ imp=raw; }
        else {
          let str=String(raw).replace(/[€\s]/g,'').trim();
          if(str.includes(',')){ str=str.replace(/\./g,'').replace(',','.'); } // formato italiano 1.234,56
          imp=parseFloat(str);
        }
        if(isNaN(imp)||imp===0) continue;
        let tipo;
        if(col.tipo>=0){ const t=normKey(r[col.tipo]); tipo=(t.startsWith('E')||t.includes('ENTRAT')||t==='D')?'E':'U'; }
        else tipo = imp<0?'U':'E';
        imp=Math.abs(imp);
        const catFile=col.cat>=0?String(r[col.cat]||'').trim():'';
        const cod = col.conto>=0?resolveLiq(r[col.conto]):1;
        // la categoria del file vale solo se esiste già in anagrafica…
        let cat = catFile && catEsistenti[nk(catFile)] ? catEsistenti[nk(catFile)] : '';
        const contro = mappa&&mappa[normKey(catFile)]!=null ? mappa[normKey(catFile)]
                     : (mappa&&cat&&mappa[normKey(cat)]!=null ? mappa[normKey(cat)] : '');
        // …e solo se la sua sezione è coerente col verso della riga
        if(cat){
          const sez=catSezioni[nk(cat)];
          const ok = LIQ_CODES.includes(contro) ? ['interno'] : (tipo==='E' ? ['entrata'] : ['uscita','investimento']);
          if(sez && !ok.includes(sez)) cat='';
        }
        out.push({ data:parseDataCell(r[col.data]), cod, tipo, cat, catFile,
          descr: col.descr>=0?String(r[col.descr]||'').trim():'', importo:r2(imp), contro });
      }
      setRows(out);
      toast(`${out.length} movimenti letti da "${name}"`,'success');
    }catch(err){ console.error(err); toast('Errore nella lettura del foglio','error'); }
  }
  function onFile(e){
